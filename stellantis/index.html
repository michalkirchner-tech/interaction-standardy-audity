<style>
/* Layout: sticky top bar + section sidebar + single-column form; print renders every section as the A4 audit sheet. */
:root{
  --ink:#14172E;
  --brand:#262B7A;
  --brand-deep:#1A1E58;
  --accent:#1AA3E8;
  --brand-soft:#E8EAF8;
  --paper:#F4F5F9;
  --card:#FFFFFF;
  --line:#D8DBE8;
  --steel:#5A6078;
  --good:#1F7A4A; --good-soft:#E1F2E8;
  --warn:#A8620A; --warn-soft:#FBEED6;
  --bad:#B3261E;  --bad-soft:#F9E3E1;
  --radius:8px;
  color-scheme:light;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.45;
}
h1,h2,h3{margin:0 0 4px 0; font-weight:600;}
p{margin:0 0 8px 0;}
button{font-family:inherit;}
.num{font-variant-numeric:tabular-nums;}

.app{display:grid; grid-template-columns:250px minmax(0,1fr); min-height:100vh;}
.topbar{
  grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  background:linear-gradient(135deg,var(--brand-deep),var(--brand)); color:#fff;
  padding:10px 22px; position:sticky; top:0; z-index:50; border-bottom:3px solid var(--accent);
}
.brand{display:flex; align-items:baseline; gap:14px; min-width:0;}
.brand .name{font-weight:700; font-size:1.05rem; letter-spacing:.02em;}
.brand .sub{color:#C9CDF0; font-size:.84rem; border-left:1px solid rgba(255,255,255,.3); padding-left:14px;}
.topbar-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.btn{border:1px solid transparent; border-radius:6px; padding:9px 14px; font-size:.88rem; cursor:pointer; transition:background .12s ease;}
.btn-primary{background:var(--accent); color:#06203A; font-weight:600;}
.btn-primary:hover{background:#4DB9F0;}
.btn-ghost{background:transparent; color:#fff; border-color:rgba(255,255,255,.35);}
.btn-ghost:hover{background:rgba(255,255,255,.1);}
.btn-line{background:#fff; color:var(--brand); border-color:var(--line);}
.btn-line:hover{background:var(--brand-soft);}
.btn:focus-visible,.nav-item:focus-visible,.dropdown-item:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.save-note{font-size:.78rem; color:#C9CDF0; min-width:90px; text-align:right;}
.folder-status{font-size:.78rem; color:#C9CDF0;}
.folder-status button{background:none; border:none; color:#C9CDF0; text-decoration:underline; font-size:.78rem; cursor:pointer; padding:0;}

.dropdown-wrap{position:relative;}
.btn-icon{display:inline-flex; align-items:center; gap:7px;}
.dropdown-menu{position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(20,23,46,.18); min-width:220px; padding:6px; z-index:60;}
.dropdown-item{display:block; width:100%; text-align:left; background:none; border:none; border-radius:6px; padding:9px 12px; font-size:.88rem; color:var(--ink); cursor:pointer;}
.dropdown-item:hover{background:var(--brand-soft); color:var(--brand);}

.modal-overlay{position:fixed; inset:0; background:rgba(20,23,46,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-overlay[hidden]{display:none !important;}
.modal-box{background:#fff; border-radius:12px; width:100%; max-width:480px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:1rem; color:var(--brand); margin:0;}
.modal-close{background:none; border:none; font-size:1.4rem; line-height:1; color:var(--steel); cursor:pointer; padding:0 4px;}
.modal-body{overflow-y:auto; padding:8px;}
.modal-item{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left; background:none; border:none; border-radius:8px; padding:11px 12px; cursor:pointer; font-size:.9rem; color:var(--ink);}
.modal-item:hover{background:var(--brand-soft);}
.modal-item-name{font-weight:600; word-break:break-all;}
.modal-item-date{font-size:.78rem; color:var(--steel); white-space:nowrap;}
.modal-empty{padding:24px 14px; text-align:center; color:var(--steel); font-size:.9rem;}
.modal-text{padding:12px 16px; font-size:.9rem;}
.modal-actions{display:flex; flex-direction:column; gap:8px; padding:4px 16px 16px;}
.modal-match-list{padding:0 14px 6px;}

.sidebar{background:#fff; border-right:1px solid var(--line); padding:18px 12px 24px; position:sticky; top:60px; height:calc(100vh - 60px); overflow-y:auto;}
.nav-group-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--steel); margin:16px 10px 6px;}
.nav-group-label:first-child{margin-top:2px;}
.nav-item{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; padding:10px 12px; border-radius:6px; border:none; background:transparent; color:var(--ink); font-size:.9rem; cursor:pointer; margin-bottom:2px;}
.nav-item:hover{background:var(--brand-soft);}
.nav-item.active{background:var(--brand); color:#fff;}
.nav-item .chip{font-size:.72rem; padding:2px 7px; border-radius:999px; background:var(--line); color:var(--steel); white-space:nowrap; font-variant-numeric:tabular-nums;}
.nav-item.done .chip{background:var(--good-soft); color:var(--good);}
.nav-item.active .chip{background:rgba(255,255,255,.2); color:#fff;}

.main{padding:26px 34px 80px; max-width:1000px; min-width:0;}
.section{display:none;}
.section.active{display:block;}
.section-head{margin-bottom:18px;}
.section-head h2{font-size:1.5rem; color:var(--brand);}
.section-head .desc{color:var(--steel); font-size:.92rem;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:18px;}
.card h3{font-size:1rem; color:var(--brand); margin-bottom:14px;}
.field-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 20px;}
.field-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.field-grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.sub-label{font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--steel); margin:16px 0 10px; padding-top:14px; border-top:1px dashed var(--line);}
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field label,.field .lbl{font-size:.8rem; color:var(--steel);}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
  border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:.92rem; font-family:inherit; color:var(--ink); background:#fff; width:100%;
}
.field textarea{resize:vertical; min-height:70px;}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.yn{display:flex; gap:16px; flex-wrap:wrap;}
.yn label{display:flex; align-items:center; gap:6px; font-size:.9rem; color:var(--ink); cursor:pointer;}
.yn input{accent-color:var(--brand); width:17px; height:17px;}

.brand-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px;}
.brand-chip{display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:6px; padding:9px 12px; cursor:pointer; font-size:.9rem; background:#fff;}
.brand-chip input{accent-color:var(--brand); width:17px; height:17px;}
.brand-chip.on{border-color:var(--brand); background:var(--brand-soft); font-weight:600;}

.progress-bar{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
.progress-bar>i{display:block; height:100%; background:var(--accent);}
.result-banner{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-radius:8px; padding:14px 18px; margin:0 0 14px; background:var(--warn-soft); border:1px solid #EBCB93;}
.result-banner.ok{background:var(--good-soft); border-color:#B9DDC8;}
.rb-label{font-size:.82rem; color:var(--steel);}
.rb-value{font-size:1.25rem; font-weight:700; color:var(--warn);}
.result-banner.ok .rb-value{color:var(--good);}
.rb-right{text-align:right;}
.hint{font-size:.84rem; color:var(--steel); margin:10px 0 0;}

/* criteria rows */
.crit-head,.row{display:grid; grid-template-columns:46px minmax(0,.9fr) minmax(0,1.6fr) 104px 34px 64px; gap:0 12px; align-items:start;}
.crit-head .h-chk{text-align:center;}
.row>.chk{justify-self:center;}
.crit-head .h-pt{display:none;}
.crit-head{padding:0 2px 8px; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--steel); border-bottom:1px solid var(--line);}
.row{padding:11px 2px; border-bottom:1px dashed var(--line);}
.row:last-child{border-bottom:none;}
.row .rn{font-weight:600; color:var(--brand); font-variant-numeric:tabular-nums; padding-top:1px;}
.row .rk{font-weight:600; font-size:.92rem;}
.row .rp{font-size:.92rem; min-width:0; overflow-wrap:anywhere;}
.row .rp .na-note{display:block; font-size:.78rem; color:var(--steel); margin-top:3px;}
.row .pt{display:none;}
.chk{position:relative; width:22px; height:22px; flex-shrink:0; margin-top:1px;}
.chk input{position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%; cursor:pointer;}
.chk .box{position:absolute; inset:0; border:2px solid #AEB3C8; border-radius:5px; background:#fff; display:flex; align-items:center; justify-content:center; pointer-events:none;}
.chk input:checked~.box{background:var(--brand); border-color:var(--brand);}
.chk .box::after{content:''; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(40deg) translate(-1.5px,-1.5px); opacity:0;}
.chk input:checked~.box::after{opacity:1;}
.chk input:focus-visible~.box{outline:2px solid var(--accent); outline-offset:2px;}
.chk input:disabled{cursor:default;}
.photo-btn{display:flex; align-items:center;}
.photo-btn-icon{display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--steel); cursor:pointer; padding:0;}
.photo-btn-icon:hover{border-color:var(--brand); color:var(--brand);}
.photo-btn.done .photo-btn-icon{background:var(--good-soft); border-color:var(--good); color:var(--good);}
.spec-btn{display:inline-flex; align-items:center; justify-content:center; gap:5px; height:28px; padding:0 10px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--brand); font-size:.78rem; cursor:pointer; white-space:nowrap;}
.spec-btn::after{content:'\25BE'; font-size:.8rem; transition:transform .12s ease;}
.spec-btn:hover{border-color:var(--brand); background:var(--brand-soft);}
.spec-btn.on{background:var(--brand); border-color:var(--brand); color:#fff;}
.spec-btn.on::after{transform:rotate(180deg);}
.spec-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.spec-panel{display:flex; flex-wrap:wrap; align-items:flex-start; gap:14px 22px; margin:4px 0 10px; padding:14px 18px; background:var(--brand-soft); border:1px solid #CBD0EE; border-radius:8px;}
.spec-text{flex:1 1 260px; min-width:0;}
.spec-title{font-weight:600; color:var(--brand); margin-bottom:6px;}
.spec-count{display:inline-block; margin:0 0 8px; padding:2px 10px; font-size:.8rem; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink);}
.spec-body{font-size:.92rem; margin:0;}
.spec-img{flex:0 1 300px; max-width:100%; min-width:0;}
.spec-img img{display:block; max-width:100%; height:auto; background:#fff; border:1px solid var(--line); border-radius:6px;}
.area-head-print,.area-foot,.print-cover,.print-foot,#missing-report{display:none;}

/* results */
.results-table{width:100%; border-collapse:collapse;}
.results-table th,.results-table td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:.9rem;}
.results-table th{color:var(--steel); font-weight:600; font-size:.74rem; text-transform:uppercase; letter-spacing:.05em;}
.results-table td.n{font-variant-numeric:tabular-nums; font-weight:600;}
.dot{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:8px; vertical-align:-1px; background:var(--good);}
.dot.warn{background:#E39A1C;}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:600;}
.badge.ok{background:var(--good-soft); color:var(--good);}
.badge.warn{background:var(--warn-soft); color:var(--warn);}
.rule-note{background:#EEF0F7; border:1px solid var(--line); border-radius:6px; padding:12px 16px; font-size:.9rem;}
.rule-note b,.rule-note .red{color:var(--bad); font-weight:400;}
.sign-box{border:1px solid var(--line); border-radius:8px; background:#fff; min-height:72px; padding:10px 14px; display:flex; flex-direction:column; justify-content:center; gap:2px; font-size:.9rem; color:var(--brand);}
.sign-box .s1{font-weight:600;}
.sign-actions{display:flex; gap:8px; margin-bottom:8px;}
.sign-actions button{font-size:.78rem;}
.def-wrap{overflow-x:auto;}
.def-table{width:100%; border-collapse:collapse; min-width:760px;}
.def-table th,.def-table td{border:1px solid var(--line); padding:6px; vertical-align:top; font-size:.88rem;}
.def-table th{background:#EEF0F7; color:var(--brand); text-align:left; font-size:.76rem; text-transform:uppercase; letter-spacing:.04em;}
.def-table td.k{width:26%;}
.def-table .act{width:40px; text-align:center; border:none; background:none;}
.def-del{width:30px; height:30px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--steel); font-size:1.1rem; line-height:1; cursor:pointer;}
.def-del:hover:not(:disabled){border-color:var(--bad); color:var(--bad);}
.def-del:disabled{opacity:.35; cursor:default;}
.def-table select{width:100%; border:1px solid var(--line); border-radius:4px; padding:6px; font:inherit; font-size:.88rem; background:#FAFBFE; color:var(--ink);}
.def-table textarea,.def-table input{width:100%; border:1px solid transparent; border-radius:4px; padding:5px 6px; font:inherit; font-size:.88rem; background:#FAFBFE; resize:vertical;}
.def-table textarea{min-height:54px;}
.def-table textarea:focus,.def-table input:focus{outline:2px solid var(--accent); border-color:transparent;}
.def-sub{display:block; font-weight:400; color:var(--steel); font-size:.78rem; margin-top:3px; white-space:normal;}
.def-empty{color:var(--good); font-weight:600; padding:6px 0;}


.footer-nav{display:flex; justify-content:space-between; gap:10px; margin-top:26px;}

@media screen and (max-width:1024px){
  .field-grid.cols-3,.field-grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media screen and (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);}
  .topbar{padding:10px 14px; row-gap:10px;}
  .brand .sub{display:none;}
  .topbar-actions{width:100%; justify-content:flex-end;}
  .topbar-actions .save-note{flex-basis:100%; text-align:left; order:10; min-width:0;}
  .btn{padding:8px 12px; font-size:.82rem;}
  .sidebar{position:sticky; top:0; height:auto; display:flex; flex-wrap:nowrap; align-items:center; gap:6px; padding:10px 12px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); z-index:40;}
  .nav-group-label{display:none;}
  .nav-item{flex-shrink:0; width:auto; white-space:nowrap; padding:9px 13px;}
  .main{padding:18px 16px 60px;}
  .field-grid,.field-grid.cols-3,.field-grid.cols-4{grid-template-columns:minmax(0,1fr);}
  .field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{font-size:16px; padding:10px 12px;}
  .chk{width:26px; height:26px;}
  .crit-head{display:none;}
  .row{grid-template-columns:minmax(0,1fr) 34px 34px; grid-template-areas:"rn photo chk" "rk photo chk" "rp photo chk" "spec photo chk"; gap:2px 10px;}
  .row>.spec-btn{grid-area:spec; justify-self:start; margin-top:6px;}
  .row>.chk{grid-area:chk;} .row>.rn{grid-area:rn;} .row>.rk{grid-area:rk;} .row>.rp{grid-area:rp;} .row>.photo-btn{grid-area:photo;}
  .row>.rk:empty{display:none;}
  .footer-nav .btn{flex:1 1 auto; text-align:center;}
  .card{padding:16px;}
}

/* ---------- Print: A4 audit sheet ---------- */
@page{size:A4; margin:10mm 10mm 14mm 10mm;}
@media print{
  html{font-size:11.5px;}
  body{background:#fff; color:#000;}
  .topbar,.sidebar,.footer-nav,.no-print,.section-head .desc,.result-banner,.hint,.modal-overlay{display:none !important;}
  .app{display:block;}
  .main{max-width:none; padding:0;}
  .section{display:block !important;}
  .print-foot{display:flex; position:fixed; bottom:0; left:0; right:0; justify-content:space-between; font-size:.72rem; font-style:italic; color:#444; border-top:1px solid #bbb; padding-top:2px;}
  .print-cover{display:flex; flex-direction:column; justify-content:space-between; min-height:250mm; break-after:page;}
  .print-cover .pc-top{padding-top:8mm; text-align:center; font-size:2rem; letter-spacing:.3em; font-weight:700; color:var(--brand);}
  .print-cover .pc-brands{text-align:center; font-size:.95rem; color:#333; margin-top:4mm;}
  .print-cover .pc-box{border:2px solid #000; padding:8mm 12mm; margin:0 12mm; display:grid; grid-template-columns:34mm 1fr; gap:4mm 6mm; font-size:1.05rem;}
  .print-cover .pc-box b{font-weight:700;}
  .print-cover .pc-box span.v{border-bottom:1px dashed #666; min-height:1.3em;}
  .print-cover .pc-title{text-align:center; font-size:2rem; font-weight:700; margin:20mm 0 40mm;}
  .section-head{margin-bottom:4px; break-after:avoid;}
  .section-head h2{font-size:1.15rem;}
  .sec-zaklad .section-head{display:none;}
  .card{border-color:#bbb; padding:8px 12px; margin-bottom:8px; break-inside:avoid;}
  .card h3{background:#A6A6A6; color:#000; text-align:center; text-transform:uppercase; font-size:.9rem; padding:3px; margin:-8px -12px 8px;}
  .field-grid{gap:4px 14px;}
  .field input,.field select,.field textarea{border:none !important; border-bottom:1px dashed #666 !important; border-radius:0 !important; padding:1px 2px !important; background:none !important; font-size:.95rem !important;}
  .brand-grid{grid-template-columns:repeat(3,1fr);}
  .brand-chip{border:none; padding:1px 0; font-size:.9rem; background:none !important;}
  .brand-chip.on{font-weight:700;}
  .brand-chip:not(.on){color:#777;}
  .brand-chip::after{content:"";}
  .area-head-print{display:block; background:#A6A6A6; border:2px solid #000; border-bottom:none; text-align:center; font-weight:700; padding:3px; break-after:avoid;}
  .sec-area .card{padding:0; border:none; margin-bottom:6px;}
  .sec-area .card h3{display:none;}
  .crit{border:2px solid #000;}
  .crit-head,.row{grid-template-columns:12mm 48mm minmax(0,1fr) 20mm; gap:0;}
  .crit-head{display:grid; padding:0; color:#000; background:#D9D9D9; font-size:.72rem; border-bottom:1px solid #000;}
  .crit-head>span{padding:2px 4px;}
  .crit-head .h-chk,.crit-head .h-photo,.crit-head .h-spec{display:none;}
  .crit-head .h-pt{display:block;}
  .row{padding:0; border-bottom:1px solid #000; break-inside:avoid;}
  .row>.chk,.row>.photo-btn{display:none !important;}
  .row>*{padding:3px 5px; border-right:1px solid #999;}
  .row>.pt{display:block; text-align:center; border-right:none; font-weight:600;}
  .row.unmet>.rn,.row.unmet>.rk,.row.unmet>.rp,.row.unmet>.pt{color:var(--bad); font-weight:700;}
  .row .rk{font-weight:500;}
  .area-foot{display:flex; justify-content:space-between; font-size:.9rem; padding:2px 6px 8px;}
  #sec-vysledky{break-before:page;}
  .sec-vysledky .card{break-inside:auto;}
  .results-table th,.results-table td{padding:3px 8px; font-size:.9rem;}
  .rule-note{font-size:.85rem; padding:6px 10px;}
  .sign-actions{display:none;}
  .sign-box{min-height:40px; border:none; border-bottom:1px dashed #666; border-radius:0; padding:2px 4px;}
  .def-wrap{overflow:visible;}
  .def-table{min-width:0;}
  .def-table th,.def-table td{border-color:#666;}
  .def-table textarea,.def-table input{border:none; background:none; resize:none;}
  .def-table .act{display:none;}
  .def-table select{border:none; background:none; appearance:none; -webkit-appearance:none; padding:2px; font-weight:600;}
  .def-table tr{break-inside:avoid;}

var SPEC = {"1.1":{"t":"Pořizování a uchovávání fotografií vozidla při příjmu: vozidlo ze všech stran, místo poškození, popř. nesouvisející poškození. V rámci certifikačního auditu proběhne namátková kontrola 3 uzavřených/ukončených zakázek (opravy vozidel po nehodách)."},"1.2":{"t":"Pořizování a uchovávání fotografií zásadních kroků opravy při opravě vozidla pro doložení pracovního postupu, včetně fotodokumentace provedení dokončovacích prací a antikorozní ochrany. V rámci certifikačního auditu proběhne namátková kontrola 3 uzavřených/ukončených zakázek (opravy vozidel po nehodách)."},"1.3":{"t":"Zakázky pro nehody mají svou vlastní řadu, odlišnou od běžných zakázek. V rámci certifikačního auditu proběhne namátková kontrola 3 uzavřených/ukončených zakázek (opravy vozidel po nehodách)."},"1.4":{"t":"Zakázky, včetně konečné faktury a v případě subdodávky i dodavatelské faktury, jsou archivovány vytištěné nebo v elektronické podobě. V rámci certifikačního auditu proběhne namátková kontrola 3 uzavřených/ukončených zakázek (opravy vozidel po nehodách)."},"1.5":{"t":"Kontrola kvality se zaznamenává do interního formuláře, který je součástí archivované složky se zakázkovým listem. Formulář kontroly kvality musí být vytištěný ke každé zakázce. Do formuláře kvality zaznamenávají jednotlivá pracoviště informace o provedení prací. Formulář kvality slouží také jako předávací formulář mezi jednotlivými pracovišti. Povinnost řádně vyplňovat formulář kvality se vztahuje také na externí dodavatele práce (externí karosárny/lakovny). Vyplněný formulář kvality musí být archivován v papírové, nebo elektronické podobě. V rámci certifikačního auditu proběhne namátková kontrola 3 uzavřených/ukončených zakázek (opravy vozidel po nehodách). Používání formuláře bude v rámci certifikačního auditu kontrolováno také u rozpracovaných vozidel na dílně."},"1.6":{"t":"„Dentreflektor“ – pruhová nebo rastrová clona pro usnadnění identifikace a fotodokumentace promáčklin a důlků karoserie. Dentreflek doložit absolvování školení Karoserie I. a Karoserie II., nebo absolvovat do 6 měsíců od data provedení certifikačního auditu. Školení budou vypisována průběžně. Školení pro karosáře jsou pro jednotlivé značky importéra skupiny Emil Frey navzájem uznatelná."},"1.12":{"t":"Přístup pro karosáře (pro každou zastoupenou značku). Karosář musí mít přístup do opravárenských manuálů všech zastoupených značek. V rámci certifikačního auditu bude vyžadováno předvedení základní orientace v manuálech. V případě externí karosárny je podmínkou doložení vytištěných podkladů z opravárenského manuálu k opravě, pokud není zajištěn vlastní přístup do opravárenského manuálu."},"1.13":{"t":"V průběhu celého procesu opravy jsou dodržovány předepsané technologické postupy stanovené výrobcem. Např. postup a materiály pro antikorozní ochranu, druhy svárů, používání výrobcem předepsaného vybavení. Prověření znalostí karosářů a jejich povědomí o správném postupu opravy a souladu s opravárenským manuálem daného výrobce."},"1.14":{"t":"Min. 750 luxů. Měření se provádí kalibrovaným luxmetrem v pracovní výšce 1 metr od země, na všech pracovištích v karosárně."},"1.15":{"t":"Manipulační plochy mají zpevněný povrch. V prostoru karosárny by neměly být žádné „zbytečné“ věci nesouvisející s opravou nebo s vybavením dílny (např. staré díly, prázdné obaly, staré nefunkční vybavení apod.). Správné skladování nových ND a ND po lakování (před montáží)."},"2.1":{"t":"2K (dvoukomponentní) epoxid spray EP 4017, nebo adekvátní komerční náhrada. Kontrola skladových zásob, kontrola odepisování do zakázek, kontrola poměru spotřeby vs. průchodů dílnou. Obecná spotřeba cca 1/2 spreje na jednu opravu. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"2.2":{"t":"Vyžadováno pouze pro značky Peugeot, Citroën, DS a Opel. Zařízení pro obnovu zinkové vrstvy karoserie. Kontrola vybavení. Zařízení musí být ve funkčním stavu. Prověření znalosti karosářů a jejich povědomí o správném používání zařízení. Může být nahrazeno plněním kritéria 2.1."},"2.3":{"t":"Wieländer Schill CBR 2109, nebo adekvátní komerční náhrada. Kontrola skladových zásob, kontrola odepisování do zakázek, kontrola poměru spotřeby vs. průchodů dílnou. Obecná spotřeba cca 1/3 kartuše na jednu opravu. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"2.4":{"t":"Teroson EP 5055, nebo EP 5065, nebo PU 6700. Kontrola skladových zásob, kontrola odepisování do zakázek, kontrola poměru spotřeby vs. průchodů dílnou. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"2.5":{"t":"MS 9320 SF, nebo PU 9100, nebo PU 9200. Kontrola skladových zásob, kontrola odepisování do zakázek, kontrola poměru spotřeby vs. průchodů dílnou. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"2.6":{"t":"Měděný 1K sprej TSP 530, nebo adekvátní komerční náhrada. Kontrola skladových zásob, kontrola odepisování do zakázek. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"2.7":{"t":"Teroson PU 9500 – ochrana proti hluku a vibracím. Kontrola skladových zásob, kontrola odepisování do zakázek, kontrola poměru spotřeby vs. průchodů dílnou. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"2.8":{"t":"Teroson HV 400, nebo WX 400, nebo WT 450. Kontrola skladových zásob, kontrola odepisování do zakázek, kontrola poměru spotřeby vs. průchodů dílnou. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"2.9":{"t":"Teroson MS 9320 SF, nebo WT S3000, nebo WT R2000. Kontrola skladových zásob, kontrola odepisování do zakázek, kontrola poměru spotřeby vs. průchodů dílnou. Prověření znalosti karosářů a jejich povědomí o správném používání materiálu."},"3.1":{"t":"Sada obsahující min. 5 ks. Pro demontáž interiérových panelů dveří apod., různé tvary a velikosti, v udržovaném funkčním stavu.","n":"1 sada / karosář","i":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQAB function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function newRow(){ return {kriterium:'', nedostatek:'', opatreni:'', osoba:'', termin:''}; }

  return {
    meta:{ partner:'', cisloDealera:'', ic:'', ulice:'', psc:'', mesto:'', vedeni:'', vedouciServisu:'', poradce:'', pocetKarosaru:'',

  };
}
var state = newState();

function brandsSelected(){ return BRANDS.some(function(b){ return state.meta.brands[b[0]]; }); }
function needsZinc(){ return !brandsSelected() || ZINC_BRANDS.some(function(k){ return state.meta.brands[k]; }); }
function isNA(id){ return id==='2.2' && !needsZinc(); }
function isMet(id){ return !!state.checks[id] || isNA(id); }
function areaStats(ids){
  var done=0, max=0;
  ids.forEach(function(aid){ AREAS[aid].items.forEach(function(it){ max++; if (isMet(it[0])) done++; }); });
  return {done:done, max:max, ok: done===max};
}
function allOk(){ return RESULT_AREAS.every(function(r){ return areaStats(r.ids).ok; }); }
function unmetItems(){
  var out=[];
  AREA_ORDER.forEach(function(aid){ AREAS[aid].items.forEach(function(it){ if (!isMet(it[0])) out.push({area:aid, id:it[0], k:it[1], p:it[2]}); }); });
  return out;
}

/* ================= DOM helpers ================= */
var PROPS = {checked:1, disabled:1, selected:1, value:1, hidden:1};
function h(tag, attrs, kids){
  var e=document.createElement(tag); attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if (k==='class') e.className=v;
    else if (k==='for') e.htmlFor=v;
    else if (k==='html') e.innerHTML=v;
    else if (k.indexOf('on')===0 && typeof v==='function') e.addEventListener(k.slice(2), v);
    else if (PROPS[k]) e[k]=v;
    else if (v!==null && v!==undefined) e.setAttribute(k, v);
  });
  (kids||[]).forEach(function(c){ if (c===null||c===undefined) return; e.appendChild(typeof c==='string' ? document.createTextNode(c) : c); });
  return e;
}
var uid = 0;
function nextId(p){ uid++; return p+'-'+uid; }

function formatDate(d){ if(!d) return '—'; return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function isoToCz(iso){ if(!iso) return '—'; var d=new Date(iso+'T00:00:00'); return isNaN(d.getTime()) ? '—' : formatDate(d); }

function fText(label, obj, key, opts){
  opts=opts||{}; var id=nextId('f');
  var input=h('input',{type:opts.type||'text', id:id, value:obj[key]||'', placeholder:opts.placeholder||null});
  if (opts.inputmode) input.setAttribute('inputmode', opts.inputmode);
  input.addEventListener('input', function(){ obj[key]=input.value; scheduleAutosave(); if (opts.onInput) opts.onInput(input.value); });
  return h('div',{class:'field'},[h('label',{for:id},[label]), input]);
}

function fCheck(label, obj, key){

}

/* ================= ARES ================= */
var aresStatus = {};
function formatPsc(p){ var s=String(p||'').replace(/\D+/g,''); return s.length===5 ? s.slice(0,3)+' '+s.slice(3) : s; }
function uliceFromSidlo(s){
  if(!s) return '';
  var c=''; if(s.cisloDomovni) c=String(s.cisloDomovni); if(s.cisloOrientacni) c+='/'+s.cisloOrientacni;
  if(s.nazevUlice) return (s.nazevUlice+' '+c).trim();
  if(s.nazevCastiObce) return (s.nazevCastiObce+' '+c).trim();
  return ((s.nazevObce||'')+(c?' '+c:'')).trim();
}
async function lookupAres(cfg){
  var ico=String(cfg.obj[cfg.ic]||'').replace(/\s+/g,'');
  if(!/^\d{8}$/.test(ico)) return;
  aresStatus[cfg.status]='loading'; renderAll();
  try{
    var res=await fetch('https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/'+ico,{headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('ARES HTTP '+res.status);
    var d=await res.json();
    if(!d || (!d.obchodniJmeno && !d.sidlo)) throw new Error('Subjekt nenalezen');
    if(d.obchodniJmeno) cfg.obj[cfg.name]=d.obchodniJmeno;
    var u=uliceFromSidlo(d.sidlo); if(u) cfg.obj[cfg.ulice]=u;
    if(d.sidlo && d.sidlo.psc) cfg.obj[cfg.psc]=formatPsc(d.sidlo.psc);
    if(d.sidlo && d.sidlo.nazevObce) cfg.obj[cfg.mesto]=d.sidlo.nazevObce;
    aresStatus[cfg.status]='success'; scheduleAutosave();
  }catch(err){ console.error('ARES lookup failed', err); aresStatus[cfg.status]='error'; }
  renderAll();
}
function fIco(label, cfg){
  var id=nextId('ic');
  var input=h('input',{type:'text', id:id, value:cfg.obj[cfg.ic]||'', maxlength:'8'});
  input.setAttribute('inputmode','numeric');
  input.addEventListener('input', function(){ cfg.obj[cfg.ic]=input.value; scheduleAutosave(); if(/^\d{8}$/.test(input.value.replace(/\s+/g,''))) lookupAres(cfg); });
  var wrap=h('div',{class:'field'},[h('label',{for:id},[label]), input]);
  var st=aresStatus[cfg.status];
  if(st==='loading') wrap.appendChild(h('div',{class:'hint no-print',style:'margin:0'},['Načítám údaje z ARES…']));
  else if(st==='success') wrap.appendChild(h('div',{class:'hint no-print',style:'margin:0;color:var(--good)'},['✓ Doplněno z ARES']));
  else if(st==='error'){
    var e=h('div',{class:'hint no-print',style:'margin:0;color:var(--bad)'},['Nepodařilo se dohledat, vyplňte prosím ručně nebo zkontrolujte na ']);
    e.appendChild(h('a',{href:'https://or.justice.cz/ias/ui/rejstrik-$firma?ico='+encodeURIComponent((cfg.obj[cfg.ic]||'').replace(/\s+/g,'')), target:'_blank', rel:'noopener', style:'color:var(--bad)'},['justice.cz']));
    wrap.appendChild(e);
  }
  return wrap;
}

/* ================= Autosave (localStorage) ================= */
var DRAFT_KEY='stellantis-karosarna-audit-draft';
var saveNoteEl=document.getElementById('saveNote');
var autosaveTimer=null;
function note(txt, ms){ if(!saveNoteEl) return; saveNoteEl.textContent=txt; if(ms) setTimeout(function(){ saveNoteEl.textContent=''; }, ms); }
function scheduleAutosave(){ if(autosaveTimer) clearTimeout(autosaveTimer); autosaveTimer=setTimeout(function(){ saveLocal(true); }, 1000); }
function serializeState(){ return JSON.stringify(state); }
function saveLocal(silent){
  try{ localStorage.setItem(DRAFT_KEY, serializeState()); note(silent?'Koncept uložen ✓':'Uloženo ✓', 2500); }
  catch(err){ console.error('Autosave error', err); }
}
function applyLoaded(l){
  var base=newState();
  state.meta=Object.assign(base.meta, l.meta||{});
  state.meta.brands=Object.assign({}, (l.meta&&l.meta.brands)||{});
  state.meta.ext=Object.assign(base.meta.ext, (l.meta&&l.meta.ext)||{});
  state.checks=l.checks||{}; state.photographed=l.photographed||{}; state.photos=l.photos||{}; state.radky=emptyRows(); if(Array.isArray(l.radky)){ while(state.radky.length<l.radky.length) state.radky.push(newRow()); l.radky.forEach(function(r,i){ state.radky[i]=Object.assign(newRow(), r||{}); }); }
  state.poznamky=l.poznamky||''; state.vedeniJmeno=l.vedeniJmeno||'';
  state.sig=Object.assign({auditor:null, vedeni:null}, l.sig||{});
}
function loadLocal(){
  try{ var raw=localStorage.getItem(DRAFT_KEY); if(raw) applyLoaded(JSON.parse(raw)); }
  catch(err){ console.log('No local draft', err); }
  renderAll();
}
function looksLikeDraft(l){ return l && typeof l==='object' && l.meta && l.checks && l.meta.karosarnaExterni!==undefined; }

/* ================= Save / load to file or synced folder ================= */
function slugify(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase(); }
function slug(){ return state.meta.partner ? slugify(state.meta.partner) : 'koncept'; }
function draftFileName(){ return 'stellantis_'+slug()+'_'+todayIso()+'.json'; }
function downloadDraft(){
  var fname=draftFileName();
  var url=URL.createObjectURL(new Blob([serializeState()],{type:'application/json'}));
  var a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  return fname;
}
var IS_MOBILE=/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
var FS_OK=!IS_MOBILE && (typeof window.showDirectoryPicker==='function') && !!window.isSecureContext;
var folderHandle=null;
function idbOpen(){ return new Promise(function(res,rej){ var r=indexedDB.open('stellantis-audit-fs',1); r.onupgradeneeded=function(){ r.result.createObjectStore('handles'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
function idbSet(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('handles','readwrite'); tx.objectStore('handles').put(v,k); tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); }; }); }); }
function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ var r=db.transaction('handles','readonly').objectStore('handles').get(k); r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ rej(r.error); }; }); }); }
async function ensurePerm(hd){ var o={mode:'readwrite'}; try{ if((await hd.queryPermission(o))==='granted') return true; if((await hd.requestPermission(o))==='granted') return true; }catch(e){ console.error(e); } return false; }
function updateFolderStatus(){
  var s=document.getElementById('folderStatus'); s.innerHTML='';
  if(folderHandle){ s.appendChild(document.createTextNode('● Složka: '+folderHandle.name+' ')); var b=document.createElement('button'); b.type='button'; b.textContent='(změnit)'; b.addEventListener('click', function(){ connectFolder().catch(function(){}); }); s.appendChild(b); }
}
async function connectFolder(){
  var hd=await window.showDirectoryPicker({id:'stellantis-databaze', mode:'readwrite'});
  folderHandle=hd; try{ await idbSet('databaze', hd); }catch(e){ console.error(e); }
  updateFolderStatus(); return hd;
}
async function getFolder(prompt){
  if(folderHandle && await ensurePerm(folderHandle)) return folderHandle;
  folderHandle=null;
  try{ var st=await idbGet('databaze'); if(st && await ensurePerm(st)){ folderHandle=st; updateFolderStatus(); return st; } }catch(e){ console.error(e); }
  if(!prompt) return null;
  return connectFolder();
}
async function findDrafts(hd){
  var out=[], pre='stellantis_'+slug()+'_';
  try{ for await (var en of hd.values()){ if(en.kind==='file' && /\.json$/i.test(en.name) && en.name.toLowerCase().indexOf(pre)===0){ var f=await en.getFile(); out.push({name:en.name, lastModified:f.lastModified}); } } }catch(e){ console.error(e); }
  return out;
}
function uniqueName(matches){
  var base=draftFileName(), names=matches.map(function(f){ return f.name; });
  if(names.indexOf(base)===-1) return base;
  var stem=base.replace(/\.json$/i,''), n=2, c; do{ c=stem+'_'+n+'.json'; n++; }while(names.indexOf(c)!==-1); return c;
}
function resolveConflict(matches){
  return new Promise(function(resolve){
    var ov=document.getElementById('conflictOverlay'), list=document.getElementById('cfMatches');
    var bn=document.getElementById('cfNew'), bc=document.getElementById('cfCancel'), bx=document.getElementById('cfClose');
    document.getElementById('cfText').textContent='Pro „'+(state.meta.partner||'tohoto dealera')+'“ je ve složce už uložený koncept. Uložit jako nový, nebo přepsat některý ze stávajících?';
    list.innerHTML='';
    matches.slice().sort(function(a,b){ return b.lastModified-a.lastModified; }).forEach(function(f){
      var it=h('button',{type:'button', class:'modal-item'},[h('span',{class:'modal-item-name'},['Přepsat: '+f.name]), h('span',{class:'modal-item-date'},[formatDate(new Date(f.lastModified))])]);
      it.addEventListener('click', function(){ done(f.name); }); list.appendChild(it);
    });
    function done(r){ ov.hidden=true; bn.removeEventListener('click',on); bc.removeEventListener('click',oc); bx.removeEventListener('click',oc); ov.removeEventListener('click',oo); resolve(r); }
    function on(){ done('new'); } function oc(){ done(null); } function oo(e){ if(e.target===ov) oc(); }
    bn.addEventListener('click',on); bc.addEventListener('click',oc); bx.addEventListener('click',oc); ov.addEventListener('click',oo);
    ov.hidden=false;
  });
}
async function saveDraftAction(){
  saveLocal(true);
  if(!FS_OK){
    var fname=draftFileName(), blob=new Blob([serializeState()],{type:'application/json'});
    if(navigator.share && navigator.canShare){
      try{
        var file=new File([blob], fname, {type:'application/json'});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fname}); note('Předáno k uložení: '+fname, 6000); return; }
      }catch(err){ if(err && err.name==='AbortError') return; console.error(err); }
    }
    downloadDraft(); note('Staženo: '+fname, 5000); return;
  }
  try{
    var hd=await getFolder(true); if(!hd) return;
    var matches=await findDrafts(hd), fn;
    if(matches.length){ var ch=await resolveConflict(matches); if(!ch) return; fn=(ch==='new')?uniqueName(matches):ch; } else fn=draftFileName();
    var fh=await hd.getFileHandle(fn,{create:true}); var w=await fh.createWritable(); await w.write(serializeState()); await w.close();
    note('Uloženo do složky: '+fn+' ✓', 4000);
  }catch(err){
    if(err && err.name==='AbortError') return;
    console.error(err); alert('Uložení do složky se nezdařilo. Zkuste to znovu, případně zvolte složku tlačítkem „(změnit)“.');
  }
}
async function loadAction(){
  if(!FS_OK){ document.getElementById('loadFileInput').click(); return; }
  var hd; try{ hd=await getFolder(true); }catch(err){ if(err && err.name==='AbortError') return; alert('Propojení se složkou se nezdařilo.'); return; }
  if(!hd) return;
  var files=[];
  try{ for await (var en of hd.values()){ if(en.kind==='file' && /\.json$/i.test(en.name)){ var f=await en.getFile(); files.push({name:en.name, entry:en, lastModified:f.lastModified}); } } }
  catch(e){ alert('Nepodařilo se načíst obsah složky.'); return; }
  files.sort(function(a,b){ return b.lastModified-a.lastModified; });
  var list=document.getElementById('fpList'); list.innerHTML='';
  if(!files.length) list.appendChild(h('div',{class:'modal-empty'},['Ve složce zatím nejsou žádné uložené koncepty (.json).']));
  files.forEach(function(f){
    var it=h('button',{type:'button', class:'modal-item'},[h('span',{class:'modal-item-name'},[f.name]), h('span',{class:'modal-item-date'},[formatDate(new Date(f.lastModified))])]);
    it.addEventListener('click', async function(){
      try{
        var l=JSON.parse(await (await f.entry.getFile()).text());
        if(!looksLikeDraft(l)){ alert('Tento soubor nevypadá jako koncept z tohoto formuláře.'); return; }
        applyLoaded(l); renderAll(); saveLocal(true); document.getElementById('folderPickerOverlay').hidden=true; note('Načteno: '+f.name+' ✓', 3000);
      }catch(e){ alert('Soubor se nepodařilo načíst.'); }
    });
    list.appendChild(it);
  });
  document.getElementById('folderPickerOverlay').hidden=false;
}
document.getElementById('fpClose').addEventListener('click', function(){ document.getElementById('folderPickerOverlay').hidden=true; });
document.getElementById('folderPickerOverlay').addEventListener('click', function(e){ if(e.target.id==='folderPickerOverlay') e.target.hidden=true; });
document.getElementById('loadFileInput').addEventListener('change', function(e){
  var f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var l; try{ l=JSON.parse(r.result); }catch(err){ alert('Soubor se nepodařilo načíst, není to platný .json export z tohoto formuláře.'); return; }
    if(!looksLikeDraft(l)){ alert('Tento soubor nevypadá jako koncept z tohoto formuláře (formulář ARVAL nelze načíst).'); return; }
    applyLoaded(l); renderAll(); saveLocal(true); note('Načteno ze souboru ✓', 2500);
  };
  r.readAsText(f);
});

/* ================= Top bar actions ================= */
// Interaction: ukládání a načítání z databáze (místo OneDrivu)
document.getElementById('btnSave').addEventListener('click', function(){ if (!window.IA_DB) return alert('Připojení k databázi se ještě načítá, zkuste to za okamžik.'); window.IA_DB.save(serializeState(), function(t){ note(t, 3000); }); });
document.getElementById('btnLoad').addEventListener('click', function(){ if (!window.IA_DB) return alert('Připojení k databázi se ještě načítá, zkuste to za okamžik.'); window.IA_DB.open(function(l){ applyLoaded(l); renderAll(); saveLocal(true); note('Načteno z databáze ✓', 3000); }); });
document.getElementById('btnExport').addEventListener('click', function(){ window.print(); });
document.getElementById('btnEmail').addEventListener('click', function(){
  window.print();
  var m=state.meta, subject='Stellantis certifikační audit karosárny — '+(m.partner||'koncept')+(m.datumAuditu?' — '+m.datumAuditu:'');
  var body='Dobrý den,\n\nv příloze zasílám certifikační audit karosárny pro '+(m.partner||'partnera')+'.\n(Před odesláním prosím přiložte PDF uložené z tlačítka „Export a e-mail“.)\n\nS pozdravem';
  window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
});
document.getElementById('btnReset').addEventListener('click', function(){
  if(!confirm('Opravdu vymazat všechna zadaná data formuláře? Tato akce je nevratná.')) return;
  state=newState(); aresStatus={}; saveLocal(false); renderAll();
});

/* ================= Nesplněná kritéria (PDF / CSV) ================= */
function missingTitle(){ return 'Nesplněná kritéria - Stellantis certifikační audit karosárny'+(state.meta.partner?' — '+state.meta.partner:''); }
function exportMissingPdf(){
  var root=document.getElementById('missing-report'); root.innerHTML='';
  root.appendChild(h('div',{class:'mr-title'},['Nesplněná kritéria - Stellantis certifikační audit karosárny']));
  root.appendChild(h('div',{class:'mr-sub'},[h('b',{},['Zákazník: ']), (state.meta.partner||'—')+(state.meta.ic?' (IČ '+state.meta.ic+')':''), '  ·  Vygenerováno '+formatDate(new Date())]));
  var un=unmetItems();
  if(!un.length) root.appendChild(h('div',{class:'mr-empty'},['Všechna kritéria jsou splněna.']));
  AREA_ORDER.forEach(function(aid){
    var rows=un.filter(function(u){ return u.area===aid; }); if(!rows.length) return;
    root.appendChild(h('h3',{},[AREAS[aid].title+' — chybí '+rows.length]));
    rows.forEach(function(u){ root.appendChild(h('div',{class:'mr-row'},[h('b',{},[u.id]), h('span',{},[u.k]), h('span',{},[u.p])])); });
  });
  document.body.classList.add('exporting-missing');
  var prev=document.title; document.title=missingTitle();
  var cleaned=false;
  function cleanup(){ if(cleaned) return; cleaned=true; document.body.classList.remove('exporting-missing'); document.title=prev; window.removeEventListener('afterprint', cleanup); }
  window.addEventListener('afterprint', cleanup);
  setTimeout(function(){ window.print(); }, 50);
  setTimeout(cleanup, 15000);
}
function csvEsc(v){ v=String(v==null?'':v); if(/[;"\n\r]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function exportMissingCsv(){
  var rows=[[missingTitle()],['Oddíl','Číslo','Kritérium','Požadavek']];
  unmetItems().forEach(function(u){ rows.push([AREAS[u.area].title, u.id, u.k, u.p]); });
  if(rows.length===2) rows.push(['Všechna kritéria splněna','','','']);
  var csv=rows.map(function(r){ return r.map(csvEsc).join(';'); }).join('\r\n');
  var url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
  var a=document.createElement('a'); a.href=url; a.download='nesplnena_kriteria_stellantis'+(state.meta.partner?'_'+slug():'')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
var mBtn=document.getElementById('btnMissing'), mMenu=document.getElementById('missingMenu'), mWrap=document.getElementById('missingWrap');
function closeMenu(){ mMenu.setAttribute('hidden',''); mBtn.setAttribute('aria-expanded','false'); }
mBtn.addEventListener('click', function(e){ e.stopPropagation(); if(mMenu.hasAttribute('hidden')){ mMenu.removeAttribute('hidden'); mBtn.setAttribute('aria-expanded','true'); } else closeMenu(); });
document.addEventListener('click', function(e){ if(!mMenu.hasAttribute('hidden') && !mWrap.contains(e.target)) closeMenu(); });
document.getElementById('btnMissingPdf').addEventListener('click', function(){ closeMenu(); exportMissingPdf(); });
document.getElementById('btnMissingCsv').addEventListener('click', function(){ closeMenu(); exportMissingCsv(); });

/* ================= Start ================= */
loadLocal();
if(FS_OK){ getFolder(false).catch(function(e){ console.log('No previously connected folder', e); }); }
})();
</script>
