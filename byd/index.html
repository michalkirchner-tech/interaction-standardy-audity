<style>
:root{--red:#d70c19;--ink:#1b1e23;--ink2:#2b3038;--muted:#5d6570;--line:#e3e6ea;--soft:#f5f6f8;--bg:#eef0f3}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:86px}
body{margin:0;font-family:"Open Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:Poppins,sans-serif}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 22px;background:var(--ink);color:#fff;border-bottom:3px solid var(--red)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.ia-home-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;flex:0 0 auto}
.logo{background:#fff;border-radius:8px;padding:7px 10px;display:flex}
.logo img{height:18px}
.brand h1{margin:0;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:400 .75rem "Open Sans",sans-serif;opacity:.75}
.actions{display:flex;align-items:center;gap:8px}
.actions input{width:250px;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:.9rem}
.btn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:8px;padding:8px 12px;font:600 .85rem "Open Sans",sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.solid{background:var(--red);border-color:var(--red)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:26px;max-width:1320px;margin:0 auto;padding:24px 22px 60px}
nav.toc{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:#fff;border-radius:14px;padding:14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
nav.toc .h{font:600 .72rem Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
nav.toc a{display:flex;gap:9px;align-items:baseline;padding:6px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:.86rem}
nav.toc a:hover,nav.toc a.active{background:var(--soft);color:var(--red)}
nav.toc a .no{font:700 .75rem Poppins,sans-serif;color:var(--red);min-width:22px}
nav.toc .sep{height:1px;background:var(--line);margin:8px 10px}
.hero{background:linear-gradient(120deg,#1b1e23 0%,#2b3038 60%,#3a1418 100%);color:#fff;border-radius:18px;padding:30px 32px;position:relative;overflow:hidden;margin-bottom:22px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(215,12,25,.55),transparent 70%)}
.hero .tag{display:inline-block;background:var(--red);border-radius:999px;padding:3px 12px;font:600 .75rem "Open Sans",sans-serif;letter-spacing:.04em}
.hero h2{margin:12px 0 4px;font-size:1.8rem}
.hero p{margin:0;opacity:.85}
.hero .meta{margin-top:14px;font-size:.85rem;opacity:.75}
.notice{display:flex;gap:12px;align-items:flex-start;background:#fff;border-left:4px solid var(--red);border-radius:10px;padding:12px 16px;margin-bottom:22px;font-size:.9rem;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:20px;overflow:hidden}
.card>.inner{padding:20px 24px}
.card h3.t{margin:0 0 12px;font-size:1.15rem}
details.chap>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 24px;border-bottom:1px solid transparent}
details.chap[open]>summary{border-bottom-color:var(--line)}
details.chap>summary::-webkit-details-marker{display:none}
.chno{width:48px;height:48px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 1.05rem Poppins,sans-serif}
.chno.app{background:var(--red);font-size:.9rem}
.chhead h3{margin:0;font-size:1.12rem}
.chhead .src{font-size:.78rem;color:var(--muted)}
.chhead .lead{font-size:.88rem;color:var(--ink2);margin-top:3px}
.chcount{font:600 .78rem "Open Sans",sans-serif;color:var(--muted);text-align:right;white-space:nowrap}
.chcount::after{content:"▾";display:block;font-size:1rem;color:var(--red);transition:transform .2s}
details.chap[open] .chcount::after{transform:rotate(180deg)}
.req{display:grid;grid-template-columns:96px minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:12px 24px;border-top:1px solid var(--line);font-size:.9rem}
.req:first-child{border-top:0}
.req:nth-child(even){background:#fbfbfc}
.code{font:700 .78rem Poppins,sans-serif;color:var(--red);background:#fdecee;border-radius:7px;padding:4px 8px;align-self:start;text-align:center}
.req .need{font-weight:600;color:var(--ink)}
.req .det{color:var(--ink2)}
.req .det.ok{color:var(--muted);font-style:italic}
.reqhead{display:grid;grid-template-columns:96px minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:10px 24px;background:var(--soft);font:600 .72rem Poppins,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prep{padding:14px 24px 18px;background:var(--soft);border-top:1px solid var(--line)}
.prep .h{font:600 .8rem Poppins,sans-serif;color:var(--ink2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-size:.82rem}
.chip::before{content:"☐ ";color:var(--red)}
.callout{margin:14px 24px;background:#fff8e6;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;font-size:.87rem;color:#4a3a06}
.callout b{color:#3b2e00}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;background:var(--ink);color:#fff;font:600 .78rem Poppins,sans-serif;padding:9px 12px}
table.t td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.t tr:nth-child(even) td{background:#fbfbfc}
.tblwrap{padding:14px 24px}
.ess{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ess div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.86rem}
.ess b{display:block;font-family:Poppins;color:var(--red);margin-bottom:3px}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.legend div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.84rem}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.step{background:var(--soft);border-radius:12px;padding:12px;font-size:.84rem;position:relative}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font:700 .85rem Poppins,sans-serif;margin-bottom:6px}
.step b{display:block;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.87rem}
.box b{display:block;font-family:Poppins;margin-bottom:3px}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font:600 .74rem "Open Sans",sans-serif;white-space:nowrap}
.st.m{background:#fdecee;color:#a50a14}.st.s{background:#e7f0fb;color:#1d4f91}.st.c{background:#fff1d6;color:#8a5a00}.st.o{background:#eceff2;color:#4b535c}.st.t{background:#e8f6ee;color:#1d7a45}
.reggrp{margin-bottom:14px}
.reggrp h4{margin:14px 0 6px;font:600 .92rem Poppins,sans-serif}
.hidden{display:none!important}
mark{background:#ffe08a;padding:0 1px;border-radius:2px}
#noHits{display:none;background:#fff;border-radius:12px;padding:16px 20px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}nav.toc{display:none}.steps{grid-template-columns:1fr 1fr}.ess{grid-template-columns:1fr 1fr}.legend{grid-template-columns:1fr 1fr}.actions input{width:170px}}
@media(max-width:720px){.layout{grid-template-columns:minmax(0,1fr);padding:14px 12px 40px}.grid2,.ess,.legend,.steps{grid-template-columns:minmax(0,1fr)}.actions{gap:6px}.actions input{width:110px}.tblwrap{overflow-x:auto}details.chap>summary{padding:14px;gap:10px}.req{padding:10px 14px}.req,.reqhead{grid-template-columns:1fr}.reqhead{display:none}.brand small{display:none}.actions .btn.opt{display:none}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10pt}
  .topbar,nav.toc,.no-print,#noHits{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .card,.hero,.notice{box-shadow:none;break-inside:auto}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  details.chap>summary{break-after:avoid}
  .req{break-inside:avoid}
  .chcount::after{display:none}
  .code,.chno,.st,table.t th,.step .n,.chip::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script id="byd-data" type="application/json">{"meta": {"title": "BYD Europe – standardy karosárny", "sub": "Příručka pro vybavení a opravy dealerů", "version": "Verze 1.2 · 8. 10. 2026", "network": "BYD Europe · síť dealerů a autorizovaných opraváren"}, "intro": {"essentials": [["Zóny dílny", "1 lakovací box; 1 míchárna; 2 přípravná stání lakovny; 2 stání pro klempířské opravy; 3 MET stání; 1 stání s rovnacím rámem; 1 stání pro hliník; oddělený sklad dílů."], ["Lidé", "Alespoň 5 samostatných zaměstnanců. Pokrytí všech požadovaných rolí a 2 pracovníci s kvalifikací MET. Viz kapitola 12."], ["Osvětlení", "800 lx: hliník, kalkulace, kontrola kvality, klempířina a MET. 1 000 lx: lakování, míchárna a lakovací boxy."], ["Prostor pro hliník", "Plánovací rozměry: kabina 8,5 × 5,5 × 4 m; stání se závěsy 8 × 5 × 4 m (D × Š × V). Oddělené nářadí, OOP a odsávání ATEX."], ["Zvedání", "Zvedák BYD: min. 3,5 t; DENZA: min. 4,5 t. Podpěry náprav: min. 3 t; ověřte způsob udání nosnosti a skutečné zatížení."], ["Péče o zákazníka", "24hodinový odtah, zabezpečené parkování vozidel a alespoň 2 náhradní vozidla BYD."], ["Technické informace", "Aktuální roční přímé předplatné BYD TIS. U každé opravy aktuální metoda pro daný model."], ["Kalibrace", "Seřizovač světlometů dvakrát ročně. Momentové klíče každých 12 měsíců. Uchovávejte certifikáty."], ["Ochrana při lakování", "Ochrana s přívodem vzduchu je povinná pro rozpouštědlové barvy a stříkání izokyanátů, i u systémů s vodouředitelným základem."]], "legend": [["Povinné", "požadavek karosárny z hodnoticího sešitu BYD."], ["Sdílené", "výslovně povolen přístup přes vhodného dealera / poskytovatele."], ["Podmíněné", "platí pro určitou opravárenskou činnost, materiál nebo rozsah servisu."], ["Doporučené", "doporučení nebo plánovací vodítko ze zdroje."]], "steps": [["Příjem a posouzení", "Chraňte interiér vozidla. Určete poškození a bezpečnostní rizika. Zajistěte vozidlo, získejte kalkulaci a schválení a nabídněte náhradní vozidlo BYD."], ["Plán opravy", "Stáhněte aktuální metody BYD z TIS. Potvrďte díly, spotřební materiál, nářadí, kompetence technika a potřebná měření / kalibrace. Metody založte do zakázkové složky."], ["Zabezpečení vozidla", "Dodržte příslušný postup odpojení VN. VN systém smí odstavit a znovu uvést do provozu jen kvalifikovaný technik. Postavte zábrany, značení a OOP pro daný úkon."], ["Oprava a ověření", "Metody mějte u vozidla. Používejte schválené produkty a oddělené nářadí pro hliník. Uchovávejte měření karoserie před a po opravě a doklady o diagnostice / kalibraci."], ["Kontrola a předání", "Dokončete a podepište výstupní kontrolu kvality. Proberte výsledek a případné další práce se zákazníkem. Vyčistěte vozidlo zevnitř i zvenku. Uchovejte kompletní zakázkovou složku."]], "jobpack": ["Použité opravárenské metody", "Kalkulace a schválení opravy", "Dohledatelnost dílů a spotřebního materiálu", "Záznamy diagnostiky a kalibrace před a po opravě", "Měření karoserie (je-li relevantní)", "Podepsaná výstupní kontrola a záznam o předání zákazníkovi"], "tis": "TIS je technický informační systém BYD. Zkontrolujte ho vždy před volbou opravárenské metody, lepidel, svařovacího materiálu, postupů pro baterie nebo kalibračních pokynů.", "priority": "Kde opravy (COR) opravují hodnoticí sešit, platí COR. Doplňky ze servisní příručky (SG) jsou označeny zvlášť a platí pro příslušné prostory dealera / servisu. Rozhodnutí u konkrétní opravy se řídí nejnovějšími pokyny v TIS.", "exception": "Plán výstavby nebo výjimku konzultujte s regionálním týmem BYD a týmem servisní sítě. Pokud požadavek nelze splnit, předložte důvod, podklady a navrhovanou alternativu k posouzení. Formální výjimky vyžadují potvrzení BYD."}, "chapters": [{"no": "01", "title": "Areál a péče o zákazníka", "src": "BS oddíl 1", "lead": "Zajistěte bezpečný a dostupný areál, kde je cesta zákazníka oddělená od provozu dílny.", "items": [["BS 1.01", "Všechna zařízení a budovy musí být v dobrém technickém i estetickém stavu. Budova nesmí poškozovat image ani pověst značky BYD.", "Budovy a zpevněné příjezdové komunikace udržujte v dobrém stavu, volné a vhodné pro zákazníky."], ["BS 1.02", "Karosárna musí mít pro lakýrnické a karosářské opravy minimálně tyto pracovní zóny: 1× lakovací box, 1× míchárnu barev, 2× přípravné stání lakovny, 2× stání pro klempířské opravy, 3× MET stání, 1× stání s rovnacím rámem, 1× stání pro hliník (závěs po celé délce nebo kabina), 1× prostor pro demontované / nové díly.", "K dispozici a funkční."], ["BS 1.03", "Budova i perimetr areálu musí být zabezpečené a mít funkční bezpečnostní kamery.", "Sledujte prostory pod kontrolou karosárny kvůli zabezpečení areálu a bezpečnosti zaměstnanců i zákazníků."], ["BS 1.04", "Zajistěte zabezpečené parkování vozidel BYD a chraňte poškozená nebo nezajištěná vozidla před povětrnostními vlivy.", "Zajistěte zabezpečenou zpevněnou plochu 24/7. Poškozená vozidla utěsněte proti vodě; pro těžce poškozená vozidla zajistěte dostatek místa mimo dohled zákazníků."], ["BS 1.05", "Čekárna / recepce pro zákazníky musí být oddělená od dílny a mít vlastní vchod. Recepce musí být zřetelně označená.", "Samostatný vchod; jasné značení; pult a posezení; bezbariérové WC pro zákazníky; čaj, káva a voda; aktuální informace BYD. Vyvěste otevírací dobu. Kancelářské činnosti mimo dílnu."], ["BS 1.06", "Administrativní zázemí musí zahrnovat kancelář vedoucího, pracoviště řízení dílny a vhodné administrativní prostory.", "K dispozici a funkční."], ["BS 1.07", "Nebezpečný odpad kontrolujte, skladujte a odvážejte mimo dohled zákazníků.", "Nebezpečný odpad skladujte ve vyhrazeném prostoru splňujícím předpisy. Odvoz probíhá mimo dohled zákazníků."], ["BS 1.08", "Musí existovat vyhrazený prostor pro čištění a úpravu vozidel.", "Mycí / úpravárenský prostor může být v areálu; všechna vozidla se před předáním vyčistí zevnitř i zvenku."], ["BS 1.09", "Navigační značení směřující zákazníky na recepci je dobře umístěné.", "Používejte čisté a čitelné značení. Zajistěte soukromý prostor pro jednání, i pro zranitelné zákazníky."], ["BS 1.11", "Čekárna je čistá, uklizená a nabízí občerstvení. K dispozici musí být samostatné WC pro zákazníky s mýdlem a možností osušení rukou.", "Čisté WC jen pro zákazníky s mýdlem a osušením rukou, občerstvení v čekárně."], ["BS 1.12", "Musí být zajištěno zázemí pro osoby se zdravotním postižením a parkování pro ně.", "Parkoviště pro zákazníky označené a volné. Parkování zákazníků a zaměstnanců musí být oddělené."], ["BS 1.13", "Dodržujte pravidla identity BYD a používejte pouze schválené ochranné známky, loga a značení.", "Používejte jen schválená loga a značení BYD. Před instalací venkovního značení získejte souhlas Network Operations; neschválené značení odstraňte."], ["BS 1.14", "Karosárna nesmí bez předchozího souhlasu BYD vytvářet žádné propagační materiály odkazující na BYD.", "Letáky a plakáty BYD lze získat přes dealera, jsou-li k dispozici. Vystavené tiskoviny jiné než BYD musí být odstraněny."], ["BS 1.15", "Karosárna BYD musí mít plán kontinuity provozu pro případ, že nemůže fungovat (požár, povodeň, škody počasím, omezený přístup apod.).", "Mějte zdokumentovaný plán kontinuity a dohodu s alternativní doporučenou karosárnou nebo nominujícím dealerem, který práce během výpadku dokončí."], ["BS 1.16", "Všechny karosárny BYD musí zajišťovat 24hodinovou odtahovou službu.", "Službu lze zajistit subdodavatelsky předem určeným poskytovatelem. Při využití subdodavatele musí existovat smlouva."], ["BS 1.17", "Náhradní vozidla BYD musí být k dispozici a aktivně nabízena zákazníkům BYD po dobu opravy.", "Mějte k dispozici alespoň 2 náhradní vozidla BYD. Aktivně je nabízejte a plánujte kapacitu podle objemu oprav."]], "prep": ["Fotografie areálu a plán parkování", "Smlouva na odtahovou službu", "Evidence náhradních vozidel", "Plán kontinuity provozu", "Proces nakládání s odpady a schválení značení"], "notes": [], "table": null}, {"no": "02", "title": "Výrobní prostory", "src": "BS oddíl 2", "lead": "Chraňte díly a udržujte čisté a řízené výrobní zóny.", "items": [["BS 2.01", "Všechny výrobní prostory musí být vždy čisté, uklizené a na vysoké úrovni.", "Pravidelný úklid a údržba by měly být zdokumentované."], ["BS 2.02", "Pro demontované díly musí být samostatný a zabezpečený skladovací prostor pro každé vozidlo zvlášť.", "Prostor musí být čistý, uklizený a suchý bez rizika poškození dílů prostředím. Nové a demontované díly se skladují odděleně; měkké díly interiéru se chrání a/nebo oddělují od tvrdých dílů."], ["BS 2.03", "Karosárna musí mít postup identifikace demontovaných a nových dílů pro každé vozidlo.", "Všechny díly musí být jasně označeny vozidlem a číslem zakázky. Demontované díly se vždy skladují správně a ne ve vozidle."]], "prep": ["Záznamy o úklidu", "Sklad dílů označený podle zakázky / vozidla", "Oddělené nové a demontované díly, chráněné čalounění"], "notes": [], "table": null}, {"no": "03", "title": "Osvětlení dílny", "src": "BS oddíl 3 + opravy (COR)", "lead": "Použijte níže uvedené opravené hodnoty osvětlení pro karosárnu. Nižší hodnoty pro servis tyto minimální hodnoty nenahrazují.", "items": [], "prep": [], "notes": ["Doklad: záznamy z měření osvětlenosti pracovních prostorů. Podle opravy COR platí pro míchárnu 1 000 lx (včetně přílohy 2, bod 1.1)."], "table": {"head": ["Prostor", "Minimální udržovaná osvětlenost"], "rows": [["Opravy hliníku, kalkulace škod, výstupní kontrola kvality, klempířská výroba a MET", "800 lx"], ["Lakování, míchárna barev a každý lakovací box", "1 000 lx"]]}}, {"no": "04", "title": "Postupy a metody oprav", "src": "BS oddíl 4 + opravy (COR)", "lead": "Každou opravu plánujte, provádějte a dokládejte podle aktuální metody BYD.", "items": [["BS 4.01", "Karosárna je povinna dodržovat procesní standardy a pravidla BYD.", "K dispozici a funkční."], ["BS 4.02", "Karosárna i podporující dealer BYD musí mít přístup k aktuálnímu BYD TIS a k hardwaru/softwaru potřebnému pro výklad informací o opravách, kalibracích a resetu snímačů.", "Schopnosti karosárny může doplnit pomoc dealera na základě písemné dohody. Karosárna musí mít vlastní aktuální roční předplatné TIS podle 4.03; podpora dealera tento požadavek neruší."], ["BS 4.03", "Karosárna musí mít aktuální roční předplatné BYD TIS pro přímý přístup k opravárenským metodám.", "Licence a přidružení uživatelé budou kontrolováni při auditu. Sdílení informací z TIS třetím stranám je přísně zakázáno a může vést k vyřazení ze schválené sítě BYD."], ["BS 4.04", "Kalkulanti musí mít přístup ke schválenému elektronickému kalkulačnímu systému.", "Kalkulanti musí mít ke kalkulačnímu systému přístup vždy."], ["BS 4.05", "Proškolený kalkulant musí prokázat, že umí pracovat v počítačovém systému a najít opravárenskou metodu.", "Kalkulant předvede vyhledání metody BYD, speciálního nářadí nebo schváleného opravárenského produktu v systému."], ["BS 4.06", "Opravárenské metody BYD se ve fázi kalkulace ukládají elektronicky nebo tisknou a založí se do zakázkové složky.", "Metody uložte/vytiskněte při kalkulaci; před zahájením zkontrolujte speciální nářadí a produkty."], ["BS 4.07", "Metody BYD musí být u vozidla k dispozici ve všech fázích opravy – na monitoru nebo vytištěné.", "Technik předvede, jak během opravy přistupuje k metodám BYD."], ["BS 4.08", "Karosář BYD musí prokázat, že umí pracovat v systémech a najít opravárenskou metodu.", "Karosář předvede vyhledání a vysvětlení aktuální opravárenské metody."], ["BS 4.09", "Metody BYD se musí používat u všech oprav vozidel BYD.", "Doložte na probíhajících opravách, dostupných metodách, zakázkových složkách, nářadí a produktech."], ["BS 4.10", "Po celou dobu opravy se ve vozidle používají ochranné potahy sedadel, volantu a podlahové rohože.", "Potahy nasaďte před zahájením práce. Chraňte sedadlo řidiče, volant a podlahu; dle potřeby i stranu spolujezdce."], ["BS 4.11", "Během opravy se na vozidlo nesmí odkládat žádné předměty.", "Klíče, spotřební materiál, díly apod. – kvůli ochraně exteriéru vozidla před znečištěním nebo poškozením."], ["BS 4.12", "Opravárenská metoda BYD musí zůstat v zakázkové složce i po dokončení opravy.", "Zakázková složka může být fyzická nebo elektronická a snadno dostupná."], ["BS 4.13", "V zakázkové složce musí být plně vyplněný a podepsaný protokol výstupní kontroly kvality.", "Každé vozidlo před vrácením zkontroluje kompetentní osoba. Podepsanou kontrolu uchovejte; výsledek vysvětlete zákazníkovi a proberte s ním případné další práce."], ["BS 4.14", "Musí existovat výtisk kalibrace před opravou a po ní.", "Doklad, že všechny bezpečnostní systémy a komponenty byly zkontrolovány na poškození."]], "prep": ["Licence TIS", "Ukázky práce zaměstnanců", "Vzorová kompletní zakázková složka", "Podepsaná výstupní kontrola", "Požadované výstupy před a po opravě"], "notes": ["Obsah zakázkové složky: kalkulace a schválení opravy, použité metody BYD, dohledatelnost dílů a spotřebního materiálu, diagnostika a kalibrace před a po opravě, záznamy měření karoserie (je-li relevantní), podepsaná výstupní kontrola a záznam o předání zákazníkovi. Shrnuje BS 4.06–4.14 a přílohu 2, bod 2.1."], "table": null}, {"no": "05", "title": "Speciální nářadí a vybavení", "src": "BS oddíl 5 + opravy (COR)", "lead": "Udržujte vybavení vhodné pro autorizovanou modelovou řadu. Příloha B doplňuje povinné nářadí z podrobného seznamu.", "items": [["BS 5.1", "Bodová svářečka – musí se používat svářečka splňující požadavky.", "K dispozici a funkční."], ["BS 5.2", "Svářečka MIG/MAG – musí být k dispozici vyhovující zařízení.", "K dispozici a funkční."], ["BS 5.3", "Rovnací rám – vhodné velikosti a možností pro celou modelovou řadu.", "K dispozici a funkční."], ["BS 5.4", "Měřicí systém – trvale dostupný systém pro kontrolu geometrie nosných dílů karoserie.", "K dispozici a funkční."], ["BS 5.5", "Nýtovací kleště na slepé nýty.", "K dispozici a funkční."], ["BS 5.6", "Odstraňovač svarů – musí být přítomen a v dobrém stavu.", "K dispozici a funkční."], ["BS 5.7", "Odvrtávačka bodových svarů – musí se používat speciální vrtáky pro vysokopevnostní ocel.", "K dispozici a funkční."], ["BS 5.8", "Karosářská pila nebo řezné kotouče – používat jen na okruzích chráněných proudovým chráničem.", "K dispozici a funkční."], ["BS 5.9", "Inteligentní nabíječka baterií – dle DIN, s kabely v dobrém stavu a s možností nastavení proudu.", "K dispozici a funkční."], ["BS 5.10", "Ruční vrtačky, brusky a úhlové brusky – pneumatické nebo akumulátorové, případně na okruhu s proudovým chráničem, v dobrém stavu.", "K dispozici a funkční."], ["BS 5.11", "Kompresor – musí mít sušičku vzduchu a odlučovače vody; kontrola nebo servis během posledního roku.", "K dispozici a funkční."], ["BS 5.12", "Samostatné uzamykatelné úložiště airbagů / předpínačů pásů – vyhrazené, označené, pevně ukotvené k podlaze nebo pevné stěně.", "K dispozici a funkční."], ["BS 5.13", "Box na likvidaci baterií – zabezpečený, správně označený, v souladu s předpisy o životním prostředí a BOZP.", "K dispozici a funkční."], ["BS 5.14", "Zařízení na odčerpání paliva – po jednom pro benzín a naftu, v souladu s místními požárními předpisy; lze sdílet s dílnou, je-li vhodné.", "K dispozici a funkční."], ["BS 5.15", "Regulátory tlaku vzduchu – v dobrém stavu, s kalibrovanými a funkčními manometry.", "K dispozici a funkční."], ["BS 5.16", "Pistole na lepidla a těsnicí hmoty – vhodné pro opravárenské metody výrobce.", "K dispozici a funkční."], ["BS 5.17", "Horkovzdušná pistole – chráněná proudovým chráničem, v bezpečném stavu.", "K dispozici a funkční."], ["BS 5.18", "Svářečské zástěny a deky – povinně při svařování a broušení. Svářečské deky musí mít označení E.", "K dispozici a funkční."], ["BS 5.19", "Odsávání svařovacích dýmů – mobilní jednotka musí být na místě a funkční.", "K dispozici a funkční."], ["BS 5.20", "Ochranné pomůcky – včetně brýlí, štítů a rukavic s označením E.", "K dispozici a funkční."], ["BS 5.21", "Zařízení na seřízení světlometů musí být kalibrováno dvakrát ročně.", "K dispozici a funkční."], ["BS 5.22", "Odsávání prachu – pevné nebo mobilní, s minimálním provozním podtlakem −500 mbar.", "K dispozici a funkční."], ["BS 5.23", "Odsávání výfukových plynů – musí být k dispozici a funkční.", "K dispozici a funkční."], ["BS 5.24", "Stahováky pružin – pouze klecového typu kvůli bezpečnosti technika.", "K dispozici a funkční."], ["BS 5.25", "Nářadí na demontáž panelů a obložení – široký výběr odpovídající moderním vozidlům.", "K dispozici a funkční."], ["BS 5.26", "Lešticí stroje – pneumatické, akumulátorové nebo na okruhu s proudovým chráničem, v dobrém stavu.", "K dispozici a funkční."], ["BS 5.27", "Podpěry náprav musí mít označení CE a minimální jmenovitou nosnost 3 t.", "Ověřte nosnost udanou výrobcem, včetně toho, zda platí na kus nebo na pár, a zvolte dostatečnou podporu pro vozidlo a zatížení. Oprava určuje minimum, ale ne způsob udání nosnosti."], ["BS 5.28", "Zvedáky agregátů (motor / převodovka) – bez úniků kapalin a s platnými revizemi.", "K dispozici a funkční."], ["BS 5.29", "Zvedáky vozidel – alespoň jeden s nosností min. 3,5 t pro BYD (min. 4,5 t pro DENZA); platná revize.", "K dispozici a funkční."], ["BS 5.30", "Systém odsávání paliva – musí splňovat normu DIN nebo označení E.", "K dispozici a funkční."], ["BS 5.31", "Zařízení na vstřikování vosku a ochranu proti kamínkům – nutné pro správnou antikorozní ochranu při zpětné montáži.", "K dispozici a funkční."], ["BS 5.32", "Indukční ohřev je povinný.", "Zajistěte ohřev bez otevřeného plamene podle přílohy 2, bod 3.8. Dodržujte omezení v TIS a chraňte okolní lepidla, tmely a elektrické komponenty před teplem."]], "prep": ["Soupis nářadí", "Kalibrační a servisní certifikáty", "Platné revize zvedáků", "Bezpečný stav vybavení"], "notes": [], "table": null}, {"no": "06", "title": "Opravy hliníku", "src": "BS oddíl 6 + opravy (COR)", "lead": "Práce s hliníkem, nářadí, odsávání a OOP oddělte od práce s ocelí, aby nedošlo ke kontaminaci.", "items": [["BS 6.01", "Zajistěte samostatný prostor pro opravy hliníku vhodný pro celou autorizovanou modelovou řadu BYD.", "Opravené plánovací rozměry (D × Š × V): uzavřená kabina 8,5 × 5,5 × 4 m; stání se závěsy 8 × 5 × 4 m. Závěsy od podlahy ke stropu nebo uzavřená kabina s přímým přístupem z dílny; vozidla nesmí být vystavena povětrnostním vlivům. Zaznamenejte skutečné využitelné rozměry."], ["BS 6.02", "Prostor pro opravy hliníku musí být čistý a uklizený s minimem vodorovných ploch. Pravidelný úklid pracoviště musí být prováděn a dokumentován.", "Kvůli zamezení křížové kontaminaci a zachování kvality opravy. K čištění povrchů se nemá používat stlačený vzduch."], ["BS 6.03", "Musí být k dispozici funkční pevné a/nebo mobilní odsávání hliníkového prachu ATEX zóna 22, kategorie 3.", "Odsávání vyhrazené jen pro hliník: ATEX zóna 22 / kategorie 3. Nepoužívat pro ocel ani jiné materiály."], ["BS 6.04", "Ve stání pro hliník musí být k dispozici temperovaný ohřev, aby lepicí produkty při nýtování a lepení správně reagovaly.", "Optimální teplota je 15–25 °C a musí být během opravy udržována. Stačí teploměr na stěně s doplňkovým ohřevem nebo integrovaný systém s regulací teploty."], ["BS 6.05", "Musí být k dispozici svářečka MIG na hliník.", "Vyhrazená svářečka MIG na hliník kompatibilní s požadavky výrobce, s vhodným ochranným plynem; uložená spolu s odděleným nářadím pro hliník."], ["BS 6.06", "Ruční odhrotovací záhlubník.", "K dispozici a funkční."], ["BS 6.07", "Základní sada příložek (kovadlinek).", "K dispozici a funkční."], ["BS 6.08", "Základní sada příložek s plastovým povlakem.", "K dispozici a funkční."], ["BS 6.09", "Samosvorné kleště s rovnými čelistmi.", "K dispozici a funkční."], ["BS 6.10", "Samosvorné kleště s čelistmi tvaru U.", "K dispozici a funkční."], ["BS 6.11", "Samosvorné kleště se zakřivenými čelistmi.", "K dispozici a funkční."], ["BS 6.12", "Malé samosvorné kleště typu C.", "K dispozici a funkční."], ["BS 6.13", "Velké samosvorné kleště typu C.", "K dispozici a funkční."], ["BS 6.14", "Samosvorné kleště s obdélníkovými (axiálními) hroty.", "K dispozici a funkční."], ["BS 6.15", "Sada dočasných spojovacích prvků.", "K dispozici a funkční."], ["BS 6.16", "Stříkací pistole pro konzervaci dutin, ochranu podvozku a těsnění.", "K dispozici a funkční."], ["BS 6.17", "Pneumatická nebo akumulátorová pistole na tmely.", "K dispozici a funkční."], ["BS 6.18", "Úhlová bruska.", "K dispozici a funkční."], ["BS 6.19", "Přímá bruska.", "K dispozici a funkční."], ["BS 6.20", "Pásová bruska.", "K dispozici a funkční."], ["BS 6.21", "Karosářská přímočará pila.", "K dispozici a funkční."], ["BS 6.22", "Oscilační pila.", "K dispozici a funkční."], ["BS 6.23", "Pila ocaska (šavlová).", "K dispozici a funkční."], ["BS 6.24", "Standardní vrtačka.", "K dispozici a funkční."], ["BS 6.25", "Úhlová vrtačka.", "K dispozici a funkční."]], "prep": ["Rozměry stání", "Záznamy o úklidu", "Vyhrazené nářadí a OOP", "Záznam o odsávání ATEX", "Sledování teploty"], "notes": [], "table": null}, {"no": "07", "title": "Lakování", "src": "BS oddíl 7", "lead": "Při lakování kontrolujte čistotu, prostředí, výběr produktů a údržbu vybavení.", "items": [["BS 7.01", "Přípravna lakovny musí být čistá a uklizená, včetně podlahy, stěn, pracovních stolů a vybavení.", "Čistý, suchý a vytápěný přípravný prostor s krytým přístupem do boxu. Dodržujte teploty dle dodavatele barev a zabraňte kontaminaci."], ["BS 7.02", "Vždy se musí používat elektronické váhy na barvy.", "Chytré elektronické váhy, které přepočítávají receptury a uchovávají místní varianty a údaje o vozidle. Doporučeno počítačové řízení skladu."], ["BS 7.03", "Míchárna musí být čistá, uklizená a s monitorovanou teplotou.", "Samostatná uzavřená míchárna s vyhovujícím větráním, vytápěním a osvětlením. Velikost podle místních požadavků a vytížení; sledujte noční minimální teplotu."], ["BS 7.04", "Míchárna musí být vybavena teploměrem.", "V míchárně musí být teploměr zaznamenávající nejnižší noční teplotu, aby se ověřilo, že barvy nebyly v zimě poškozeny."], ["BS 7.05", "Míchárna musí mít dostatečné odsávání pro účinné odvádění výparů.", "K dispozici a funkční."], ["BS 7.06", "Musí být k dispozici stříkací pistole LVLP a HVLP nebo jiné vyhovující.", "K dispozici a funkční."], ["BS 7.07", "Musí být doloženo zařízení na mytí stříkacích pistolí v souladu s předpisy, včetně dostatečného větrání.", "K dispozici a funkční."], ["BS 7.08", "Tloušťkoměr laku pro železné i neželezné podklady.", "K dispozici a funkční."], ["BS 7.09", "Brýle a rukavice musí být k dispozici a mít označení E.", "Bezpečnost a ochrana zdraví."], ["BS 7.10", "Alespoň jeden schválený míchací systém musí být plně zaveden a zjevně používán.", "Produkty mají zjevné známky používání a jsou v době použitelnosti."], ["BS 7.11", "Alespoň jeden lakovací box musí mít velikost vhodnou pro celou modelovou řadu BYD.", "K dispozici a funkční."], ["BS 7.12", "Všechny lakovací boxy musí být řádně udržované.", "Dodržujte program údržby výrobce pro boxy, sušárny a míchárny. Uchovávejte servisní záznamy."], ["BS 7.13", "Lakovací boxy musí mít vhodné podlahové / roštové odsávání.", "Bezpečnost a minimalizace prachové kontaminace kvůli kvalitě opravy."], ["BS 7.14", "Sběr, skladování a likvidace barev a ředidel odpovídající produktům.", "Doklad o odděleném skladování a zdokumentovaná evidence schválené likvidace. Další požadavky mohou vyplývat z výrobce barev a systému sušení (např. infračervené)."]], "prep": ["Schválený míchací systém v provozu", "Produkty v době použitelnosti", "Záznamy teplot", "Servisní záznamy boxu", "Evidence likvidace odpadu", "Ochrana dýchacích cest"], "notes": ["Ochrana dýchání přívodem vzduchu: podle opravy COR je u vodouředitelných barev volitelná a u rozpouštědlových povinná. Příloha 3 navíc vyžaduje vhodnou ochranu s přívodem vzduchu při stříkání produktů s izokyanáty. Posuzujte celý lakový systém včetně tužidel a bezbarvých laků – vodouředitelný základ nezbavuje povinnosti chránit se při stříkání izokyanátů. Dodávaný dýchací vzduch musí splňovat EN 12021; kvalitu vzduchu a výkon systému ověřte s dodavatelem."], "table": null}, {"no": "08", "title": "Bezpečnost a pracoviště elektromobilů", "src": "BS oddíl 8", "lead": "Řiďte přístup k práci na vysokém napětí (VN). Odstavení a opětovné uvedení VN systému smí provádět jen technik s odpovídající kvalifikací.", "items": [["BS 8.01", "Pracoviště EV – vyhrazené stání pro EV nebo jasné a bezpečné vymezení oddělující práce na VN od ostatních prostor.", "K dispozici a funkční."], ["BS 8.02", "Izolační rukavice – vhodné pro práci s vysokým napětím.", "K dispozici a funkční."], ["BS 8.03", "Kožené ochranné rukavice – nosí se přes izolační rukavice proti mechanickému poškození.", "K dispozici a funkční."], ["BS 8.04", "Zkoušečka těsnosti izolačních rukavic – ke kontrole neporušenosti před použitím.", "K dispozici a funkční."], ["BS 8.05", "Ochrana obličeje – celoobličejový štít pro práci na VN.", "K dispozici a funkční."], ["BS 8.06", "Zkoušečka nepřítomnosti napětí – k potvrzení odpojení systému.", "K dispozici a funkční."], ["BS 8.07", "Tabule „Pozor – vysoké napětí“ – umístěná na pracovišti EV a kolem něj.", "K dispozici a funkční."], ["BS 8.08", "Uzamykací spona (lock-out) – k zajištění odpojených systémů.", "K dispozici a funkční."], ["BS 8.09", "Visací zámek na odpojovač – k zajištění VN odpojovačů.", "K dispozici a funkční."], ["BS 8.10", "Sada izolovaného nářadí pro hybridy a EV – kompletní sada dle požadavků výrobce.", "K dispozici a funkční."], ["BS 8.11", "Izolační podložka – pokládá se pod vozidlo při práci na VN.", "K dispozici a funkční."], ["BS 8.12", "Sada pro vymezení pracoviště EV – kužely, řetězy nebo jiné fyzické zábrany pro řízení přístupu.", "K dispozici a funkční."], ["BS 8.13", "Výstražný štítek pro opravy na vysokém napětí.", "K dispozici a funkční."], ["BS 8.14", "Sady ochranných krytů pro opravy na VN – k dispozici a nepoškozené.", "K dispozici a funkční."], ["BS 8.15", "Záchranná sada pro VN – vždy dostupná na pracovišti EV.", "Dostupná sada včetně izolovaného záchranného háku, výstražných tabulek a první pomoci při úrazu elektrickým proudem / popálení."]], "prep": ["Personál s kvalifikací pro VN", "OOP a kontroly rukavic", "Vybavení pro odpojení", "Záchranná sada", "Aktuální bezpečnostní manuál"], "notes": ["Provozní pravidla: z TIS stáhněte a vystavte aktuální Bezpečnostní opravárenský manuál pro vozidla s novými zdroji energie (servisní příručka uvádí EUAS-SN-08-2026-001-0-EN; ověřte aktuální revizi). Pro odpojení, ověření nepřítomnosti napětí, opravu a opětovné uvedení do provozu použijte postup z TIS. Pokud na místě není technik s kvalifikací pro VN, zajistěte práci přes nominujícího autorizovaného dealera BYD (BS 12.04)."], "table": null}, {"no": "09", "title": "Diagnostika a nářadí pro EV", "src": "BS oddíl 9", "lead": "Zajistěte diagnostiku kompatibilní s BYD a ověřte aktuální pokrytí modelů v TIS.", "items": [["BS 9.03", "VDS (Vehicle Diagnostic System) – schopný kompletní diagnostiky všech systémů.", "ID nářadí: VDS2100 – 12341589-00."], ["BS 9.04", "VDCI 2.0 (rozhraní pro sběr dat z vozidla) – pro pokročilou diagnostiku a komunikaci s vozidlem.", "ID nářadí: 12363780-00."]], "prep": ["Diagnostické vybavení a aktuální pokrytí modelů", "Ukázkové výstupy z diagnostiky"], "notes": [], "table": null}, {"no": "10", "title": "Nářadí pro ADAS", "src": "BS oddíl 10", "lead": "Zajistěte uvedené kalibrační vybavení a provádějte kalibrace, které vyžaduje příslušná opravárenská metoda.", "items": [["BS 10.01", "Statický kalibrační přípravek ADAS – pro kalibraci ACC (adaptivní tempomat) a MPC (multifunkční kamera).", "ID nářadí: 13132573-00."], ["BS 10.02", "Kalibrační podložka ADAS – podložka pro kalibraci 360° panoramatické kamery.", "ID nářadí: 11047943-00."]], "prep": ["Kalibrační vybavení a pokrytí metod", "Požadované záznamy o kalibracích"], "notes": [], "table": null}, {"no": "11", "title": "Schválené produkty", "src": "BS oddíl 11 + opravy (COR)", "lead": "Používejte produkty schválené BYD a spotřební a spojovací materiál pro konkrétní opravu ověřujte v TIS.", "items": [["BS 11", "Při opravách vozidel BYD, zejména v rámci záruky, se smí používat pouze produkty schválené BYD a produkty specifické pro BYD.", "Pouze schválené produkty. Nesprávné produkty ruší příslušné záruční krytí. BYD může porovnávat objednávky a nároky na opravy. Seznam schválených produktů získejte před auditem; viz příloha A."]], "prep": ["Seznam schválených produktů", "Kontrola etiket a data použitelnosti", "Ověření spotřebního materiálu v TIS"], "notes": [], "table": null}, {"no": "12", "title": "Lidé a školení", "src": "BS oddíl 12 + opravy (COR)", "lead": "Udržujte alespoň pět samostatných zaměstnanců a pokryjte všechny níže uvedené role a kompetence.", "items": [["BS 12.02", "Lakování: 1× lakýrník.", "Akreditace od dodavatele barev nebo uznávaný národní ekvivalent."], ["BS 12.03", "Kalkulace: 1× kalkulant / likvidátor škod.", "Akreditace pro kalkulace a znalost softwaru (např. Audatex nebo GT Motive), případně uznávaný národní ekvivalent."], ["BS 12.04", "MET: 2× MET technik (mechanika, elektrika, interiér).", "Dva pracovníci s kvalifikací MET a kompetencí pro elektrická / hybridní vozidla. Odpojení a opětovné uvedení VN systému jen kvalifikovaný personál; není-li na místě, zajistěte pomoc autorizovaného dealera."], ["BS 12.05", "Specifická školení BYD.", "Absolvujte povinné kurzy BYD pro danou roli, online předpoklady a praktické ověření kompetencí. Certifikáty udržujte platné; ztráta oprávnění může ovlivnit schválení v síti."]], "prep": ["Matice zaměstnanců a rolí", "Akreditace a certifikáty školení BYD", "Oprávnění pro práci na VN"], "notes": ["Oprava stanovuje minimálně pět samostatných zaměstnanců; tabulka rolí udává pokrytí, ne osm samostatných pracovních míst. Souběh rolí je povolen jen tam, kde je uvedeno. BS 12.04 navíc vyžaduje dva MET techniky. Pokud pětičlenný tým nepokryje všechny role a kompetence, doplňte personál nebo si vyžádejte vyjádření BYD."], "table": {"head": ["Role", "Minimální pokrytí"], "rows": [["Vedoucí karosárny", "1; může být souběžně"], ["Kalkulant / likvidátor škod", "1; může být souběžně"], ["Lakýrník", "1"], ["Karosář", "2"], ["Vedoucí skladu dílů", "1; může být souběžně"], ["Kontrolor kvality", "1; může být souběžně"], ["Pracovník úpravy vozidel", "1; může být souběžně"]]}}, {"no": "13", "title": "Řízení a evidence", "src": "BS oddíl 13", "lead": "Udržujte dokumentaci aktuální a připravenou k posouzení.", "items": [["BS 13.01", "Certifikace a pojištění.", "Platné pojištění odpovědnosti zaměstnavatele, veřejné odpovědnosti a odpovědnosti za výrobek a profesní odpovědnosti v požadovaných limitech."], ["BS 13.02", "Záznamy o kalibraci a servisu vybavení musí být aktuální a s požadovanými údaji.", "Dokumenty je povinné evidovat a udržovat ve Vizion Opus. Karosárna musí udržovat veškerý majetek BYD. Kde Vizion Opus není zaveden, ověřte určený portál BYD a do pokynu BYD vedete rovnocenné záznamy."], ["BS 13.03", "Sekce zaměstnanců a kvalifikací v portálu musí být aktuální se všemi produktivními zaměstnanci BYD.", "Uveďte všechny produktivní zaměstnance BYD a udržujte aktuální záznamy o kvalifikacích a školeních."], ["BS 13.04", "Karosárna BYD musí sbírat všechna data KPI podle specifikace BYD.", "Sbírejte přesná data o průběhu oprav a finanční data, měsíční objemy oprav a další KPI stanovené BYD. Žádné další cíle se zde nezavádějí."]], "prep": ["Pojištění", "Záznamy o vybavení", "Záznamy zaměstnanců v portálu", "Měsíční reporting KPI pro BYD"], "notes": [], "table": null}, {"no": "14", "title": "Sdílené prostory dealera a servisu", "src": "Doplňující požadavky: servisní příručka (SG) str. 5–14", "lead": "Doplňky pokrývají témata, která standard karosárny plně nepopisuje. Rozměry a počty pro servis uplatněte jen na příslušný rozsah dealera / servisu; nenahrazují skladbu stání karosárny ani její vyšší požadavky na osvětlení. Použitelnost potvrďte při prohlídce areálu.", "items": [["Nabíjení · str. 6", "Alespoň 1 AC nabíječka min. 11 kW a 1 DC nabíječka min. 40 kW, s ohledem na místní příkon a předpisy.", ""], ["Recepce · str. 6–8", "Recepce u vchodu pro zákazníky ve stejné části areálu jako dílna. Recepční pult, alespoň 2 židle a občerstvení. Aktuální vizuální identita BYD; referenční stěna min. 2 461 mm vysoká a 1 600 mm široká, logo 1 000 × 193 × 50 mm.", ""], ["Servisní stání · str. 9", "Pro sdílený servis: alespoň 2 stání se zvedákem, referenční velikost 4 000 × 7 000 mm, povrchy Cool Gray 3C a bílé čáry stání 100 mm. Minimální prostory karosárny zůstávají podle BS 1.02.", ""], ["Počítače a značení · str. 9–11", "1 tablet nebo počítač na 2 techniky. Nad vyhrazeným servisním stáním označení BYD SERVICE a vhodná výstraha VN / požár. Plakáty v dílně jsou doporučené.", ""], ["Sklad dílů · str. 12", "Alespoň 30 m² samostatného vyhrazeného skladu, fyzicky odděleného od dílny a zákaznických prostor a nepřístupného zákazníkům. Rezervované díly označte; zajistěte řízenou zónu pro záruční díly a regálové štítky BYD PARTS (180 × 100 mm).", ""], ["Pracovní oděvy · str. 13", "Zaměstnanci BYD na plný úvazek nosí vhodný oděv s logem BYD. Lokálně vyráběné oděvy zachovávají schválené logo a barvy; změna střihu vyžaduje schválení centrály.", ""], ["Obecné servisní nářadí · str. 13", "Sdílený servis: alespoň 2 dvousloupové zvedáky min. 3,5 t a 2 vozíky na nářadí, zpravidla 1 na stání. Speciální nářadí pro modely ověřte podle aktuálního seznamu v TIS.", ""], ["Zásoba dílů · str. 14", "Udržujte regionálně doporučenou minimální zásobu BYD a objednávejte přes DMS. Aktuální seznam získáte od regionálního týmu poprodejního servisu.", ""], ["Náhradní vozidla · str. 14", "Minimum 2 vozidel BYD pro karosárnu doplňte o vozidla různých výbav a alespoň 1 prémiový model pro sdílený servis. Aktuálně způsobilé modely potvrďte s BYD.", ""]], "prep": [], "notes": [], "table": null}, {"no": "15", "title": "Skladování a obrat trakčních baterií", "src": "Doplněk: servisní příručka (SG) str. 11–12 a 14; ověřte aktuální bezpečnostní pokyny v TIS", "lead": "Oddělte sklad nových baterií, prostor pro použité baterie a parkování havarovaných vozidel.", "items": [["Nové / skladové baterie", "Pokud držíte trakční baterie skladem, zajistěte vyhrazený skladovací prostor. Příručka doporučuje označený prostor s tabulkou 300 × 100 mm na dveřích nebo přilehlé stěně. Prostor oddělte od obratu použitých baterií a od parkování havarovaných vozidel.", ""], ["Prostor pro obrat použitých baterií", "Venkovní prostor min. 5 × 4 × 2,5 m (D × Š × V) s hasebním vybavením, kamerami, výstražným značením, kouřovými hlásiči, zónou izolace VN a hasicími přístroji CO₂. Hořlavý materiál mimo okruh 2 m. Lze použít venkovní kontejnery v nevýbušném provedení. Tabulka 300 × 100 mm.", ""], ["Reakce na poškozenou baterii", "Zaveďte příslušný Bezpečnostní opravárenský manuál BYD pro vozidla s novými zdroji energie a pokyny TIS pro dané modely (posouzení, manipulace, karanténa, likvidace). Seznam vybavení prostoru pro obrat sám o sobě nedefinuje úplnou reakci na tepelnou událost baterie. Přístup, oddělení a nouzovou reakci naplánujte s regionálním týmem BYD a místními odborníky na požární bezpečnost.", ""], ["Kontejner na VN baterie – rozsah", "Mobilní požární vodní nádrž je v příručce uvedena pro exkluzivní servis. Berte ji jako podmíněnou podle rozsahu servisu a pokynu BYD, ne jako univerzální požadavek pro multi-brand karosárnu. Umístění venku pod střechou kvůli korozi, hladina vody 15–20 cm nad baterií. Používejte jen podle bezpečnostního postupu BYD a schváleného havarijního plánu.", ""]], "prep": [], "notes": [], "table": null}], "appA": [["SURVENTIS", "Glasurit", "Vodouředitelné + rozpouštědlové"], ["SURVENTIS", "RM", "Vodouředitelné + rozpouštědlové"], ["PPG", "Nexa Autocolor 2K", "Rozpouštědlové"], ["PPG", "Aquabase Plus", "Vodouředitelné"], ["PPG", "Global Refinish System", "Rozpouštědlové"], ["PPG", "Envirobase High Performance", "Vodouředitelné"], ["Axalta", "Spies Hecker", "Vodouředitelné + rozpouštědlové"], ["Axalta", "Standox", "Vodouředitelné + rozpouštědlové"], ["Axalta", "Cromax", "Vodouředitelné + rozpouštědlové"], ["AkzoNobel", "Sikkens", "Vodouředitelné + rozpouštědlové"], ["Sherwin-Williams", "Ultra", "Vodouředitelné + rozpouštědlové"], ["Sherwin-Williams", "Debeer", "Vodouředitelné + rozpouštědlové"], ["Donglai", "Onwings", "Rozpouštědlové"], ["Donglai", "Onwaves", "Vodouředitelné"]], "specs": [["Bodová svářečka · B 3.7", "Třífázové napájení 400 V (nebo dle trhu); jednofázové neschváleno. Invertor 1 000 Hz, svařování DC, min. 12 000 A s alarmem nízkého výkonu, 44–56 kVA; přítlak elektrod 500 daN, kapalinou chlazená ramena a alarm nízkého přítlaku."], ["MIG na hliník · B 3.1", "Třífázové napájení (400 V nebo dle trhu); jednofázové neschváleno; jistič 16 A; rozsah proudu pod 15 až nad 270 A; 4kladkový posuv; drát 1,0/1,2 mm; synergický puls."], ["Svařovací materiál · B 3.2–3.4", "Ocelový drát 0,8 mm; křemík 0,8–0,9 %, mangan 1–2 %, vhodná směs s argonem. Pájení: CuSi3, 1,0 mm, čistý argon. Hliník: 4043/4047 pro řadu 6000 a 5554 pro řadu 5000, 1,2 mm, teflonový bovden a čistý argon. Každý úkon ověřte v TIS."], ["Měření karoserie · B 2.1–2.3", "Rovnací rám pro celou modelovou řadu; cca 5,5 m umožní srovnání přední i zadní části bez přestavění. Trvale dostupné měření; výtisky před a po výměně nosných dílů. Mobilní XYZ měření, pokud rám neumí dokumentaci. Hydraulická rozpínací sada min. 4 t."], ["Lakovací box · B 1.1.1–1.5", "Rychlost proudění vzduchu min. 0,25 m/s dle místních požadavků; filtry dle ISO 16890. Osvětlení míchárny / lakování / boxu 1 000 lx. Ventilátory pro sušení vodouředitelných barev dle potřeby; IR sušička min. 3 000 W. Ověřte omezení ohřevu VN baterie v TIS."], ["Nýtování · B 5.1–5.3", "Nýtovač na trhací nýty: 5–7 bar, zdvih 25 mm, 18 000 N při 6 bar. Samoprůrazný nýtovač: pro síly až 80 kN se záznamem dat o provedené práci."], ["Zvedání / přesun · B 8.2–8.7", "Zvedáky: min. 3,5 t pro BYD, 4,5 t pro DENZA, vhodné pro skutečné zatížení / model. Pojízdný zvedák min. 2 t (doporučeno 3 t); podpěry náprav min. 3 t, výška 315–540 mm. Čtyři podvozkové vozíky, 680 kg na vozík pro HEV. Jeřáb na motory min. 1 t."], ["Kalibrace / ohřev · B 3.11, 8.11–8.12", "Momentové klíče: 1/4, 3/8 a 1/2\", kalibrace jednou ročně. Seřizovač světlometů: kalibrace dvakrát ročně. Sledování teploty u hliníku; strop ze zdroje 140 °C, pokud TIS / materiál nestanoví přísnější limit."]], "reg": [["1. Lakování / box / míchárna", [["1.1", "Lakovací box / kabina", "Povinné"], ["1.1.1", "Lakovací box – rychlost / průtok vzduchu", "Povinné"], ["1.1.2", "Lakovací box – specifikace filtrů", "Povinné"], ["1.2.3", "Přívod dýchacího vzduchu: povinný pro rozpouštědlové barvy / izokyanáty; u čistě vodouředitelných volitelný, pokud to riziko a produkt dovolí", "Podmíněné"], ["1.1.4", "Lakovací box – stlačený vzduch", "Povinné"], ["1.2", "Míchárna barev", "Povinné"], ["1.3", "Lakovací pistole", "Povinné"], ["1.4", "Venturiho ventilátory – přenosné nebo pevné v boxu", "Povinné"], ["1.5", "Infračervená sušička", "Povinné"], ["1.6", "Myčka stříkacích pistolí", "Povinné"]]], ["2. Geometrie karoserie", [["2.1", "Rovnací rám", "Povinné"], ["2.2", "Měření karoserie (mobilní)", "Povinné, jen pokud rám neumí tisk měření před a po opravě"], ["2.3", "Hydraulická rozpínací sada min. 4 t", "Povinné"]]], ["3. Svařování", [["3.1", "Svářečky MIG/MAG – ocel a hliník", "Povinné"], ["3.2", "Pájení oceli (UHSS)", "Povinné"], ["3.3", "Svařovací drát (ocel)", "Povinné"], ["3.4", "Svařovací drát (hliník)", "Povinné"], ["3.5", "Svářečská kukla s přívodem vzduchu", "Povinné"], ["3.6", "Průtokoměr plynu", "Povinné"], ["3.7", "Odporové bodové svářečky", "Povinné"], ["3.8", "Indukční ohřev", "Povinné"], ["3.9", "Odsávání svařovacích dýmů (varianta 1 – pevné)", "Povinné"], ["3.10", "Odsávání svařovacích dýmů (varianta 2 – mobilní)", "Povinné"], ["3.11", "Termokřídy / IR teploměr", "Povinné"], ["3.12", "Chladicí gel / pasta", "Povinné"], ["3.13", "Penetrant", "Povinné"], irátory proti prachu; zdroj uvádí typ FFP2. Úroveň ochrany volte podle skutečné expozice a procesu."], ["Barvy / izokyanáty", "Vhodný štít s přívodem vzduchu se signalizací nízkého průtoku nebo polomaska s konstantním průtokem pro stříkání izokyanátů. Proškolte uživatele, zajistěte čistý vzduch v dostatečném množství a během doby odvětrání mlhy štít nezvedejte."], ["Práce s chemikáliemi", "Vhodné kombinézy, rukavice a ochrana očí podle produktu a úkonu. Kompatibilitu ověřte v bezpečnostních listech."], ["Obecně v dílně", "Vhodný pracovní oděv, ochranné brýle, ochrana sluchu, pracovní rukavice a obuv s ochranou špičky."], ["Práce na vysokém napětí", "Izolační rukavice s koženými ochrannými rukavicemi, zkoušečka těsnosti, celoobličejový štít, izolační podložka, izolované nářadí a další opatření pro VN z kapitoly 8."]], "ready": [["Připravenost areálu", "Ověřte minimální skladbu stání, oddělení zákazníků, zabezpečené parkování, bezbariérovost, sklad odpadu, mycí prostor a schválené značení. Zaznamenejte rozměry stání a naměřené osvětlení."], ["Technická připravenost", "Inventura veškerého povinného nářadí; kontrola pokrytí modelů, certifikátů, revizí a kalibrací. Potvrďte oddělené nářadí a OOP pro hliník a odsávání ATEX. Předveďte diagnostiku a ADAS."], ["Personální připravenost", "Doložte alespoň pět zaměstnanců, souběh rolí, dva karosáře, kompetence pro lakování a kalkulace, dva pracovníky s kvalifikací MET a oprávnění pro VN. Ověřte povinné certifikáty školení BYD."], ["Systémová připravenost", "Předveďte roční přímý přístup do TIS, schválený kalkulační software, aktuální opravárenské metody, záznamy v portálu, pojištění, záznamy o školeních a reporting KPI dle BYD."], ["Doklady z probíhající zakázky", "Ukažte metody u vozidla, označený sklad dílů, ochranu vozidla, diagnostiku před a po opravě, výstupy kalibrací / měření a podepsanou výstupní kontrolu."], ["Připravenost pro zákazníky", "Ukažte zajištění 24hodinového odtahu, dvě náhradní vozidla BYD, komunikaci se zákazníkem, soukromý prostor pro jednání a čisté předání vozidla."], ["Doplňky sdíleného servisu", "S BYD potvrďte nabíjení, rozsah skladu dílů, sdílená servisní stání / zvedáky, počítače, pracovní oděvy, doporučenou zásobu a podmíněné prostory pro baterie."], ["Uzavření posouzení", "U každého nedostatku zaznamenejte odpovědnou osobu, nápravné opatření, termín a doklad. Navrhované odchylky předložte BYD k posouzení a uchovejte rozhodnutí. Příručka nezavádí žádné bodové hodnocení, hranici úspěšnosti ani cíle KPI."]], "corrections": "1 000 lx v míchárně; opravené rozměry prostoru pro hliník; podpěry náprav 3 t; kalibrace seřizovače světlometů dvakrát ročně; povinný indukční ohřev; minimálně pět zaměstnanců a opravená matice rolí; přístup do TIS přes dealera; formulace k bateriím a lepidlům podle BYD TIS; značka SURVENTIS; obsah křemíku v ocelovém drátu 0,8–0,9 %; podmíněný požadavek na dýchací vzduch při zachování ochrany proti izokyanátům."}</script>

     + g[1].map(function(r){ return '<tr class="search-row"><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td><span class="st '+stCls(r[2])+'">'+esc(r[2])+'</span></td></tr>'; }).join('') + '</tbody></table></div>'; }).join('') + '</div>';
h += app('pB','B','Registr vybavení','BS příloha 2, opraveno a upřesněno COR; čtěte spolu s kapitolami 5–10','Udržujte každou povinnou položku včetně příslušenství. U sdílených položek musí být přístup prokazatelný. Před objednáním ověřte specifikace výrobce a aktuální TIS.', regBody);
h += app('pC','C','Osobní ochranné pracovní prostředky','BS příloha 3; upřesnění dýchacího vzduchu podle COR','Každému zaměstnanci zajistěte ochranný oděv a OOP pro daný úkon. Pro ocel a hliník udržujte oddělené sady OOP uložené mimo kontaminaci.',
  tableHtml({head:['Úkon / položka','Požadované vybavení'], rows:D.ppe}));
h += app('pD','D','Kontrolní seznam připravenosti dealera','Praktický kontrolní seznam odvozený z BS, COR a doplňků SG','',
  '<div class="tblwrap"><div class="grid2">'+D.ready.map(function(r){ return '<div class="box search-row"><b>'+esc(r[0])+'</b>'+esc(r[1])+'</div>'; }).join('')+'</div></div><div class="callout"><b>Zapracované opravy:</b> '+esc(D.corrections)+'</div>');
h += '<div id="noHits">Pro hledaný výraz nebyl nalezen žádný požadavek.</div>';
document.getElementById('main').innerHTML = h;
document.getElementById('toc').innerHTML = toc;

// ovládání
var chaps = document.querySelectorAll('details.chap');
document.getElementById('openAll').onclick = function(){ chaps.forEach(function(d){ d.open = true; }); };
document.getElementById('closeAll').onclick = function(){ chaps.forEach(function(d){ d.open = false; }); };
document.getElementById('print').onclick = function(){ var st = []; chaps.forEach(function(d){ st.push(d.open); d.open = true; }); window.print(); setTimeout(function(){ chaps.forEach(function(d,i){ d.open = st[i]; }); }, 500); };
document.querySelectorAll('nav.toc a').forEach(function(a){ a.addEventListener('click', function(){ var t = document.querySelector(a.getAttribute('href')); if (t && t.tagName==='DETAILS') t.open = true; }); });

// vyhledávání
var orig = new Map();
document.querySelectorAll('.search-row').forEach(function(r){ orig.set(r, r.innerHTML); });
function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
var timer;
document.getElementById('q').addEventListener('input', function(e){ clearTimeout(timer); timer = setTimeout(function(){ search(e.target.value); }, 150); });
function search(q){
  q = q.trim(); var nq = norm(q), any = false;
  orig.forEach(function(html, r){ r.innerHTML = html; r.classList.remove('hidden'); });
  document.querySelectorAll('.search-block').forEach(function(b){ b.classList.remove('hidden'); });
  document.getElementById('noHits').style.display = 'none';
  if (nq.length < 2) return;
  orig.forEach(function(html, r){
    var hit = norm(r.textContent).indexOf(nq) >= 0;
    r.classList.toggle('hidden', !hit);
    if (hit) highlight(r, nq);
  });
  document.querySelectorAll('details.chap').forEach(function(d){
    var rows = d.querySelectorAll('.search-row'), vis = d.querySelectorAll('.search-row:not(.hidden)').length;
    var headHit = norm(d.querySelector('summary').textContent).indexOf(nq) >= 0;
    if (headHit) { rows.forEach(function(r){ r.classList.remove('hidden'); }); vis = rows.length || 1; }
    d.classList.toggle('hidden', !vis); if (vis) { d.open = true; any = true; }
    d.querySelectorAll('.reggrp').forEach(function(g){ g.classList.toggle('hidden', !headHit && !g.querySelector('.search-row:not(.hidden)')); });
  });
  ['uvod','postup'].forEach(function(id){ var el = document.getElementById(id), hit = norm(el.textContent).indexOf(nq) >= 0; el.classList.toggle('hidden', !hit); if (hit) any = true; });
  document.getElementById('noHits').style.display = any ? 'none' : 'block';
}
function highlight(el, nq){
  var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [], n;
  while ((n = w.nextNode())) nodes.push(n);
  nodes.forEach(function(t){
    var s = t.nodeValue, ns = norm(s), i = ns.indexOf(nq);
    if (i < 0 || ns.length !== s.length) return;
    var span = document.createElement('span');
    span.innerHTML = esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i, i+nq.length)) + '</mark>' + esc(s.slice(i+nq.length));
    t.parentNode.replaceChild(span, t);
  });
}
// zvýraznění aktivní kapitoly v obsahu
var links = Array.prototype.slice.call(document.querySelectorAll('nav.toc a'));
var obs = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { links.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href')==='#'+e.target.id); }); } }); }, {rootMargin:'-90px 0px -70% 0px'});
document.querySelectorAll('#main > section[id], #main > details[id]').forEach(function(s){ obs.observe(s); });
})();
</script>
</body>
