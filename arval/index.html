<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Audity">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
<title>Certifikační audit ARVAL</title>
<style>html.ia-guard body{visibility:hidden}</style>
<script>document.documentElement.classList.add("ia-guard")</script>
<script type="module" src="../js/guard.js?v=20261119g"></script>
<script type="module" src="../js/db-bridge.js?v=20261119g"></script>
<script type="module" src="../js/photos.js?v=20261119g"></script>
<script type="module" src="../js/locations.js?v=20261119g"></script>

<style>
:root{
  --navy:#00693E;
  --navy-2:#00854A;
  --brand-bright:#00A651;
  --brand-soft:#E1F3E8;
  --steel:#5B6B7A;
  --line:#D9E3DD;
  --paper:#F5F8F6;
  --card:#FFFFFF;
  --ink:#1B2430;
  --amber:#C9781F;
  --amber-soft:#F3E3D0;
  --good:#2F7A4D;
  --good-soft:#E4F1E8;
  --bad:#B23B3B;
  --bad-soft:#F6E4E4;
  --warn:#A6761F;
  --warn-soft:#F3ECD8;
  --radius:8px;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.45;
}
h1,h2,h3,h4{font-weight:600; margin:0 0 4px 0;}
p{margin:0 0 8px 0;}
button{font-family:inherit;}

/* ---------- App shell ---------- */
.app{
  display:grid;
  grid-template-columns: 250px 1fr;
  min-height:100vh;
}
.topbar{
  grid-column: 1 / -1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(135deg, var(--navy), var(--navy-2));
  color:#fff;
  padding:10px 22px;
  position:sticky; top:0; z-index:50;
  border-bottom:3px solid var(--brand-bright);
}
.topbar .brand{
  display:flex; align-items:center; gap:14px;
}
.topbar .brand .mark{
  display:flex; align-items:center;
  background:#fff; border-radius:6px; padding:6px 10px;
  line-height:0;
}
.topbar .brand .mark img{ display:block; height:26px; width:auto; }
.topbar .brand .sub{ color:#D3E9DE; font-size:0.86rem; border-left:1px solid rgba(255,255,255,0.3); padding-left:14px; }
.topbar-actions{ display:flex; gap:10px; align-items:center; }
.btn{
  border:1px solid transparent;
  border-radius:6px;
  padding:9px 14px;
  font-size:0.88rem;
  cursor:pointer;
  transition: background .12s ease, border-color .12s ease;
}
label.btn{ display:inline-block; line-height:1.3; }
.btn-primary{ background:var(--brand-bright); color:#fff; font-weight:600; }
.btn-primary:hover{ background:#00913F; }
.btn-ghost{ background:transparent; color:#fff; border-color:rgba(255,255,255,0.35); }
.btn-ghost:hover{ background:rgba(255,255,255,0.1); }
.btn-line{ background:#fff; color:var(--navy); border-color:var(--line); }
.btn-line:hover{ background:var(--brand-soft); }
.save-note{ font-size:0.78rem; color:#AEBBC7; min-width:110px; text-align:right; }

/* dropdown (Chybějící vybavení) */
.dropdown-wrap{ position:relative; }
.btn-icon{ display:inline-flex; align-items:center; gap:7px; }
.dropdown-menu{
  position:absolute; top:calc(100% + 6px); right:0;
  background:#fff; border:1px solid var(--line); border-radius:8px;
  box-shadow:0 8px 24px rgba(15,44,70,0.18);
  min-width:220px; padding:6px; z-index:60;
}
.dropdown-item{
  display:block; width:100%; text-align:left;
  background:none; border:none; border-radius:6px;
  padding:9px 12px; font-size:0.88rem; color:var(--ink);
  cursor:pointer;
}
.dropdown-item:hover{ background:var(--brand-soft); color:var(--navy); }

/* folder connection status */
.folder-status{ font-size:0.78rem; color:#D3E9DE; display:flex; align-items:center; gap:8px; }
.folder-status button{
  background:none; border:none; color:#D3E9DE; text-decoration:underline;
  font-size:0.78rem; cursor:pointer; padding:0;
}

/* folder picker modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,44,70,0.45);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-overlay[hidden]{ display:none !important; }
.modal-box{
  background:#fff; border-radius:12px; width:100%; max-width:480px; max-height:80vh;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.25);
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; border-bottom:1px solid var(--line);
}
.modal-head h3{ font-size:1rem; color:var(--navy); margin:0; }
.modal-close{
  background:none; border:none; font-size:1.4rem; line-height:1; color:var(--steel);
  cursor:pointer; padding:0 4px;
}
.modal-body{ overflow-y:auto; padding:8px; }
.modal-item{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; text-align:left; background:none; border:none; border-radius:8px;
  padding:11px 12px; cursor:pointer; font-size:0.9rem; color:var(--ink);
}
.modal-item:hover{ background:var(--brand-soft); }
.modal-item-name{ font-weight:600; word-break:break-all; }
.modal-item-date{ font-size:0.78rem; color:var(--steel); white-space:nowrap; flex-shrink:0; }
.modal-empty{ padding:24px 14px; text-align:center; color:var(--steel); font-size:0.9rem; }
.modal-text{ padding:4px 14px 14px; font-size:0.9rem; color:var(--ink); line-height:1.45; }
.modal-text b{ color:var(--navy); }
.modal-actions{ display:flex; flex-direction:column; gap:8px; padding:4px 14px 16px; }
.modal-actions .btn{ width:100%; justify-content:center; }
.modal-match-list{ padding:0 14px 6px; }
.modal-match-list .modal-item{ padding:9px 10px; font-size:0.85rem; }

/* ---------- Sidebar ---------- */
.sidebar{
  background:#fff;
  border-right:1px solid var(--line);
  padding:18px 12px 24px;
  position:sticky; top:57px;
  height: calc(100vh - 57px);
  overflow-y:auto;
}
.nav-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%;
  text-align:left;
  padding:10px 12px;
  border-radius:6px;
  border:none;
  background:transparent;
  color:var(--ink);
  font-size:0.9rem;
  cursor:pointer;
  margin-bottom:2px;
}
.nav-item:hover{ background:#F1EFE9; }
.nav-item.active{ background:var(--navy); color:#fff; }
.nav-item .chip{
  font-size:0.72rem;
  padding:2px 7px;
  border-radius:999px;
  background:var(--line);
  color:var(--steel);
  white-space:nowrap;
}
.nav-item.active .chip{ background:rgba(255,255,255,0.18); color:#fff; }
.nav-item.lvl3 .chip{ background:var(--good-soft); color:var(--good); }
.nav-item.lvl2 .chip{ background:var(--warn-soft); color:var(--warn); }
.nav-item.lvl1 .chip{ background:var(--amber-soft); color:var(--amber); }
.nav-item.lvl0 .chip{ background:var(--bad-soft); color:var(--bad); }
.nav-item.active.lvl3 .chip, .nav-item.active.lvl2 .chip, .nav-item.active.lvl1 .chip, .nav-item.active.lvl0 .chip{
  background:rgba(255,255,255,0.2); color:#fff;
}
.nav-group-label{
  font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;
  color:var(--steel); margin:16px 10px 6px;
}
.nav-group-label:first-child{ margin-top:2px; }

/* ---------- Main ---------- */
.main{ padding:26px 34px 80px; max-width:980px; }
.section{ display:none; }
.section.active{ display:block; }

.section-head{ margin-bottom:18px; }
.section-head h2{ font-size:1.5rem; color:var(--navy); }
.section-head .desc{ color:var(--steel); font-size:0.92rem; }

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px 22px;
  margin-bottom:18px;
}
.card h3{ font-size:1rem; color:var(--navy-2); margin-bottom:14px; }

.field-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:14px 20px;
}
.field-grid.cols-3{ grid-template-columns: repeat(3, 1fr); }
.field-grid.cols-4{ grid-template-columns: repeat(4, 1fr); }
.sub-label{
  font-size:0.74rem; text-transform:uppercase; letter-spacing:0.04em;
  color:var(--steel); margin:16px 0 8px; padding-top:14px; border-top:1px dashed var(--line);
}
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:0.8rem; color:var(--steel); }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=email], .field input[type=tel], .field textarea, .field select{
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 10px;
  font-size:0.92rem;
  font-family:inherit;
  color:var(--ink);
  background:#fff;
}
.field textarea{ resize:vertical; min-height:70px; }
.field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--brand-bright); outline-offset:1px; }

.yn{ display:flex; gap:14px; }
.yn label{ display:flex; align-items:center; gap:6px; font-size:0.88rem; cursor:pointer; }

/* ---------- Progress ---------- */
.progress-bar{
  height:8px; border-radius:999px; background:var(--line); overflow:hidden;
}
.progress-bar > i{ display:block; height:100%; background:var(--brand-bright); }

.level-summary{
  display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;
}
.level-pill{
  flex:1; min-width:130px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  background:#fff;
}
.level-pill .lp-top{ display:flex; justify-content:space-between; font-size:0.78rem; color:var(--steel); margin-bottom:6px;}
.level-pill .lp-count{ font-weight:600; color:var(--ink); font-size:0.85rem; }
.level-pill.met{ background:var(--good-soft); border-color:#BFE1CB; }
.level-pill.met .lp-count{ color:var(--good); }

.result-banner{
  display:flex; align-items:center; justify-content:space-between;
  border-radius:8px; padding:14px 18px; margin:16px 0 6px;
  background:var(--amber-soft); border:1px solid #E7C79B;
}
.result-banner.ok{ background:var(--good-soft); border-color:#BFE1CB; }
.result-banner.fail{ background:var(--bad-soft); border-color:#E7BDBD; }
.result-banner .rb-label{ font-size:0.82rem; color:var(--steel); }
.result-banner .rb-value{ font-size:1.25rem; font-weight:700; color:var(--navy); }
.result-banner.ok .rb-value{ color:var(--good); }
.result-banner.fail .rb-value{ color:var(--bad); }

/* ---------- Criteria groups ---------- */
.group{ margin-bottom:6px; }
/* Print-only two-column checklist layout (built by appendItemsCard in JS)
   stays hidden on screen; @media print flips this and hides the screen list. */
.items-card-print{ display:none; }

/* Chybějící vybavení — a synthetic report built only for export, never
   shown on screen; @media print swaps it in when body.exporting-missing. */
#missing-report{ display:none; }
.cover-logo-print{ display:none; }
.group-title{
  font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;
  color:var(--steel); border-bottom:1px solid var(--line); padding:14px 0 6px;
}
.item-row{
  display:flex; align-items:flex-start; gap:12px;
  padding:11px 2px;
  border-bottom:1px dashed var(--line);
}
.item-row:last-child{ border-bottom:none; }
.item-text{ flex:1; font-size:0.92rem; }
.item-text .same-name{ color:inherit; font-style:normal; font-size:inherit; }
.photo-btn{ flex-shrink:0; display:flex; align-items:center; }
.photo-btn-icon{
  display:flex; align-items:center; justify-content:center;
  width:28px; height:28px; border-radius:7px;
  border:1px solid var(--line); background:#fff; color:var(--steel);
  cursor:pointer; padding:0;
}
.photo-btn-icon:hover{ border-color:var(--navy); color:var(--navy); }
.photo-btn.done .photo-btn-icon{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
.lvl-badge{
  flex-shrink:0;
  font-size:0.72rem; font-weight:600;
  padding:3px 9px; border-radius:999px;
  color:#fff;
}
.lvl-badge.l1{ background:#5CAE84; }
.lvl-badge.l2{ background:#1F8C57; }
.lvl-badge.l3{ background:var(--navy); }

/* custom checkbox */
.chk{ position:relative; width:22px; height:22px; flex-shrink:0; margin-top:1px; }
.chk input{ position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%; cursor:pointer; }
.chk .box{
  position:absolute; inset:0;
  border:2px solid #B7BFC7; border-radius:5px; background:#fff;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
.chk input:checked ~ .box{ background:var(--navy); border-color:var(--navy); }
.chk .box::after{
  content:''; width:6px; height:11px;
  border:solid #fff; border-width:0 2.5px 2.5px 0;
  transform:rotate(40deg) translate(-1.5px,-1.5px);
  opacity:0;
}
.chk input:checked ~ .box::after{ opacity:1; }
.chk input:focus-visible ~ .box{ outline:2px solid var(--brand-bright); outline-offset:2px; }

/* radio (ESG select groups) */
.radio-opt{ display:flex; align-items:center; gap:10px; padding:7px 2px; }
.radio-opt input{ width:18px; height:18px; accent-color:var(--navy); cursor:pointer; }
.radio-opt .ro-label{ flex:1; font-size:0.9rem; }
.radio-opt .ro-pts{ font-size:0.76rem; color:var(--steel); }

/* ---------- Results table ---------- */
.results-table{ width:100%; border-collapse:collapse; margin-top:6px; }
.results-table th, .results-table td{
  text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:0.88rem;
}
.results-table th{ color:var(--steel); font-weight:600; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.03em; }
.badge{
  display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.78rem; font-weight:600;
}
.badge.ok{ background:var(--good-soft); color:var(--good); }
.badge.mid{ background:var(--warn-soft); color:var(--warn); }
.badge.low{ background:var(--amber-soft); color:var(--amber); }
.badge.fail{ background:var(--bad-soft); color:var(--bad); }

/* signature */
.sig-wrap{ border:1px solid var(--line); border-radius:8px; background:#fff; }
.sig-wrap canvas{ display:block; width:100%; height:130px; touch-action:none; cursor:crosshair; }
.sig-actions{ display:flex; justify-content:flex-end; padding:6px 8px; border-top:1px solid var(--line); }
.sig-actions button{ background:none; border:none; color:var(--steel); font-size:0.78rem; cursor:pointer; text-decoration:underline; }

.footer-nav{ display:flex; justify-content:space-between; margin-top:26px; }

@media screen and (max-width: 1024px){
  .field-grid.cols-3, .field-grid.cols-4{ grid-template-columns: repeat(2, 1fr); }
}

@media screen and (max-width: 860px){
  .app{ grid-template-columns: 1fr; }

  .topbar{
    flex-wrap:wrap;
    row-gap:10px;
    padding:10px 14px;
  }
  .topbar .brand{ gap:10px; }
  .topbar .brand .mark img{ height:22px; }
  .topbar .brand .sub{
    font-size:0.78rem;
    border-left:none; padding-left:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:38vw;
  }
  .topbar-actions{
    width:100%;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:8px;
  }
  .topbar-actions .save-note{ min-width:0; flex-basis:100%; text-align:left; order:10; }
  .btn{ padding:8px 12px; font-size:0.82rem; }

  /* Sidebar becomes a horizontally-scrollable tab strip, sticky under the topbar */
  .sidebar{
    position:sticky; top:0;
    height:auto; max-height:none;
    display:flex; flex-wrap:nowrap; align-items:center;
    gap:6px;
    padding:10px 12px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-right:none; border-bottom:1px solid var(--line);
    z-index:40;
  }
  .sidebar::-webkit-scrollbar{ height:5px; }
  .sidebar::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
  .nav-group-label{ display:none; }
  .nav-item{
    flex-shrink:0;
    width:auto;
    white-space:nowrap;
    padding:9px 13px;
    gap:8px;
  }

  .main{ padding:18px 16px 60px; }
  .field-grid, .field-grid.cols-3, .field-grid.cols-4{ grid-template-columns:1fr; }

  /* Prevent iOS Safari auto-zoom on focus (needs >=16px) and grow touch targets */
  .field input[type=text], .field input[type=number], .field input[type=date],
  .field input[type=email], .field input[type=tel], .field textarea, .field select{
    font-size:16px;
    padding:10px 12px;
  }
  .chk{ width:26px; height:26px; }
  .yn{ gap:18px; }
  .yn label, .radio-opt{ padding:4px 0; }
  .yn input, .radio-opt input{ width:20px; height:20px; }

  .level-summary{ gap:8px; }
  .level-pill{ min-width:0; flex:1 1 45%; }

  .item-row{ padding:12px 2px; gap:10px; }
  .lvl-badge{ font-size:0.68rem; padding:3px 8px; }

  .results-table{ display:block; overflow-x:auto; white-space:nowrap; }

  .footer-nav{ flex-wrap:wrap; gap:10px; }
  .footer-nav .btn{ flex:1 1 auto; text-align:center; }
}

@media screen and (max-width: 480px){
  .topbar .brand .sub{ display:none; }
  .field-grid.cols-3, .field-grid{ gap:12px; }
  .card{ padding:16px 16px; }
}

/* ---------- Print ---------- */
@page{ size: A4; margin: 6mm; }
@media print{
  html{ font-size:12px; }
  body{ background:#fff; }
  .topbar, .sidebar, .footer-nav, .no-print,
  .note-card, .level-summary, .result-banner, .section-head .desc{ display:none !important; }
  .app{ display:block; }
  .main{ max-width:none; padding:0 6mm; }

  /* Only two hard page breaks: the cover (Základní údaje, first already) and the
     final Výsledky/output page. Everything else flows to keep the PDF short. */
  .section{ display:block !important; page-break-before: auto; }
  .section:first-of-type{ page-break-before: avoid; }
  #sec-vysledky{ page-break-before: always; }
  #sec-lakovna{ page-break-before: always; }

  .section-head{ margin-bottom:4px; break-after:avoid; }
  .section-head h2{ font-size:1.1rem; margin-top:2px; }

  .cover-logo-print{
    display:block !important; text-align:center;
    margin:0 0 10px; padding-top:2mm;
  }
  .cover-logo-print img{ width:105mm; height:auto; max-width:100%; }

  /* Force "Obecné" onto its own fresh page, together with Náhradní vozidla
     that follows it — Základní údaje / Servis / Karosárna / Lakovna stay
     on page 1. */
  .card-obecne{ break-before: page; }

  /* Základní údaje page: tighten spacing so page 1 (Základní údaje,
     Karosárna, Lakovna) reliably fits on one sheet even with both external
     dodavatel blocks expanded. */
  #sec-zaklad .card{ padding:6px 12px; margin-bottom:6px; }
  #sec-zaklad .card h3{ margin-bottom:4px; font-size:0.92rem; }
  #sec-zaklad .field-grid{ gap:4px 12px; }

  /* Safety net: if content is still longer than one page in some browser's
     margin/font rendering, let these two cards break internally instead of
     jumping whole and leaving a large blank gap behind them. */
  .card-karoserie, .card-lakovna{ break-inside:auto; }
  #sec-zaklad .sub-label{ margin:8px 0 5px; padding-top:6px; }

  .card{ break-inside:avoid; border-color:#ccc; padding:10px 14px; margin-bottom:10px; }
  .card h3{ margin-bottom:8px; }
  .item-row{ break-inside:avoid; padding:5px 2px; }
  .group-title{ break-after:avoid; padding:8px 0 3px; }
  .chk{ width:15px; height:15px; }
  /* Nesplněná kritéria v PDF exportu: čtverec vyplněný plnou barvou a
     tučný text, aby na vytištěné/exportované sestavě vynikla. */
  .chk input:not(:checked) ~ .box{ background:var(--bad); border-color:var(--bad); }
  .chk:has(input:not(:checked)) ~ .item-text{ font-weight:700; color:var(--bad); }
  .field-grid{ gap:8px 12px; }
  .field-grid.cols-4{ gap:8px 8px; }
  .field-grid.cols-4 .field label{ font-size:0.7rem; white-space:nowrap; }

  /* Criteria checklists: on screen a single list (.items-card-screen); in
     print, real floated two-column blocks (.items-card-print) — CSS
     column-count doesn't rebalance once a list spans more than one printed
     page, so the JS pre-splits the items and we float two independent
     blocks side by side instead. */
  .items-card-screen{ display:none !important; }
  .items-card-print{ display:block !important; break-inside:auto; border-color:#ccc; padding:10px 14px; margin-bottom:10px; }
  /* ESG group cards: let them break across pages instead of jumping the
     whole card to the next page, which left large blank gaps behind. */
  .esg-group-card{ break-inside:auto; }

  /* Výsledky (results) page: compact everything so the whole page — table,
     platnost, doporučení, kontakty and signatures — fits on one sheet. */
  #sec-vysledky .card{ padding:8px 12px; margin-bottom:8px; }
  #sec-vysledky .card h3{ margin-bottom:6px; font-size:0.92rem; }
  #sec-vysledky .results-table th, #sec-vysledky .results-table td{ padding:5px 10px; font-size:0.8rem; }
  #sec-vysledky .field-grid{ margin-top:8px !important; gap:6px 12px; }
  #sec-vysledky .field label{ font-size:0.72rem; }
  #sec-vysledky .field input, #sec-vysledky .field select{ padding:4px 8px; font-size:0.8rem; }
  #sec-vysledky .sig-wrap canvas{ height:55px; }
  #sec-vysledky .sig-actions{ display:none; }
  #sec-vysledky textarea{ height:40px; min-height:0; padding:6px 8px !important; font-size:0.8rem !important; }
  #sec-vysledky .field > div{ padding:2px 0 !important; }
  #sec-vysledky .field-grid.cols-3{ margin-top:6px !important; }
  .print-cols{ display:block; }
  .print-cols::after{ content:""; display:block; clear:both; }
  .print-col{ float:left; width:47.5%; }
  .print-col + .print-col{ margin-left:5%; }

  a[href]:after{ content:""; }

  /* Chybějící vybavení export — hide the normal form, show only the report */
  body.exporting-missing .app{ display:none !important; }
  body.exporting-missing #missing-report{
    display:block !important; padding:0 6mm; max-width:none;
  }
  #missing-report .mr-title{ font-size:1.3rem; color:var(--navy); margin-bottom:2px; }
  #missing-report .mr-sub{ color:var(--steel); font-size:0.85rem; margin-bottom:14px; }
  #missing-report .card{ break-inside:avoid; border-color:#ccc; padding:10px 14px; margin-bottom:10px; }
  #missing-report h3{ font-size:1rem; color:var(--navy-2); margin-bottom:8px; }
  #missing-report .group-title{ break-after:avoid; padding:8px 0 3px; }
  #missing-report .item-row{ break-inside:avoid; padding:5px 2px; }
  #missing-report .mr-empty{ color:var(--steel); font-style:italic; }
}

<script>
(function(){
"use strict";

var CATEGORIES = JSON.parse(document.getElementById('categories-data').textContent);
var ESG = JSON.parse(document.getElementById('esg-data').textContent);
var NAHRADNI = JSON.parse(document.getElementById('nahradni-data').textContent);
var NAHRADNI_AFFECTS = CATEGORIES.filter(function(c){ return c.sharesNahradni; }).map(function(c){ return c.title; });

/* ---------------- State ---------------- */
var state = {
  meta: {
    partner:"", ic:"", ulice:"", psc:"",
    auditor:"", datumAuditu: todayIso(), // 'auditor' kept for backward-compat with saved drafts; unused in UI now
    pocetMechaniku:"", pocetKaroseru:"", pocetLakyrniku:"",
    karoserieExterni:"vlastni", dodavatelKarosarna:"", dodavatelKarosarnaIco:"", dodavatelKarosarnaUlice:"", dodavatelKarosarnaPsc:"",
    lakovnaExterni:"vlastni", dodavatelLakovna:"", dodavatelLakovnaIco:"", dodavatelLakovnaUlice:"", dodavatelLakovnaPsc:"", lakovnaZnackaMaterialu:"",
    nahradniPocet:"", nahradniStari:"", nahradniVlastnik:"",
    platnostMesicu:"36",
    audaflow:"ne", teccontrol:"ne", bodoveOpravy:"ano", cng:"ne"
  },
  checks: {},      // itemId -> bool   (category criteria, incl. shared nahradni-* ids)
  esgChecks: {},   // itemId -> bool   (ESG ano/ne items)
  esgRadio: {},    // groupItemId -> option index
  photographed: {}, // starší verze: jen značka „fotka pořízena do zařízení“
  photos: {},       // itemId -> {p: cesta v úložišti, t: miniatura, at, kb, up}
  doporuceni: "",
  kontakty: {
    auditorJmeno:"", auditorTel:"", auditorEmail:"",
    odpovednaJmeno:"", odpovednaTel:"", odpovednaEmail:"",
    misto:"", datumPodpisu:""
  },
  sig: { auditor: null, odpovedna: null } // dataURLs, kept in memory only
};

var SECTIONS = [{id:"zaklad", title:"Základní údaje"}, {id:"nahradni", title:"Náhradní vozidla"}]
  .concat(CATEGORIES.map(function(c){ return {id:c.id, title:c.title}; }))
  .concat([{id:"esg", title:"ESG a CSR"}, {id:"vysledky", title:"Výsledky a doporučení"}]);

var activeSection = "zaklad";

/* ---------------- Level computation ---------------- */
// A level N is reached when every criterion with level <= N is checked.
// Categories flagged sharesNahradni also fold in the shared "Náhradní vozidla"
// criteria (same 5 items, same checked state) — checking them once in the
// dedicated section automatically counts in every section that shares them.
function categoryResult(cat){
  var items = cat.items;
  if (cat.sharesNahradni) items = items.concat(NAHRADNI.items);
  var total = items.length;
  var achieved = 0;
  var perLevel = {1:{done:0,total:0}, 2:{done:0,total:0}, 3:{done:0,total:0}};
  items.forEach(function(it){
    var checked = !!state.checks[it.id];
    if (checked) achieved++;
    for (var n = it.level; n <= 3; n++){
      perLevel[n].total++;
      if (checked) perLevel[n].done++;
    }
  });
  var reachedLevel = 0;
  [1,2,3].forEach(function(n){
    if (perLevel[n].total > 0 && perLevel[n].done === perLevel[n].total) reachedLevel = n;
  });
  return { total: total, achieved: achieved, perLevel: perLevel, level: reachedLevel };
}

// Standalone result for the shared "Náhradní vozidla" criteria on their own
// (used for the dedicated section's own banner — the same 5 items also feed
// into categoryResult() for every section with sharesNahradni).
function nahradniResult(){
  return categoryResult({ items: NAHRADNI.items, sharesNahradni: false });
}

function esgResult(){
  var points = 0, max = 0;
  ESG.groups.forEach(function(g){
    g.items.forEach(function(it){
      if (it.type === "radio" || (!it.type && g.type === "radio")){
        var opts = it.options;
        var maxOpt = Math.max.apply(null, opts.map(function(o){return o.points;}));
        max += maxOpt;
        var sel = state.esgRadio[it.id];
        if (sel !== undefined && opts[sel]) points += opts[sel].points;
      } else {
        max += it.points;
        if (state.esgChecks[it.id]) points += it.points;
      }
    });
  });
  var label = "Neúspěšný audit";
  ESG.thresholds.forEach(function(t){
    if (points >= t.min && points <= t.max) label = t.label;
  });
  return { points: points, max: max, label: label };
}

function levelLabel(n){
  if (n === 0) return "Neúspěšná certifikace";
  return "Úroveň " + n;
}
function levelClass(n){
  if (n === 0) return "fail";
  if (n === 1) return "low";
  if (n === 2) return "mid";
  return "ok";
}

/* ---------------- Rendering ---------------- */
var sidebarEl = document.getElementById('sidebar');
var mainEl = document.getElementById('main');

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'for') e.htmlFor = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'maxlength') e.setAttribute('maxlength', attrs[k]);
    else if (k === 'inputmode') e.setAttribute('inputmode', attrs[k]);
    else if (k.indexOf('data-') === 0) e.setAttribute(k, attrs[k]);
    else e[k] = attrs[k];
  });
  (children||[]).forEach(function(c){ if (c) e.appendChild(c); });
  return e;
}
function text(s){ return document.createTextNode(s); }

function renderSidebar(){
  sidebarEl.innerHTML = "";
  sidebarEl.appendChild(el('div',{class:'nav-group-label'},[text('Formulář')]));
  var navZaklad = navItem({id:'zaklad', title:'Základní údaje'}, null);
  sidebarEl.appendChild(navZaklad);
  var nr = nahradniResult();
  sidebarEl.appendChild(navItem({id:'nahradni', title:'Náhradní vozidla'}, {n:null, text: nr.achieved+'/'+nr.total}));

  sidebarEl.appendChild(el('div',{class:'nav-group-label'},[text('Hodnocení dílen')]));
  CATEGORIES.forEach(function(cat){
    var r = categoryResult(cat);
    sidebarEl.appendChild(navItem({id:cat.id, title:cat.title}, {n:r.level, text: r.achieved+'/'+r.total}));
  });

  sidebarEl.appendChild(el('div',{class:'nav-group-label'},[text('ESG')]));
  var er = esgResult();
  sidebarEl.appendChild(navItem({id:'esg', title:'ESG a CSR'}, {n:null, text: er.points+'b', customClass: esgChipClass(er.label)}));

  sidebarEl.appendChild(el('div',{class:'nav-group-label'},[text('Souhrn')]));
  sidebarEl.appendChild(navItem({id:'vysledky', title:'Výsledky a doporučení'}, null));

  // On the horizontal-scroll tab strip (tablet/phone) keep the active tab in view.
  if (window.innerWidth <= 860){
    var activeEl = sidebarEl.querySelector('.nav-item.active');
    if (activeEl) activeEl.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }
}

function esgChipClass(label){
  if (label.indexOf('3')>-1) return 'lvl3';
  if (label.indexOf('2')>-1) return 'lvl2';
  if (label.indexOf('1')>-1) return 'lvl1';
  return 'lvl0';
}

function navItem(sec, chipInfo){
  var cls = 'nav-item' + (sec.id===activeSection ? ' active':'') + (chipInfo && chipInfo.n!==null && chipInfo.n!==undefined ? ' lvl'+chipInfo.n : (chipInfo && chipInfo.customClass ? ' '+chipInfo.customClass : ''));
  var children = [ el('span',{},[text(sec.title)]) ];
  if (chipInfo){
    children.push(el('span',{class:'chip'},[text(chipInfo.text)]));
  }
  var btn = el('button',{class:cls, type:'button'}, children);
  btn.addEventListener('click', function(){ activeSection = sec.id; renderAll(); window.scrollTo({top:0, behavior:'instant'}); });
  return btn;
}

function showSection(id){
  document.querySelectorAll('.section').forEach(function(s){
    s.classList.toggle('active', s.id === 'sec-'+id);
  });
}

/* ------- Základní údaje ------- */
function fieldText(labelTxt, obj, key, opts){
  opts = opts || {};
  var wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},[text(labelTxt)]));
  var input = el('input',{type: opts.type || 'text', value: obj[key] || ''});
  if (opts.placeholder) input.setAttribute('placeholder', opts.placeholder);
  input.addEventListener('input', function(){ obj[key] = input.value; scheduleAutosave(); refreshSidebarOnly(); });
  wrap.appendChild(input);
  return wrap;
}
function fieldYesNo(labelTxt, obj, key){
  var wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},[text(labelTxt)]));
  var yn = el('div',{class:'yn'});
  ['ano','ne'].forEach(function(v){
    var id = 'yn-'+key+'-'+v+'-'+Math.random().toString(36).slice(2,7);
    var label = el('label',{});
    var radio = el('input',{type:'radio', name:'yn-'+key, id:id, checked: obj[key]===v});
    radio.addEventListener('change', function(){ obj[key]=v; scheduleAutosave(); });
    label.appendChild(radio);
    label.appendChild(text(v==='ano' ? 'Ano' : 'Ne'));
    yn.appendChild(label);
  });
  wrap.appendChild(yn);
  return wrap;
}
// Vlastní / Externí toggle — re-renders the whole page on change so that the
// conditional "dodavatel" field can appear/disappear immediately.
function fieldOwnExternal(labelTxt, obj, key){
  var wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},[text(labelTxt)]));
  var yn = el('div',{class:'yn'});
  [['vlastni','Vlastní'],['externi','Externí']].forEach(function(pair){
    var v = pair[0], lbl = pair[1];
    var id = 'oe-'+key+'-'+v+'-'+Math.random().toString(36).slice(2,7);
    var label = el('label',{});
    var radio = el('input',{type:'radio', name:'oe-'+key, id:id, checked: obj[key]===v});
    radio.addEventListener('change', function(){ obj[key]=v; scheduleAutosave(); renderAll(); });
    label.appendChild(radio);
    label.appendChild(text(lbl));
    yn.appendChild(label);
  });
  wrap.appendChild(yn);
  return wrap;
}

// 12 / 36 month certificate-validity toggle — re-renders so "Termín příští
// certifikace" recalculates immediately.
function fieldValidityMonths(labelTxt, obj, key){
  var wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},[text(labelTxt)]));
  var yn = el('div',{class:'yn'});
  ['12','36'].forEach(function(v){
    var id = 'pm-'+v+'-'+Math.random().toString(36).slice(2,7);
    var label = el('label',{});
    var radio = el('input',{type:'radio', name:'platnost-mesicu', id:id, checked: String(obj[key])===v});
    radio.addEventListener('change', function(){ obj[key]=v; scheduleAutosave(); renderAll(); });
    label.appendChild(radio);
    label.appendChild(text(v+' měsíců'));
    yn.appendChild(label);
  });
  wrap.appendChild(yn);
  return wrap;
}

/* ------- ARES lookup (auto-fill company data from IČO) ------- */// Transient UI status only — not persisted. prefix -> 'loading'|'success'|'error'|null
var aresStatus = {};

function formatPsc(psc){
  var s = String(psc||'').replace(/\D+/g,'');
  if (s.length === 5) return s.slice(0,3) + ' ' + s.slice(3);
  return s;
}
function buildUliceFromSidlo(sidlo){
  if (!sidlo) return '';
  var cislo = '';
  if (sidlo.cisloDomovni) cislo = String(sidlo.cisloDomovni);
  if (sidlo.cisloOrientacni) cislo += '/' + sidlo.cisloOrientacni;
  if (sidlo.nazevUlice) return (sidlo.nazevUlice + ' ' + cislo).trim();
  if (sidlo.nazevCastiObce) return (sidlo.nazevCastiObce + ' ' + cislo).trim();
  return (sidlo.nazevObce || '') + (cislo ? ' ' + cislo : '');
}

// Config-driven: {icoKey, nameKey, uliceKey, pscKey} — the state.meta keys to read/write.
async function lookupAres(cfg){
  var ico = String(state.meta[cfg.icoKey] || '').replace(/\s+/g,'');
  if (!/^\d{8}$/.test(ico)) return;
  aresStatus[cfg.statusKey] = 'loading';
  renderAll();
  try {
    var res = await fetch('https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/' + ico, {
      headers: {'Accept':'application/json'}
    });
    if (!res.ok) throw new Error('ARES HTTP ' + res.status);
    var data = await res.json();
    if (!data || (!data.obchodniJmeno && !data.sidlo)) throw new Error('Subjekt nenalezen');
    if (data.obchodniJmeno && cfg.nameKey) state.meta[cfg.nameKey] = data.obchodniJmeno;
    var ulice = buildUliceFromSidlo(data.sidlo);
    if (ulice && cfg.uliceKey) state.meta[cfg.uliceKey] = ulice;
    var pscMesto = [
      data.sidlo && data.sidlo.psc ? formatPsc(data.sidlo.psc) : '',
      data.sidlo && data.sidlo.nazevObce ? data.sidlo.nazevObce : ''
    ].filter(Boolean).join(' ');
    if (pscMesto && cfg.pscKey) state.meta[cfg.pscKey] = pscMesto;
    aresStatus[cfg.statusKey] = 'success';
    scheduleAutosave();
  } catch(err){
    console.error('ARES lookup failed', err);
    aresStatus[cfg.statusKey] = 'error';
  }
  renderAll();
}

// IČO field that auto-triggers an ARES lookup once 8 digits are entered
// (on blur, and immediately once the 8th digit is typed), with an inline
// status line and a manual fallback link to justice.cz.
// cfg: {icoKey, nameKey, uliceKey, pscKey, statusKey}
function fieldIcoLookup(labelTxt, obj, cfg){
  var wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},[text(labelTxt)]));
  var input = el('input',{type:'text', inputmode:'numeric', maxlength:8, value: obj[cfg.icoKey] || ''});
  input.addEventListener('input', function(){
    obj[cfg.icoKey] = input.value;
    scheduleAutosave();
    if (/^\d{8}$/.test(input.value.replace(/\s+/g,''))) lookupAres(cfg);
  });
  input.addEventListener('blur', function(){
    if (/^\d{8}$/.test(input.value.replace(/\s+/g,''))) lookupAres(cfg);
  });
  wrap.appendChild(input);

  var status = aresStatus[cfg.statusKey];
  if (status === 'loading'){
    wrap.appendChild(el('div',{style:'font-size:0.76rem; color:var(--steel); margin-top:4px;'},[text('Načítám údaje z ARES…')]));
  } else if (status === 'success'){
    wrap.appendChild(el('div',{style:'font-size:0.76rem; color:var(--good); margin-top:4px;'},[text('\u2713 Doplněno z ARES')]));
  } else if (status === 'error'){
    var errWrap = el('div',{style:'font-size:0.76rem; color:var(--bad); margin-top:4px;'});
    errWrap.appendChild(text('Nepodařilo se dohledat — vyplňte prosím ručně, nebo zkontrolujte na '));
    var link = el('a',{href:'https://or.justice.cz/ias/ui/rejstrik-$firma?ico='+encodeURIComponent((obj[cfg.icoKey]||'').replace(/\s+/g,'')), target:'_blank', rel:'noopener', style:'color:var(--bad); text-decoration:underline;'},[text('justice.cz')]);
    errWrap.appendChild(link);
    wrap.appendChild(errWrap);
  }
  return wrap;
}

// Renders one flat items array into grouped rows (group-title once per group
// change + criterionRow per item). Shared by the on-screen single list and
// the print two-column split below.
function buildGroupedRows(items, target){
  var lastGroup = null;
  items.forEach(function(it){
    if (it.group !== lastGroup){
      target.appendChild(el('div',{class:'group-title'},[text(it.group)]));
      lastGroup = it.group;
    }
    target.appendChild(criterionRow(it));
  });
}

// Splits an items array into two halves at the group boundary closest to the
// midpoint, so a group's rows never get torn apart mid-list. Used only for
// the print layout — CSS column-count doesn't rebalance reliably once a
// list spans more than one printed page (Chromium leaves later pages with
// an empty second column), so we pre-split explicitly instead.
// Rough printed-height estimate for one criterion row, in arbitrary "lines"
// units: the description wraps at ~40 chars per line at the compact print
// column width, plus a little fixed padding overhead per row.
function estimateRowWeight(it){
  var text = it.desc || it.group || '';
  var lines = Math.max(1, Math.ceil(text.length / 40));
  return lines + 0.5;
}
function estimateGroupWeight(groupItems){
  // +0.9 for the group-title heading itself
  return 0.9 + groupItems.reduce(function(sum, it){ return sum + estimateRowWeight(it); }, 0);
}

// Splits items into two columns balanced by estimated rendered height
// (not raw item count) so columns stay even even when one half's rows wrap
// onto more lines than the other's — greedy: walk whole groups in order,
// always adding the next group to whichever column currently weighs less.
// Splits items into two columns balanced by estimated rendered height (not
// raw item count), walking items in order and always adding the next one to
// whichever column currently weighs less. A multi-item group's rows usually
// stay together this way (the running total rarely tips mid-group), but a
// long trailing group (e.g. "Ochranné pomůcky") can end up split across
// both columns — which is desirable there, since it fills the page instead
// of leaving one column empty. The group-title heading simply repeats at
// the top of whichever column the group continues in.
function splitItemsForColumns(items){
  if (items.length < 4) return [items, []];
  var left = [], right = [], leftW = 0, rightW = 0;
  items.forEach(function(it){
    var w = estimateRowWeight(it);
    if (leftW <= rightW){ left.push(it); leftW += w; }
    else { right.push(it); rightW += w; }
  });
  return [left, right];
}

// Builds both the on-screen single-column card and a print-only two-column
// version (real side-by-side floated blocks, not CSS multicol) and appends
// both to the container — CSS shows only the right one per medium.
// Manual placement override for print: "svářečské rukavice" and "prachový
// respirátor" (Karosárna → Osobní ochranné pomůcky) always go in the right
// column, directly under "respirátor s aktivním uhlím", regardless of what
// the automatic height-balancer would otherwise pick.
function applyManualColumnOverrides(halves){
  var left = halves[0], right = halves[1];
  var targetDescs = ['svářečské rukavice', 'prachový respirátor'];
  var moved = [];
  var newLeft = left.filter(function(it){
    if (targetDescs.indexOf(it.desc) !== -1){ moved.push(it); return false; }
    return true;
  });
  if (!moved.length) return halves;
  moved.sort(function(a, b){ return targetDescs.indexOf(a.desc) - targetDescs.indexOf(b.desc); });
  var anchorIdx = -1;
  for (var i = 0; i < right.length; i++){
    if (right[i].desc === 'respirátor s aktivním uhlím'){ anchorIdx = i; break; }
  }
  var newRight = anchorIdx === -1
    ? right.concat(moved)
    : right.slice(0, anchorIdx + 1).concat(moved, right.slice(anchorIdx + 1));
  return [newLeft, newRight];
}

function appendItemsCard(container, items){
  var screenCard = el('div',{class:'card items-card-screen', style:'margin-top:18px'});
  buildGroupedRows(items, screenCard);
  container.appendChild(screenCard);

  var printCard = el('div',{class:'card items-card-print', style:'margin-top:18px'});
  var cols = el('div',{class:'print-cols'});
  var halves = applyManualColumnOverrides(splitItemsForColumns(items));
  var colL = el('div',{class:'print-col'});
  buildGroupedRows(halves[0], colL);
  var colR = el('div',{class:'print-col'});
  buildGroupedRows(halves[1], colR);
  cols.appendChild(colL);
  cols.appendChild(colR);
  printCard.appendChild(cols);
  container.appendChild(printCard);
}

function criterionRow(it){
  var row = el('div',{class:'item-row'});

    state.checks[it.id] = input.checked;
    scheduleAutosave();

  chk.appendChild(input);
  chk.appendChild(el('span',{class:'box'}));
  row.appendChild(chk);

  var labelWrap = el('label',{for:cbId, class:'item-text', style:'cursor:pointer'});
  if (it.desc){

  } else {
    labelWrap.appendChild(el('span',{class:'same-name'},[text(it.group)]));

  row.appendChild(photoButton(it.id));

  row.appendChild(el('span',{class:'lvl-badge l'+it.level},[text('Úroveň '+it.level)]));
  return row;
}

/* ------- Výsledky ------- */
function todayIso(){
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+mm+'-'+dd;
}

function addMonths(dateStr, months){
  if (!dateStr) return null;
  var d = new Date(dateStr+'T00:00:00');
  if (isNaN(d.getTime())) return null;
  d.setMonth(d.getMonth()+months);
  return d;
}

  if (!d) return '—';
  var dd = String(d.getDate()).padStart(2,'0');

}

// Manual freehand signing is disabled — the signature box only ever shows
// either the stored image (old hand-drawn signatures from previously saved
// audits, kept for backward compatibility) or the "digitally signed" text
// stamp produced by the button above it.
function setupSignature(canvas, key, clearBtn, signBtn){
  var ctx = canvas.getContext('2d');
  function redrawStored(){
    var ratio = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(ratio, ratio);
    ctx.clearRect(0,0,rect.width,rect.height);
    if (state.sig[key]){
      var img = new Image();
      img.onload = function(){ ctx.clearRect(0,0,rect.width,rect.height); ctx.drawImage(img, 0, 0, rect.width, rect.height); };
      img.src = state.sig[key];
    }
  }
  redrawStored();

  signBtn.addEventListener('click', function(){
    var jmeno = key === 'auditor' ? (state.kontakty.auditorJmeno||'').trim() : (state.kontakty.odpovednaJmeno||'').trim();
    if (!jmeno){
      alert(key === 'auditor' ? 'Nejprve vyberte nebo zadejte jméno auditora.' : 'Nejprve zadejte jméno a příjmení odpovědné osoby.');
      return;
    }
    var datumTxt = state.meta.datumAuditu ? formatDate(new Date(state.meta.datumAuditu+'T00:00:00')) : '—';
    var rect = canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.fillStyle = '#0F2C46';
    ctx.textBaseline = 'middle';
    ctx.font = '600 15px Arial, sans-serif';
    ctx.fillText('Digitálně podepsáno dne ' + datumTxt, 14, rect.height/2 - 12);
    ctx.font = '400 14px Arial, sans-serif';
    ctx.fillText(jmeno, 14, rect.height/2 + 12);
    state.sig[key] = canvas.toDataURL('image/png');
    scheduleAutosave();
  });

  clearBtn.addEventListener('click', function(){
    var rect = canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    state.sig[key] = null;
    scheduleAutosave();
  });
}

/* ---------------- SharePoint "Databáze" hand-off ----------------
   A static offline HTML file cannot read or write another organisation's
   SharePoint directly — that needs a signed-in Microsoft session (OAuth /
   Azure AD app registration), which this file has no way to obtain safely.
   Instead we get as close to one-click as the browser allows:
     - Uložit koncept: downloads a correctly named .json snapshot AND opens
       the SharePoint folder in a new tab, ready to drag the file into.
     - Načíst existující: opens the same folder so the file can be
       downloaded, then opens a file picker to load it straight back in.
*/
var SHAREPOINT_FOLDER_URL = 'https://interactioncz.sharepoint.com/:f:/s/public/IgBQLrI53h44RI_Bqj6B7ZuRAWmRuBLCEMLeFg8rW3Mik4M?e=V3MYBx';

function draftFileName(){
  var namePart = state.meta.partner ? slugify(state.meta.partner) : 'koncept';
  return namePart + '_' + todayIso() + '.json';
}

function downloadDraftFile(){
  var fname = draftFileName();
  var blob = new Blob([serializeState()], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);

/* ---------------- Local synced-folder access (File System Access API) ----------------
   Lets Uložit koncept / Načíst existující talk directly to a local folder
   (e.g. the OneDrive-synced "Databáze" SharePoint folder) with no
   download/upload dance and no server — OneDrive's own sync then carries
   the file to SharePoint in the background.
   Requires a secure context (https:// or localhost) and a browser that
   supports the API (Chrome/Edge); everywhere else this quietly falls back
   to the previous download-and-open-SharePoint-tab flow.
*/
// Some mobile browsers (notably Chrome on Android) technically expose
// showDirectoryPicker(), but it opens the OS's plain folder/document
// picker — which on phones/tablets usually only lists local storage and
// Google Drive, NOT the OneDrive app (OneDrive doesn't register itself
// there the way desktop OneDrive mounts a real synced folder). So on a
// phone or tablet this API looks "supported" but can't actually reach the
// OneDrive "Databáze" folder — we treat those devices as unsupported and
// route them through the share-sheet / native-file-chooser flow below,
// which does reliably reach the OneDrive app.
var IS_MOBILE_OR_TABLET = /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
var FS_ACCESS_SUPPORTED = !IS_MOBILE_OR_TABLET && (typeof window.showDirectoryPicker === 'function') && !!window.isSecureContext;
var folderHandle = null;

function idbOpen(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open('arval-audit-fs', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('handles'); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbSet(key, value){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction('handles', 'readonly');
      var req = tx.objectStore('handles').get(key);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}

async function ensureFolderPermission(handle){
  var opts = {mode:'readwrite'};
  try{
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if ((await handle.requestPermission(opts)) === 'granted') return true;
  }catch(err){ console.error('Permission check failed', err); }
  return false;
}

function updateFolderStatus(){
  var elStatus = document.getElementById('folderStatus');
  if (!elStatus) return;
  elStatus.innerHTML = '';
  if (folderHandle){
    elStatus.appendChild(document.createTextNode('\u25CF Složka: ' + folderHandle.name + ' '));
    var change = document.createElement('button');
    change.type = 'button';
    change.textContent = '(změnit)';
    change.addEventListener('click', function(){ connectFolder().catch(function(){}); });
    elStatus.appendChild(change);
  }
}

async function connectFolder(){
  var handle = await window.showDirectoryPicker({id:'arval-databaze', mode:'readwrite'});
  folderHandle = handle;
  try{ await idbSet('databaze', handle); }
  catch(err){ console.error('Could not remember folder for next time', err); }
  updateFolderStatus();
  return handle;
}

// promptIfMissing=false: only restore a previously granted folder silently
// (used on page load). promptIfMissing=true: open the picker if needed.
async function getFolderHandle(promptIfMissing){
  if (folderHandle && await ensureFolderPermission(folderHandle)) return folderHandle;
  folderHandle = null;
  try{
    var stored = await idbGet('databaze');
    if (stored && await ensureFolderPermission(stored)){
      folderHandle = stored;
      updateFolderStatus();
      return folderHandle;
    }
  }catch(err){ console.error('Restoring folder handle failed', err); }
  if (!promptIfMissing) return null;
  return connectFolder();
}

async function saveDraftToFolder(){
  if (!FS_ACCESS_SUPPORTED){
    // Mobile / iPad browsers can't write straight into a synced folder like
    // desktop Chrome/Edge does, so the closest equivalent is the native
    // share sheet: it lets the person pick the OneDrive app directly and
    // save the file straight into the same "Databáze" folder as on the PC,
    // without a manual download-then-drag-and-drop step.
    var fname = draftFileName();
    var blob = new Blob([serializeState()], {type:'application/json'});
    var sharedOk = false, shareErr = '';
    if (navigator.share && navigator.canShare){
      try{
        // Chrome on Android only lets web pages share a short allow-list of
        // file types (images, pdf, text...) and application/json is NOT on it,
        // so canShare() says no for a plain .json file. Try the real type
        // first, then fall back to text/plain (still valid JSON inside),
        // finally to a ".json.txt" name which Chrome always accepts.
        var shareCandidates = [
          {name: fname, type: 'application/json'},
          {name: fname, type: 'text/plain'},
          {name: fname + '.txt', type: 'text/plain'}
        ];
        for (var ci = 0; ci < shareCandidates.length && !sharedOk; ci++){
          var cand = shareCandidates[ci];
          var shareFile = new File([blob], cand.name, {type: cand.type});
          var canIt = false;
          try{ canIt = navigator.canShare({files:[shareFile]}); }catch(e){ canIt = false; }
          if (canIt){
            await navigator.share({files:[shareFile], title: cand.name});
            fname = cand.name;
            sharedOk = true;
          }
        }
      }catch(err){
        if (err && err.name === 'AbortError'){ return; } // user cancelled the share sheet
        shareErr = (err && (err.name + ': ' + err.message)) || String(err);
        console.error('Web Share save failed, falling back to download', err);
      }
    }
    saveDraft(true);
    if (sharedOk){
      if (saveNoteEl){
        saveNoteEl.textContent = 'Předáno k uložení: ' + fname + ' — vyberte OneDrive a složku „Databáze"';
        setTimeout(function(){ saveNoteEl.textContent = ''; }, 6000);
      }
      return;
    }
    // Fallback for browsers with neither API (e.g. some desktop browsers
    // without File System Access and without file-sharing support).
    downloadDraftFile();
    var why = shareErr ? ('chyba sdílení: ' + shareErr) : !window.isSecureContext ? 'stránka není otevřená přes https' :
              !navigator.share ? 'prohlížeč nepodporuje sdílení' :
              !navigator.canShare ? 'prohlížeč nepodporuje sdílení souborů' :
              'prohlížeč odmítl sdílet soubor tohoto typu';
    why += ' [adresa: ' + location.protocol + '//' + (location.host || '-') + ']';
    alert('Soubor „' + fname + '“ se stáhl do telefonu (Stažené), protože přímé uložení do OneDrivu v tomto prohlížeči nejde (' + why + ').\n\n' +
      'Po stisknutí OK se otevře složka Databáze. Klepněte na „+“ → „Nahrát“ → „Soubory“ a vyberte tento soubor ze Stažených.');
    window.open(SHAREPOINT_FOLDER_URL, '_blank', 'noopener');
    if (saveNoteEl){
      saveNoteEl.textContent = 'Staženo ' + fname + ' — nahrajte jej do otevřené složky (+ → Nahrát)';
      setTimeout(function(){ saveNoteEl.textContent = ''; }, 8000);
    }
    return;
  }
  try{
    var handle = await getFolderHandle(true);
    if (!handle) return; // user cancelled the folder picker
    var slug = state.meta.partner ? slugify(state.meta.partner) : 'koncept';
    var matches = await findExistingDraftFiles(handle, slug);
    var fname;
    if (matches.length){
      var choice = await resolveSaveConflict(matches);
      if (!choice) return; // user cancelled the conflict dialog
      fname = (choice === 'new') ? uniqueDraftFileName(matches) : choice;
    } else {
      fname = draftFileName();
    }
    var fileHandle = await handle.getFileHandle(fname, {create:true});
    var writable = await fileHandle.createWritable();
    await writable.write(serializeState());
    await writable.close();
    saveDraft(true);
    if (saveNoteEl){
      saveNoteEl.textContent = 'Uloženo do složky: ' + fname + ' \u2713';
      setTimeout(function(){ saveNoteEl.textContent = ''; }, 4000);
    }
  }catch(err){
    if (err && err.name === 'AbortError') return; // user cancelled a picker
    console.error('Folder save failed', err);
    alert('Uložení do složky se nezdařilo. Zkuste to prosím znovu, případně zvolte složku znovu tlačítkem „(změnit)".');
  }
}

// Looks for .json files already in the folder whose name starts with the
// same customer-name slug as the concept about to be saved (e.g. "autobarta_...json"
// for partner "Auto Bárta s.r.o."), so the person can be asked before saving
// whether to create a new file or overwrite one of these.
async function findExistingDraftFiles(handle, slug){
  var files = [];
  try{
    for await (var entry of handle.values()){
      if (entry.kind === 'file' && /\.json(\.txt)?$/i.test(entry.name) &&
          entry.name.toLowerCase().indexOf(slug.toLowerCase() + '_') === 0){
        var file = await entry.getFile();
        files.push({ name: entry.name, lastModified: file.lastModified });
      }
    }
  }catch(err){ console.error('Could not check for existing drafts with the same name', err); }
  return files;
}

// Builds a filename guaranteed not to collide with any existing match
// (handles the case where a concept for the same customer was already
// saved today, so the plain date-based name would otherwise overwrite it).
function uniqueDraftFileName(existingMatches){
  var base = draftFileName();
  var names = existingMatches.map(function(f){ return f.name; });
  if (names.indexOf(base) === -1) return base;
  var stem = base.replace(/\.json$/i, '');
  var n = 2, candidate;
  do{
    candidate = stem + '_' + n + '.json';
    n++;
  } while(names.indexOf(candidate) !== -1);
  return candidate;
}

// Shows the "koncept už existuje" modal and resolves with:
//   'new'        - person chose to save as a brand new concept
//   <filename>   - person chose to overwrite that specific existing file
//   null         - person cancelled (close/Zrušit/click outside)
function resolveSaveConflict(matches){
  return new Promise(function(resolve){
    var overlay = document.getElementById('saveConflictOverlay');
    var textEl = document.getElementById('saveConflictText');
    var listEl = document.getElementById('saveConflictMatches');
    var btnNew = document.getElementById('saveConflictAsNew');
    var btnCancel = document.getElementById('saveConflictCancel');
    var btnClose = document.getElementById('saveConflictClose');
    var partnerName = state.meta.partner || 'tohoto zákazníka';

    textEl.textContent = 'Pro zákazníka „' + partnerName + '“ je ve složce už uložený koncept. Chcete uložit jako nový koncept, nebo přepsat některý ze stávajících?';
    listEl.innerHTML = '';
    matches.slice().sort(function(a, b){ return b.lastModified - a.lastModified; }).forEach(function(f){
      var item = el('button', {type:'button', class:'modal-item'}, [
        el('span', {class:'modal-item-name'}, [text('Přepsat: ' + f.name)]),
        el('span', {class:'modal-item-date'}, [text(formatDate(new Date(f.lastModified)))])
      ]);
      item.addEventListener('click', function(){ finish(f.name); });
      listEl.appendChild(item);
    });

    function finish(result){
      overlay.hidden = true;
      cleanup();
      resolve(result);
    }
    function onAsNew(){ finish('new'); }
    function onCancel(){ finish(null); }
    function onOverlayClick(e){ if (e.target.id === 'saveConflictOverlay') onCancel(); }
    function cleanup(){
      btnNew.removeEventListener('click', onAsNew);
      btnCancel.removeEventListener('click', onCancel);
      btnClose.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlayClick);
    }
    btnNew.addEventListener('click', onAsNew);
    btnCancel.addEventListener('click', onCancel);
    btnClose.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlayClick);
    overlay.hidden = false;
  });
}

async function openLoadModal(){
  if (!FS_ACCESS_SUPPORTED){
    // Mobile / iPad browsers don't support the File System Access folder
    // link used on desktop (Chrome/Edge), so there is no live "same folder"
    // connection possible there. The closest equivalent is the native
    // OS file picker, which on iOS/Android lets the person browse straight
    // into their OneDrive app (same account, same "Databáze" folder as on
    // the PC) and pick the file from there instead of a local download.
    document.getElementById('loadFileInput').click();
    return;
  }
  var handle;
  try{
    handle = await getFolderHandle(true);
  }catch(err){
    if (err && err.name === 'AbortError') return;
    console.error('Folder connect failed', err);
    alert('Propojení se složkou se nezdařilo.');
    return;
  }
  if (!handle) return;

  var files = [];
  try{
    for await (var entry of handle.values()){
      if (entry.kind === 'file' && /\.json(\.txt)?$/i.test(entry.name)){
        var file = await entry.getFile();
        files.push({ name: entry.name, entryHandle: entry, lastModified: file.lastModified });
      }
    }
  }catch(err){
    console.error('Folder listing failed', err);
    alert('Nepodařilo se načíst obsah složky.');
    return;
  }
  files.sort(function(a, b){ return b.lastModified - a.lastModified; });
  renderFolderPicker(files);
}

function renderFolderPicker(files){
  var listEl = document.getElementById('folderPickerList');
  listEl.innerHTML = '';
  if (!files.length){
    listEl.appendChild(el('div', {class:'modal-empty'}, [text('Ve složce zatím nejsou žádné uložené koncepty (.json).')]));
  } else {
    files.forEach(function(f){
      var item = el('button', {type:'button', class:'modal-item'}, [
        el('span', {class:'modal-item-name'}, [text(f.name)]),
        el('span', {class:'modal-item-date'}, [text(formatDate(new Date(f.lastModified)))])
      ]);
      item.addEventListener('click', function(){ loadFileFromFolder(f.entryHandle, f.name); });
      listEl.appendChild(item);
    });
  }
  document.getElementById('folderPickerOverlay').hidden = false;
}
function closeFolderPicker(){
  document.getElementById('folderPickerOverlay').hidden = true;
}

async function loadFileFromFolder(entryHandle, fname){
  try{
    var file = await entryHandle.getFile();
    var text = await file.text();
    var loaded = JSON.parse(text);
    if (!loaded || typeof loaded !== 'object' || (!loaded.meta && !loaded.checks)){
      alert('Tento soubor nevypadá jako koncept z tohoto formuláře.');
      return;
    }
    applyLoadedState(loaded);
    renderAll();
    saveDraft(true);
    closeFolderPicker();
    if (saveNoteEl){
      saveNoteEl.textContent = 'Načteno: ' + fname + ' \u2713';
      setTimeout(function(){ saveNoteEl.textContent = ''; }, 3000);
    }
  }catch(err){
    console.error('Load from folder failed', err);
    alert('Soubor se nepodařilo načíst.');
  }
}

/* ---------------- Export + e-mail (Outlook) ----------------
   Browsers do not let a web page attach a file to an email draft for
   security reasons — only a mailto: link's to/subject/body can be set
   programmatically, never an attachment. So this does the closest thing
   possible: it opens the same print dialog as "Exportovat do PDF" (where
   the person saves the PDF, e.g. "Save as PDF" / tiskne do souboru), and
   right after that it opens a prefilled e-mail in the person's default
   mail app (Outlook, if set as default) with subject/body ready — the
   person just needs to drag/attach the PDF they just saved.
*/
function emailSubjectAndBody(){
  var partner = state.meta.partner || 'partnera';
  var subject = 'ARVAL certifikační audit — ' + (state.meta.partner || 'koncept') + (state.meta.datumAuditu ? ' — ' + state.meta.datumAuditu : '');
  var body = 'Dobrý den,\n\nv příloze zasílám certifikační audit pro ' + partner + '.\n' +
    '(Před odesláním prosím přiložte PDF, které se právě uložilo z tlačítka „Export a e-mail".)\n\nS pozdravem';
  return { subject: subject, body: body };
}
document.getElementById('btnEmailExport').addEventListener('click', function(){
  window.print();
  var sb = emailSubjectAndBody();
  var mailtoUrl = 'mailto:?subject=' + encodeURIComponent(sb.subject) + '&body=' + encodeURIComponent(sb.body);
  window.location.href = mailtoUrl;
});

/* ---------------- Chybějící vybavení (missing-items export) ---------------- */
function pluralKriterii(n){
  if (n === 1) return 'kritérium';
  if (n >= 2 && n <= 4) return 'kritéria';
  return 'kritérií';
}

// Grouped by section in nav order; each category's own items plus the shared
// Náhradní vozidla criteria as their own section (not duplicated per department).
function getMissingByCategory(){
  var sections = [];
  var nahradniMissing = NAHRADNI.items.filter(function(it){ return !state.checks[it.id]; });
  sections.push({ title: 'Náhradní vozidla (společné)', items: sortByLevel(nahradniMissing) });
  CATEGORIES.forEach(function(cat){
    var missing = cat.items.filter(function(it){ return !state.checks[it.id]; });
    sections.push({ title: cat.title, items: sortByLevel(missing) });
  });
  return sections;
}

// Level 1 missing items first, then level 2, then level 3 — items at the
// same level keep their original relative (group) order (stable sort).
function sortByLevel(items){
  return items.slice().sort(function(a, b){ return a.level - b.level; });
}

function missingReportTitle(){
  var t = 'Nesplněná kritéria - ARVAL certifikační audit';
  if (state.meta.partner) t += ' — ' + state.meta.partner;
  return t;
}

function buildMissingReportDom(){
  var root = document.getElementById('missing-report');
  root.innerHTML = '';
  root.appendChild(el('div',{class:'mr-title'},[text(missingReportTitle())]));
  root.appendChild(el('div',{class:'mr-sub'},[text('Vygenerováno ' + formatDate(new Date()) + ' — přehled nesplněných kritérií podle oddílu a úrovně (úroveň 1 → 3)')]));

  var sections = getMissingByCategory();
  var anyMissing = sections.some(function(s){ return s.items.length > 0; });
  if (!anyMissing){
    root.appendChild(el('div',{class:'card'},[el('div',{class:'mr-empty'},[text('Všechna kritéria ve všech oddílech jsou splněná — nechybí žádné vybavení.')])]));
    return;
  }
  sections.forEach(function(sec){
    if (!sec.items.length) return;
    var card = el('div',{class:'card'});
    card.appendChild(el('h3',{},[text(sec.title + ' — chybí ' + sec.items.length + ' ' + pluralKriterii(sec.items.length))]));
    var lastGroup = null;
    sec.items.forEach(function(it){
      if (it.group !== lastGroup){
        card.appendChild(el('div',{class:'group-title'},[text(it.group)]));
        lastGroup = it.group;
      }
      card.appendChild(criterionRow(it));
    });
    root.appendChild(card);
  });
}

function exportMissingPdf(){
  buildMissingReportDom();
  document.body.classList.add('exporting-missing');
  var prevTitle = document.title;
  document.title = missingReportTitle() + (state.meta.datumAuditu ? ' ' + state.meta.datumAuditu : '');
  var cleaned = false;
  function cleanup(){
    if (cleaned) return;
    cleaned = true;
    document.body.classList.remove('exporting-missing');
    document.title = prevTitle;
    window.removeEventListener('afterprint', cleanup);
  }
  window.addEventListener('afterprint', cleanup);
  setTimeout(function(){ window.print(); }, 50);
  setTimeout(cleanup, 15000); // safety net if 'afterprint' never fires
}

function csvEscape(val){
  val = String(val === null || val === undefined ? '' : val);
  if (/[;"\n\r]/.test(val)) val = '"' + val.replace(/"/g,'""') + '"';
  return val;
}
function slugify(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
}

function exportMissingCsv(){
  var sections = getMissingByCategory();
  var rows = [[missingReportTitle()], ['Oddíl','Skupina','Kritérium','Úroveň']];
  sections.forEach(function(sec){
    sec.items.forEach(function(it){
      rows.push([sec.title, it.group, it.desc || it.group, 'Úroveň ' + it.level]);
    });
  });
  if (rows.length === 2){
    rows.push(['Všechna kritéria splněna','','','']);
  }
  var csv = rows.map(function(r){ return r.map(csvEscape).join(';'); }).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var fname = 'chybejici_vybaveni_arval_certifikacni_audit' + (state.meta.partner ? '_' + slugify(state.meta.partner) : '') + '.csv';
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
