<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Standard karosárny – Škoda Auto</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d70c19;--ink:#1b1e23;--ink2:#2b3038;--muted:#5d6570;--line:#e3e6ea;--soft:#f5f6f8;--bg:#eef0f3}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:86px}
body{margin:0;font-family:"Open Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:Poppins,sans-serif}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 22px;background:var(--ink);color:#fff;border-bottom:3px solid var(--red)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.ia-home-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;flex:0 0 auto}
.logo{background:#fff;border-radius:8px;padding:7px 10px;display:flex}
.logo img{height:18px}
.brand h1{margin:0;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:400 .75rem "Open Sans",sans-serif;opacity:.75}
.actions{display:flex;align-items:center;gap:8px}
.actions input{width:250px;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:.9rem}
.btn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:8px;padding:8px 12px;font:600 .85rem "Open Sans",sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.solid{background:var(--red);border-color:var(--red)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:26px;max-width:1320px;margin:0 auto;padding:24px 22px 60px}
nav.toc{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:#fff;border-radius:14px;padding:14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
nav.toc .h{font:600 .72rem Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
nav.toc a{display:flex;gap:9px;align-items:baseline;padding:6px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:.86rem}
nav.toc a:hover,nav.toc a.active{background:var(--soft);color:var(--red)}
nav.toc a .no{font:700 .75rem Poppins,sans-serif;color:var(--red);min-width:22px}
nav.toc .sep{height:1px;background:var(--line);margin:8px 10px}
.hero{background:linear-gradient(120deg,#1b1e23 0%,#2b3038 60%,#3a1418 100%);color:#fff;border-radius:18px;padding:30px 32px;position:relative;overflow:hidden;margin-bottom:22px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(215,12,25,.55),transparent 70%)}
.hero .tag{display:inline-block;background:var(--red);border-radius:999px;padding:3px 12px;font:600 .75rem "Open Sans",sans-serif;letter-spacing:.04em}
.hero h2{margin:12px 0 4px;font-size:1.8rem}
.hero p{margin:0;opacity:.85}
.hero .meta{margin-top:14px;font-size:.85rem;opacity:.75}
.notice{display:flex;gap:12px;align-items:flex-start;background:#fff;border-left:4px solid var(--red);border-radius:10px;padding:12px 16px;margin-bottom:22px;font-size:.9rem;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:20px;overflow:hidden}
.card>.inner{padding:20px 24px}
.card h3.t{margin:0 0 12px;font-size:1.15rem}
details.chap>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 24px;border-bottom:1px solid transparent}
details.chap[open]>summary{border-bottom-color:var(--line)}
details.chap>summary::-webkit-details-marker{display:none}
.chno{width:48px;height:48px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 1.05rem Poppins,sans-serif}
.chno.app{background:var(--red);font-size:.9rem}
.chhead h3{margin:0;font-size:1.12rem}
.chhead .src{font-size:.78rem;color:var(--muted)}
.chhead .lead{font-size:.88rem;color:var(--ink2);margin-top:3px}
.chcount{font:600 .78rem "Open Sans",sans-serif;color:var(--muted);text-align:right;white-space:nowrap}
.chcount::after{content:"▾";display:block;font-size:1rem;color:var(--red);transition:transform .2s}
details.chap[open] .chcount::after{transform:rotate(180deg)}
.req{display:grid;grid-template-columns:96px minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:12px 24px;border-top:1px solid var(--line);font-size:.9rem}
.req:first-child{border-top:0}
.req:nth-child(even){background:#fbfbfc}
.code{font:700 .78rem Poppins,sans-serif;color:var(--red);background:#fdecee;border-radius:7px;padding:4px 8px;align-self:start;text-align:center}
.req .need{font-weight:600;color:var(--ink)}
.req .det{color:var(--ink2)}
.req .det.ok{color:var(--muted);font-style:italic}
.reqhead{display:grid;grid-template-columns:96px minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:10px 24px;background:var(--soft);font:600 .72rem Poppins,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prep{padding:14px 24px 18px;background:var(--soft);border-top:1px solid var(--line)}
.prep .h{font:600 .8rem Poppins,sans-serif;color:var(--ink2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-size:.82rem}
.chip::before{content:"☐ ";color:var(--red)}
.callout{margin:14px 24px;background:#fff8e6;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;font-size:.87rem;color:#4a3a06}
.callout b{color:#3b2e00}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;background:var(--ink);color:#fff;font:600 .78rem Poppins,sans-serif;padding:9px 12px}
table.t td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.t tr:nth-child(even) td{background:#fbfbfc}
.tblwrap{padding:14px 24px}
.ess{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ess div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.86rem}
.ess b{display:block;font-family:Poppins;color:var(--red);margin-bottom:3px}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.legend div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.84rem}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.step{background:var(--soft);border-radius:12px;padding:12px;font-size:.84rem;position:relative}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font:700 .85rem Poppins,sans-serif;margin-bottom:6px}
.step b{display:block;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.87rem}
.box b{display:block;font-family:Poppins;margin-bottom:3px}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font:600 .74rem "Open Sans",sans-serif;white-space:nowrap}
.st.m{background:#fdecee;color:#a50a14}.st.s{background:#e7f0fb;color:#1d4f91}.st.c{background:#fff1d6;color:#8a5a00}.st.o{background:#eceff2;color:#4b535c}.st.t{background:#e8f6ee;color:#1d7a45}
.reggrp{margin-bottom:14px}
.reggrp h4{margin:14px 0 6px;font:600 .92rem Poppins,sans-serif}
.hidden{display:none!important}
mark{background:#ffe08a;padding:0 1px;border-radius:2px}
#noHits{display:none;background:#fff;border-radius:12px;padding:16px 20px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}nav.toc{display:none}.steps{grid-template-columns:1fr 1fr}.ess{grid-template-columns:1fr 1fr}.legend{grid-template-columns:1fr 1fr}.actions input{width:170px}}
@media(max-width:720px){.layout{grid-template-columns:minmax(0,1fr);padding:14px 12px 40px}.grid2,.ess,.legend,.steps{grid-template-columns:minmax(0,1fr)}.actions{gap:6px}.actions input{width:110px}.tblwrap{overflow-x:auto}details.chap>summary{padding:14px;gap:10px}.req{padding:10px 14px}.req,.reqhead{grid-template-columns:1fr}.reqhead{display:none}.brand small{display:none}.actions .btn.opt{display:none}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10pt}
  .topbar,nav.toc,.no-print,#noHits{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .card,.hero,.notice{box-shadow:none;break-inside:auto}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  details.chap>summary{break-after:avoid}
  .req{break-inside:avoid}
  .chcount::after{display:none}
  .code,.chno,.st,table.t th,.step .n,.chip::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* --- Škoda / Porsche ČR --- */
.req .det{white-space:pre-line}
.req .det b.br{color:var(--red)}
.vsw{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vsw button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font:600 .86rem "Open Sans",sans-serif;cursor:pointer;color:var(--ink2);text-align:left}
.vsw button small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.vsw button.on{border-color:var(--red);background:#fdecee;color:#a50a14}
.eq{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding:11px 24px;border-top:1px solid var(--line);font-size:.9rem;align-items:start}
.eq:nth-child(even){background:#fbfbfc}
.eq .nm{font-weight:600}
.eq .badges{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.vas{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.vas span{font:600 .72rem "Open Sans",sans-serif;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink2)}
.st.ko{background:#a50a14;color:#fff}
details.spec{margin-top:7px;background:#f4f7fb;border:1px solid #dbe4ef;border-radius:10px;font-size:.85rem}
details.spec>summary{cursor:pointer;padding:6px 10px;font-weight:600;color:#1d4f91}
details.spec .sb{padding:2px 12px 10px}
details.spec .sb b{display:block;margin-top:6px}
details.spec ul{margin:3px 0 0;padding-left:18px}
.grp{padding:10px 24px;background:var(--soft);border-top:1px solid var(--line);font:600 .86rem Poppins,sans-serif;color:var(--ink2)}
.grp .gs{margin-top:6px}
.filt{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px;border-top:1px solid var(--line)}
.filt button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:600 .8rem "Open Sans",sans-serif;cursor:pointer;color:var(--ink2)}
.filt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 24px;border-top:1px solid var(--line)}
.score div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.84rem}
.score b{display:block;font:700 1.25rem Poppins,sans-serif;color:var(--red)}
.varoff{display:none!important}
.note{padding:10px 24px;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:720px){.brand h1{display:none}.logo{flex:0 0 auto}.eq{grid-template-columns:40px minmax(0,1fr);padding:10px 14px;gap:8px}.eq .badges{grid-column:2;justify-content:flex-start}.grp,.filt,.note{padding-left:14px;padding-right:14px}.score{grid-template-columns:minmax(0,1fr);padding:12px 14px}}
@media print{.filt,.vsw{display:none!important}.eq{break-inside:avoid}details.spec{break-inside:avoid}.st.ko{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<script id="sk-data" type="application/json">{"checklists":{"SKL":{"title":"Seznam kontrolních otázek - S+K+L\n(pro servisní partnery, kteří disponují vlastní klempírnou a vlastní lakovnou)","sections":[{"title":"1. Pracoviště Servisního poradce pro příjem vozů po nehodách","items":[{"n":"1.1","q":"Je k dispozici označení pracoviště Servisního poradce pro příjem vozů po nehodách dle požadavků dodavatele?","ref":"Požadavky: povinné CI prvky\nŠA ČR:\n- Pylon na stůl\n- Jmenovka (na stole)\n\nPo ČR: \n- Sekundární značení *\n- Pylon na stůl *\n- Jmenovka (na stole)\n\n* Pokud bude v provozovně separátní pracoviště přijmu oprav vozidel po nehodách, musí být označeno Sekundárním značením, v opačném případě musí mít Pylon na stůl.\n\nPři prvním auditu toto kritérium není hodnoceno.\n\n\"Nesplněno\", není-li pracoviště označeno dle požadavků dodavatele."},{"n":"1.2","q":"Je pracoviště Servisního poradce pro příjem vozů po nehodách vybaveno dle požadavku dodavatele?","ref":"Požadavky:\n- PC s přístupem na internet, fotoaparát/tablet\n- ElsaPro, ETKA, DMS, Laková příručka (Audi)\n- katalog posuzování vad laku\n- reflexní deska (linková / mřížková / rastrová) pro identifikaci drobného poškození laku (důlky)\n\n\"Nesplněno\", není-li pracoviště kompletně vybaveno dle požadavků dodavatele."}]},{"title":"2. Personál a školení","items":[{"n":"2.1","q":"Je k dispozici organigram?","ref":"Požadavek:\n- nutné jmenovitě označit pracovníky klempírny, lakovny a Servisní poradce pro příjem vozů po nehodách.\n\n\"Nesplněno\", není-li k dispozici aktuální organigram."},{"n":"2.2","q":"Jsou vedeny osobní záznamy o vzdělávání jednotlivých Servisních poradců pro příjem vozů po nehodách, pracovníků v oblasti klempírny a lakovny a je na základě toho sestavován plán dalšího vzdělávání?","ref":"Požadavek:\n- plán dalšího vzdělávání, viz vzdělávací systém dodavatele\n- aktivní účast zaměstnanců na dodavatelem vypsaných školeních\n\n\"Nesplněno\", není-li k dispozici záznam pro jednotlivé pracovníky nebo zdokumentovaný plán dalšího vzdělávání."},{"n":"2.3","q":"Konají se v oblasti klempírny a lakovny pravidelně vnitropodniková školení/informativní setkání?","ref":"Požadavky:\nAktuální informace na základě:\n- novinek o produktu\n- dodání technických podkladů\n- obsahů školení a kurzů\n\n- přístup do lakové příručky (pro personál klempírny a lakovny)\n\nnapř. Protokol z porady, Záznam o interním školení\n\n\"Nesplněno\", není-li min. jedna tématická oblast kompletně zdokumentována (seznam účastníků, téma, datum, přístup do lakové příručky)."},{"n":"2.4","q":"Je stanoven servisní poradce pro vykonávání pozice pro příjem vozů po nehodách?","ref":"Požadavky: \n- ano, je stanoven (vztahuje se na všechny servisní poradce, kteří vykonávají příjem vozidel po nehodách)\n- nutně jmenovitě označit v organigramu\n\n\n\"Nesplněno\", není-li stanoven Servisní poradce pro příjem vozů po nehodách."},{"n":"2.5","q":"Odpovídá kvalifikace Servisního poradce pro příjem vozů po nehodách požadavkům dodavatele?","ref":"Požadavek: \n- osoba musí prokázat absolvování kvalifikačních cest vzdělání podle požadavků dodavatele\n\n\"Nesplněno\", není-li předložen certifikát/doklad o absolvovaném školení, případně závazná přihláška/po prvním roce není zahájeno školení."},{"n":"2.6","q":"Je počet kvalifikovaných klempířů dostatečný podle požadavků dodavatele?","ref":"Požadavek: \n\nPo ČR - min. 1\nŠA ČR - min. 1\n\n\"Nesplněno\", není-li počet kvalifikovaných klempířů dostatečný."},{"n":"2.7","q":"Odpovídá kvalifikace všech klempířů požadavkům dodavatele?","ref":"Požadavky: \n- osoba musí prokázat absolvování kvalifikačních cest vzdělání podle požadavků dodavatele\n- certifikát/přihláška\n- nejpozději do 3 měsíců od přiřazení profese/funkce zahájit kvalifikační cestu a max. do 24 měsíců projít kvalifikačním procesesem\n\"Nesplněno\", není-li předložen certifikát/doklad o absolvovaném školení, případně závazná přihláška/po prvním roce není zahájeno školení."},{"n":"2.8","q":"Je počet kvalifikovaných lakýrníků dostatečný podle požadavků dodavatele?","ref":"Požadavek: \n\nPo ČR - min. 1\nŠA ČR - min. 1\n\n\"Nesplněno\", není-li počet kvalifikovaných klempířů dostatečný."},{"n":"2.9","q":"Odpovídá kvalifikace všech lakýrníků požadavkům dodavatele?","ref":"Požadavky: \n- osoba musí prokázat absolvování kvalifikačních cest vzdělání podle požadavků dodavatele\n- certifikát/přihláška\n- nejpozději do 3 měsíců od přiřazení profese/funkce zahájit kvalifikační cestu a max. do 24 měsíců projít kvalifikačním procesesem\n\"Nesplněno\", není-li předložen Certifikát/doklad o absolvovaném školení, případně závazná přihláška/po prvním roce není zahájeno školení."}]},{"title":"3. Příjem do servisu","items":[{"n":"3.1","q":"Je zaveden a používán systém pro sjednávání termínů/denní dispozice?","ref":"Požadavky: \n- elektronický plánovací modul v DMS - CZ (v jiných systémech nutno zajistit obdobnou alternativu)\n- zpětná namátková kontrola (v DMS lze vidět neomezeně, změna barvy zakázky)\n\n\"Nesplněno\", není-li používán plánovací modul u vozidel, u kterých není sepsána zakázka."},{"n":"3.2","q":"Je pro každou opravu předložena písemná zakázka?","ref":"Požadavky:\nRozsah zakázky:\n- záhlaví zakázky (údaje o zákazníkovi a vozidle)\n- rozsah zakázky v jasném znění\n- předběžná cena, informovat zákazníka, že předběžná cena může být následně upravena\n- předběžný termín dokončení (termín, kdy může opravený vůz převzít zákazník)\n- podpis zákazníka\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", není-li kompletně vyplněn zakázkový list."},{"n":"3.3","q":"Je v případě potřeby vyžádána a následně dokladována příslušná dokumentace?","ref":"Požadavky:\nV případě plnění pojišťovny:\n- kopie TP\n- kopie ŘP řidiče v době nehody\n- Záznam o dopravní nehodě\n- zápis o poškození vozidla pořízený pojišťovnou/zástupcem pojišťovny\n- případně vyjádření Policie ČR\n- žádost o devinkulaci\n- zplnomocnění majitele vozidla k zastupování ve vyřízení opravy\n\nNamátková kontrola 5 událostí (v případě více značek 3 události za každou značku)\n\n\"Nesplněno\", není-li k dispozici požadovaná dokumentace."},{"n":"3.4","q":"Byla veškerá poškození (i předchozí poškození, která s nehodou nesouvisí) vyfotografována a zdokumentována a byl na tato poškození zákazník upozorněn?","ref":"Požadavky:\n- nutná fotodokumentace vozidla ze všech stran\n\nNamátková kontrola 5 událostí (v případě více značek 3 události za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"3.5","q":"Jsou v případě rozšíření zakázky dodrženy/realizovány všechny nutné postupy?","ref":"Požadavky:\n- kdy, kdo, s kým a co\n- podpis zákazníka/souhlas pojišťovny\n- je možné odsouhlasení rozšíření zakázky prostřednictvím emailu od zákazníka\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"3.6","q":"Je zákazníkovi servisním partnerem zaručena 24 hodinová odtahová služba?","ref":"Požadavek: \n- vlastní odtahová služba nebo smlouva se společností zajišťující odtahové služby\n\n\"Nesplněno\", pokud servisní partner nedisponuje vlastní odtahovou službou nebo pokud není k dispozici smlouva o spolupráci se společností zajišťující odtahové služby."}]},{"title":"4. Kvalita oprav","items":[{"n":"4.1","q":"Jsou dodržovány technologické postupy?","ref":"Požadavek: \n- servisní partner je povinen dodržovat technologické postupy předepsané výrobcem (např. aplikace antikorozní ochrany) dle dílenské příručky\n\nNamátková kontrola rozpracovaných zakázek na dílně\nAuditor má možnost zkontrolovat aktivní užívání výrobcem předepsaných přípravků (např. 2K Wash Primer, 2K plnič...)\n\n\"Částečně splněno\", dojde-li k nedodržení technologických postupů bez vlivu na kvalitu opravy\n\"Nesplněno\", dojde-li k nedodržení technologických postupů mající vliv na kvalitu opravy"},{"n":"4.2","q":"Používá se při procesu opravy formulář \"Kontrola kvality provedené práce\"?","ref":"Požadavek:\n- formulář \"Kontrola kvality provedené práce\" musí být vždy přiložen ke každé zakázce (slouží pro interní potřeby)\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", chybí-li u více než 1 zakázky požadovaný formulář."},{"n":"4.3","q":"Je po opravě vozu před předáním zákazníkovi provedena a na zakázkovém listě zdokumentována kontrola kvality a výstupní kontrola a v případě relevantních zakázek zkušební jízda?","ref":"Požadavky:\n- \"Kontrola kvality\" - provádí např. mistr dílny, vedoucí servisu či jiná pověřená osoba\n- \"Výstupní kontrola\" - provádí Servisní poradce pro příjem vozů po nehodách\n- musí být zřejmá kompetentní osoba\n- pracovník provádějící výstupní kontrolu nesmí být ten, který provádí opravu nebo kontrolu kvality \n- v případě zkušební jízdy: podpis provádějící osoby, zaznamenat datum, čas, km\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", chybí-li u více než 1 zakázky \"Kontrola kvality\" a nebo \"Výstupní kontrola\" nebo záznam o zkušební jízdě."},{"n":"4.4","q":"Provádí Servisní poradce pro příjem vozů po nehodách kontrolu konečné faktury?","ref":"Požadavky:\n- konečná faktura odpovídá zakázce a je jasně rozdělena na práci a materiál\n(souhlasí cena s rozsahem objednané práce)\n- povinnost uvádět výrobcem normované pracovní pozice (pozice / časy)\n- eliminace duplicit\n- znalost rozsahu provedených prací\n\nNamátková kontrola 5 faktur (v případě více značek 3 faktury za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"4.5","q":"Poskytuje servisní partner - Specialista oprav po nehodách klempířské a lakýrnické práce jiným autorizovaným servisním partnerům s platným certifikátem pro Specialistu oprav po nehodách?","ref":"Požadavek:\n- pokud ano, kontrola faktury/smlouvy se zadavatelem\n- pokud ne, kritérium se nehodnotí\n\nNamátková kontrola 5 faktur/smluv (v případě více značek 3 faktury/smlouvy za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."}]},{"title":"5. Předání vozidla / následné zpracování","items":[{"n":"5.1","q":"Je veškerá dokumentace archivována společně s podepsaným formulářem \"Kontrola kvality provedené práce\", včetně fotodokumentace?","ref":"Požadavek:\n- řádná archivace (možná i elektronická), dostupnost dokumentů (např. zakázkový list, faktura, kalkulace škody...) ze strany servisního partnera za poslední rok\n\n\"Nesplněno\", není-li splněn požadavek dodavatele."},{"n":"5.2","q":"Je zakázka při převzetí vozu zákazníkem podepsána?","ref":"Požadavky: \n- zákazník svým podpisem potvrdí převzetí vozu po opravě\n- požaduje se zaznamenat kromě podpisu i datum a čas, popřípadě doložit převzetí vozu přes Škodabox/Key Box"}]},{"title":"6. Pořádek a čistota na klempírně a lakovně","items":[{"n":"6.1","q":"Je majetek zákazníka vhodnými opatřeními chráněn proti znečištění a poškození?","ref":"Požadavky:\n- ochranné prvky, viz Podmínky dílenského vybavení klempírny\n- demontované díly skladovat mimo vozidlo v uzavřeném prostoru tak, aby byla zachována jejich kvalita (např. v boxech, v regálech, na podstavcích apod.) - nutná identifikace podle zakázky\n- prostory pro uskladnění dílů přizpůsobit počtu průchodů zakázek dílnou \n- v případě otevřeného vozu, je nutné chránit interiér vozu odpovídajícím způsobem (např. krycí folie)\n- v případě svařování, broušení v dílně je nutné zajistit ochranu interiéru a exteriéru všech vozů stojících v dílně\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"6.2","q":"Proběhlo čištění vozidla před opravou, v průběhu opravy a po opravě?","ref":"Požadavek:\n- čištění vozidla před opravou - v případě možnosti mokré čištění exteriéru\n- číštění vozidla v průběhu opravy - v případě potřeby nutno odstranit nečistoty před předáním do lakovny (např. špony v interiéru, nečistoty po svařování apod.)\n- čištění vozidla po opravě - suché (mokré v případě potřeby) čištění interiéru, mokré čištění exteriéru\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"6.3","q":"Odpovídá pořádek a čistota v areálu provozovny/prostorách klempírny a lakovny?","ref":"Požadavky:\n- podlahy, stropy, stěny a vrata se musí udržovat v čistém a nepoškozeném stavu\n- manipulační plochy musí mít zpevněný povrch\n- vozidla před opravou zabezpečit proti dalšímu znehodnocení (např. ochranná plachta)\n- čistota vnitřního prostoru lakovací kabiny\n\nVýše uvedené - v čistém a řádném stavu, bez zjevného poškození.\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"6.4","q":"Je odpad skladován a likvidován dle požadavků výrobce?","ref":"Požadavky:\n- provozně-technická způsobilost\n- čistota\n- zakryté skladování kontajnerů s látkami ohrožující vodní zdroje\n- sběrné místo nesmí být volně přístupné\n- odpad / materiál určený k likvidaci nesmí být zákazníkům viditelný\n- nebezpečný odpad značit identifikačním listem nebezpečného odpadu (dle aktuální vyhlášky č. 83/2016 Sb.)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."}]},{"title":"7. Klempírna / lakovna – dílna a vybavení","items":[{"n":"7.1","q":"Je klempírna vybavena podle zadání dodavatele pro úroveň konstrukčních součástí značky opravované v provozovně?","ref":"Požadavek:\n- viz Podmínky dílenského vybavení klempírny\n\n\"Nesplněno\" je-li vyhodnocení vybavení klempírny hodnoceno jako \"Nesplněno\"."},{"n":"7.2","q":"Je lakovna vybavena podle zadání dodavatele?","ref":"Požadavek: \n- viz Podmínky dílenského vybavení lakovny \n\n\"Nesplněno\" je-li vyhodnocení vybavení lakovny hodnoceno jako \"Nesplněno\"."}]}]},"SK":{"title":"Seznam kontrolních otázek - S+K\n(pro servisní partnery, kteří disponují vlastní klempírnou, ale nemají vlastní lakovnu)","sections":[{"title":"1. Pracoviště Servisního poradce pro příjem vozů po nehodách","items":[{"n":"1.1","q":"Je k dispozici označení pracoviště Servisního poradce pro příjem vozů po nehodách dle požadavků dodavatele?","ref":"Požadavky: povinné CI prvky\nŠA ČR:\n- Pylon na stůl\n- Jmenovka (na stole)\n\nPo ČR: \n- Sekundární značení *\n- Pylon na stůl *\n- Jmenovka (na stole)\n\n* Pokud bude v provozovně separátní pracoviště přijmu oprav vozidel po nehodách, musí být označeno Sekundárním značením, v opačném případě musí mít Pylon na stůl.\n\nPři prvním auditu toto kritérium není hodnoceno.\n\n\"Nesplněno\", není-li pracoviště označeno dle požadavků dodavatele."},{"n":"1.2","q":"Je pracoviště Servisního poradce pro příjem vozů po nehodách vybaveno dle požadavku dodavatele?","ref":"Požadavky:\n- PC s přístupem na internet, fotoaparát/tablet\n- ElsaPro, ETKA, DMS, Laková příručka (Audi)\n- katalog posuzování vad laku\n- reflexní deska (linková / mřížková / rastrová) pro identifikaci drobného poškození laku (důlky)\n\n\"Nesplněno\", není-li pracoviště kompletně vybaveno dle požadavků dodavatele."}]},{"title":"2. Personál a školení","items":[{"n":"2.1","q":"Je k dispozici organigram?","ref":"Požadavek:\n- nutné jmenovitě označit pracovníky klempírny, lakovny a Servisní poradce pro příjem vozů po nehodách.\n\n\"Nesplněno\", není-li k dispozici aktuální organigram."},{"n":"2.2","q":"Jsou vedeny osobní záznamy o vzdělávání jednotlivých Servisních poradců pro příjem vozů po nehodách, pracovníků v oblasti klempírny a lakovny a je na základě toho sestavován plán dalšího vzdělávání?","ref":"Požadavek:\n- plán dalšího vzdělávání, viz vzdělávací systém dodavatele\n- aktivní účast zaměstnanců na dodavatelem vypsaných školeních\n\n\"Nesplněno\", není-li k dispozici záznam pro jednotlivé pracovníky nebo zdokumentovaný plán dalšího vzdělávání."},{"n":"2.3","q":"Konají se v oblasti klempírny a lakovny pravidelně vnitropodniková školení/informativní setkání?","ref":"Požadavky:\nAktuální informace na základě:\n- novinek o produktu\n- dodání technických podkladů\n- obsahů školení a kurzů\n\n- přístup do lakové příručky (pro personál klempírny a lakovny)\n\nnapř. Protokol z porady, Záznam o interním školení\n\n\"Nesplněno\", není-li min. jedna tématická oblast kompletně zdokumentována (seznam účastníků, téma, datum, přístup do lakové příručky)."},{"n":"2.4","q":"Je stanoven servisní poradce pro vykonávání pozice pro příjem vozů po nehodách?","ref":"Požadavky: \n- ano, je stanoven (vztahuje se na všechny servisní poradce, kteří vykonávají příjem vozidel po nehodách)\n- nutně jmenovitě označit v organigramu\n\n\n\"Nesplněno\", není-li stanoven Servisní poradce pro příjem vozů po nehodách."},{"n":"2.5","q":"Odpovídá kvalifikace Servisního poradce pro příjem vozů po nehodách požadavkům dodavatele?","ref":"Požadavek: \n- osoba musí prokázat absolvování kvalifikačních cest vzdělání podle požadavků dodavatele\n\n\"Nesplněno\", není-li předložen certifikát/doklad o absolvovaném školení, případně závazná přihláška/po prvním roce není zahájeno školení."},{"n":"2.6","q":"Je počet kvalifikovaných klempířů dostatečný podle požadavků dodavatele?","ref":"Požadavek: \n\nPo ČR - min. 1\nŠA ČR - min. 1\n\n\"Nesplněno\", není-li počet kvalifikovaných klempířů dostatečný."},{"n":"2.7","q":"Odpovídá kvalifikace všech klempířů požadavkům dodavatele?","ref":"Požadavky: \n- osoba musí prokázat absolvování kvalifikačních cest vzdělání podle požadavků dodavatele\n- certifikát/přihláška\n- nejpozději do 3 měsíců od přiřazení profese/funkce zahájit kvalifikační cestu a max. do 24 měsíců projít kvalifikačním procesesem\n\"Nesplněno\", není-li předložen certifikát/doklad o absolvovaném školení, případně závazná přihláška/po prvním roce není zahájeno školení."}]},{"title":"3. Příjem do servisu","items":[{"n":"3.1","q":"Je zaveden a používán systém pro sjednávání termínů/denní dispozice?","ref":"Požadavky: \n- elektronický plánovací modul v DMS - CZ (v jiných systémech nutno zajistit obdobnou alternativu)\n- zpětná namátková kontrola (v DMS lze vidět neomezeně, změna barvy zakázky)\n\n\"Nesplněno\", není-li používán plánovací modul u vozidel, u kterých není sepsána zakázka."},{"n":"3.2","q":"Je pro každou opravu předložena písemná zakázka?","ref":"Požadavky:\nRozsah zakázky:\n- záhlaví zakázky (údaje o zákazníkovi a vozidle)\n- rozsah zakázky v jasném znění\n- předběžná cena, informovat zákazníka, že předběžná cena může být následně upravena\n- předběžný termín dokončení (termín, kdy může opravený vůz převzít zákazník)\n- podpis zákazníka\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", není-li kompletně vyplněn zakázkový list."},{"n":"3.3","q":"Je v případě potřeby vyžádána a následně dokladována příslušná dokumentace?","ref":"Požadavky:\nV případě plnění pojišťovny:\n- kopie TP\n- kopie ŘP řidiče v době nehody\n- Záznam o dopravní nehodě\n- zápis o poškození vozidla pořízený pojišťovnou/zástupcem pojišťovny\n- případně vyjádření Policie ČR\n- žádost o devinkulaci\n- zplnomocnění majitele vozidla k zastupování ve vyřízení opravy\n\nNamátková kontrola 5 událostí (v případě více značek 3 události za každou značku)\n\n\"Nesplněno\", není-li k dispozici požadovaná dokumentace."},{"n":"3.4","q":"Byla veškerá poškození (i předchozí poškození, která s nehodou nesouvisí) vyfotografována a zdokumentována a byl na tato poškození zákazník upozorněn?","ref":"Požadavky:\n- nutná fotodokumentace vozidla ze všech stran\n\nNamátková kontrola 5 událostí (v případě více značek 3 události za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"3.5","q":"Jsou v případě rozšíření zakázky dodrženy/realizovány všechny nutné postupy?","ref":"Požadavky:\n- kdy, kdo, s kým a co\n- podpis zákazníka/souhlas pojišťovny\n- je možné odsouhlasení rozšíření zakázky prostřednictvím emailu od zákazníka\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"3.6","q":"Je zákazníkovi servisním partnerem zaručena 24 hodinová odtahová služba?","ref":"Požadavek: \n- vlastní odtahová služba nebo smlouva se společností zajišťující odtahové služby\n\n\"Nesplněno\", pokud servisní partner nedisponuje vlastní odtahovou službou nebo pokud není k dispozici smlouva o spolupráci se společností zajišťující odtahové služby."}]},{"title":"4. Kvalita oprav","items":[{"n":"4.1","q":"Jsou dodržovány technologické postupy?","ref":"Požadavek: \n- servisní partner je povinen dodržovat technologické postupy předepsané výrobcem (např. aplikace antikorozní ochrany) dle dílenské příručky\n\nNamátková kontrola rozpracovaných zakázek na dílně\nAuditor má možnost zkontrolovat aktivní užívání výrobcem předepsaných přípravků (např. 2K Wash Primer, 2K plnič...)\n\n\"Částečně splněno\", dojde-li k nedodržení technologických postupů bez vlivu na kvalitu opravy\n\"Nesplněno\", dojde-li k nedodržení technologických postupů mající vliv na kvalitu opravy"},{"n":"4.2","q":"Používá se při procesu opravy formulář \"Kontrola kvality provedené práce\"?","ref":"Požadavek:\n- formulář \"Kontrola kvality provedené práce\" musí být vždy přiložen ke každé zakázce (slouží pro interní potřeby) a po provedení všech klempířských prací musí být odeslán spolu s vozidlem do smluvní lakovny, kde bude po provedení lakařských prací potvrzen a poslán zpět zadavateli\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", chybí-li u více než 1 zakázky požadovaný formulář."},{"n":"4.3","q":"Je po opravě vozu před předáním zákazníkovi provedena a na zakázkovém listě zdokumentována kontrola kvality a výstupní kontrola a v případě relevantních zakázek zkušební jízda?","ref":"Požadavky:\n- \"Kontrola kvality\" - provádí např. mistr dílny, vedoucí servisu či jiná pověřená osoba\n- \"Výstupní kontrola\" - provádí Servisní poradce pro příjem vozů po nehodách\n- musí být zřejmá kompetentní osoba\n- pracovník provádějící výstupní kontrolu nesmí být ten, který provádí opravu nebo kontrolu kvality \n- v případě zkušební jízdy: podpis provádějící osoby, zaznamenat datum, čas, km\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", chybí-li u více než 1 zakázky \"Kontrola kvality\" a nebo \"Výstupní kontrola\" nebo záznam o zkušební jízdě."},{"n":"4.4","q":"Provádí Servisní poradce pro příjem vozů po nehodách kontrolu konečné faktury?","ref":"Požadavky:\n- konečná faktura odpovídá zakázce a je jasně rozdělena na práci a materiál\n(souhlasí cena s rozsahem objednané práce)\n- povinnost uvádět výrobcem normované pracovní pozice (pozice / časy)\n- eliminace duplicit\n- znalost rozsahu provedených prací\n\nNamátková kontrola 5 faktur (v případě více značek 3 faktury za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"4.5","q":"Provádí servisní partner - Specialista oprav po nehodách lakýrnické práce subdodavatelsky u autorizovaného servisního partnera s platným certifikátem pro Specialistu oprav po nehodách?","ref":"Požadavek:\n- kontrola faktury/smlouvy se subdodavatelem\n\nNamátková kontrola 5 faktur/smluv (v případě více značek 3 faktury/smlouvy za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."}]},{"title":"5. Předání vozidla / následné zpracování","items":[{"n":"5.1","q":"Je veškerá dokumentace archivována společně s podepsaným formulářem \"Kontrola kvality provedené práce\", včetně fotodokumentace?","ref":"Požadavek:\n- řádná archivace (možná i elektronická), dostupnost dokumentů (např. zakázkový list, faktura, kalkulace škody...) ze strany servisního partnera za poslední rok\n\n\"Nesplněno\", není-li splněn požadavek dodavatele."},{"n":"5.2","q":"Je zakázka při převzetí vozu zákazníkem podepsána?","ref":"Požadavky: \n- zákazník svým podpisem potvrdí převzetí vozu po opravě\n- požaduje se zaznamenat kromě podpisu i datum a čas, popřípadě doložit převzetí vozu přes Škodabox/Key Box"}]},{"title":"6. Pořádek a čistota na klempírně","items":[{"n":"6.1","q":"Je majetek zákazníka vhodnými opatřeními chráněn proti znečištění a poškození?","ref":"Požadavky:\n- ochranné prvky, viz Podmínky dílenského vybavení klempírny\n- demontované díly skladovat mimo vozidlo v uzavřeném prostoru tak, aby byla zachována jejich kvalita (např. v boxech, v regálech, na podstavcích apod.) - nutná identifikace podle zakázky\n- prostory pro uskladnění dílů přizpůsobit počtu průchodů zakázek dílnou \n- v případě otevřeného vozu, je nutné chránit interiér vozu odpovídajícím způsobem (např. krycí folie)\n- v případě svařování, broušení v dílně je nutné zajistit ochranu interiéru a exteriéru všech vozů stojících v dílně\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"6.2","q":"Proběhlo čištění vozidla před opravou, v průběhu opravy a po opravě?","ref":"Požadavek:\n- čištění vozidla před opravou - v případě možnosti mokré čištění exteriéru\n- číštění vozidla v průběhu opravy - v případě potřeby nutno odstranit nečistoty před předáním do lakovny (např. špony v interiéru, nečistoty po svařování apod.)\n- čištění vozidla po opravě - suché (mokré v případě potřeby) čištění interiéru, mokré čištění exteriéru\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"6.3","q":"Odpovídá pořádek a čistota v areálu provozovny/prostorách klempírny?","ref":"Požadavky:\n- podlahy, stropy, stěny a vrata se musí udržovat v čistém a nepoškozeném stavu\n- manipulační plochy musí mít zpevněný povrch\n- vozidla před opravou zabezpečit proti dalšímu znehodnocení (např. ochranná plachta)\n\nVýše uvedené - v čistém a řádném stavu, bez zjevného poškození.\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"6.4","q":"Je odpad skladován a likvidován dle požadavků výrobce?","ref":"Požadavky:\n- provozně-technická způsobilost\n- čistota\n- zakryté skladování kontajnerů s látkami ohrožující vodní zdroje\n- sběrné místo nesmí být volně přístupné\n- odpad / materiál určený k likvidaci nesmí být zákazníkům viditelný\n- nebezpečný odpad značit identifikačním listem nebezpečného odpadu (dle aktuální vyhlášky č. 83/2016 Sb.)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."}]},{"title":"7. Klempírna – dílna a vybavení","items":[{"n":"7.1","q":"Je klempírna vybavena podle zadání dodavatele pro úroveň konstrukčních součástí značky opravované v provozovně?","ref":"Požadavek:\n- viz Podmínky dílenského vybavení klempírny\n\n\"Nesplněno\" je-li vyhodnocení vybavení klempírny hodnoceno jako \"Nesplněno\"."}]}]},"S":{"title":"Seznam kontrolních otázek - S\n(pro servisní partnery, kteří nedisponují vlastní klempírnou ani vlastní lakovnou)","sections":[{"title":"1. Pracoviště Servisního poradce pro příjem vozů po nehodách","items":[{"n":"1.1","q":"Je k dispozici označení pracoviště Servisního poradce pro příjem vozů po nehodách dle požadavků dodavatele?","ref":"Požadavky: povinné CI prvky\nŠA ČR:\n- Pylon na stůl\n- Jmenovka (na stole)\n\nPo ČR: \n- Sekundární značení *\n- Pylon na stůl *\n- Jmenovka (na stole)\n\n* Pokud bude v provozovně separátní pracoviště přijmu oprav vozidel po nehodách, musí být označeno Sekundárním značením, v opačném případě musí mít Pylon na stůl.\n\nPři prvním auditu toto kritérium není hodnoceno.\n\n\"Nesplněno\", není-li pracoviště označeno dle požadavků dodavatele."},{"n":"1.2","q":"Je pracoviště Servisního poradce pro příjem vozů po nehodách vybaveno dle požadavku dodavatele?","ref":"Požadavky:\n- PC s přístupem na internet, fotoaparát/tablet\n- ElsaPro, ETKA, DMS, Laková příručka (Audi)\n- katalog posuzování vad laku\n- reflexní deska (linková / mřížková / rastrová) pro identifikaci drobného poškození laku (důlky)\n\n\"Nesplněno\", není-li pracoviště kompletně vybaveno dle požadavků dodavatele."}]},{"title":"2. Personál a školení","items":[{"n":"2.1","q":"Je k dispozici organigram?","ref":"Požadavek:\n- nutné jmenovitě označit pracovníky klempírny, lakovny a Servisní poradce pro příjem vozů po nehodách\n\"Nesplněno\", není-li k dispozici aktuální organigram."},{"n":"2.2","q":"Jsou vedeny osobní záznamy o vzdělávání jednotlivých Servisních poradců pro příjem vozů po nehodách, pracovníků v oblasti klempírny a lakovny a je na základě toho sestavován plán dalšího vzdělávání?","ref":"Požadavek:\n- plán dalšího vzdělávání, viz vzdělávací systém dodavatele\n- aktivní účast zaměstnanců na dodavatelem vypsaných školeních\n\n\"Nesplněno\", není-li k dispozici záznam pro jednotlivé pracovníky nebo zdokumentovaný plán dalšího vzdělávání."},{"n":"2.3","q":"Konají se v oblasti klempírny a lakovny pravidelně vnitropodniková školení/informativní setkání?","ref":"Požadavky:\nAktuální informace na základě:\n- novinek o produktu\n- dodání technických podkladů\n- obsahů školení a kurzů\n\n- přístup do lakové příručky (pro personál klempírny a lakovny)\n\nnapř. Protokol z porady, Záznam o interním školení\n\n\"Nesplněno\", není-li min. jedna tématická oblast kompletně zdokumentována (seznam účastníků, téma, datum, přístup do lakové příručky)."},{"n":"2.4","q":"Je stanoven servisní poradce pro vykonávání pozice pro příjem vozů po nehodách?","ref":"Požadavky: \n- ano, je stanoven (vztahuje se na všechny servisní poradce, kteří vykonávají příjem vozidel po nehodách)\n- nutně jmenovitě označit v organigramu\n\n\n\"Nesplněno\", není-li stanoven Servisní poradce pro příjem vozů po nehodách."},{"n":"2.5","q":"Odpovídá kvalifikace Servisního poradce pro příjem vozů po nehodách požadavkům dodavatele?","ref":"Požadavek: \n- osoba musí prokázat absolvování kvalifikačních cest vzdělání podle požadavků dodavatele\n\n\"Nesplněno\", není-li předložen certifikát/doklad o absolvovaném školení, případně závazná přihláška/po prvním roce není zahájeno školení."}]},{"title":"3. Příjem do servisu","items":[{"n":"3.1","q":"Je zaveden a používán systém pro sjednávání termínů/denní dispozice?","ref":"Požadavky: \n- elektronický plánovací modul v DMS - CZ (v jiných systémech nutno zajistit obdobnou alternativu)\n- zpětná namátková kontrola (v DMS lze vidět neomezeně, změna barvy zakázky)\n\n\"Nesplněno\", není-li používán plánovací modul u vozidel, u kterých není sepsána zakázka."},{"n":"3.2","q":"Je pro každou opravu předložena písemná zakázka?","ref":"Požadavky:\nRozsah zakázky:\n- záhlaví zakázky (údaje o zákazníkovi a vozidle)\n- rozsah zakázky v jasném znění\n- předběžná cena, informovat zákazníka, že předběžná cena může být následně upravena\n- předběžný termín dokončení (termín, kdy může opravený vůz převzít zákazník)\n- podpis zákazníka\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", není-li kompletně vyplněn zakázkový list."},{"n":"3.3","q":"Je v případě potřeby vyžádána a následně dokladována příslušná dokumentace?","ref":"Požadavky:\nV případě plnění pojišťovny:\n- kopie TP\n- kopie ŘP řidiče v době nehody\n- Záznam o dopravní nehodě\n- zápis o poškození vozidla pořízený pojišťovnou/zástupcem pojišťovny\n- případně vyjádření Policie ČR\n- žádost o devinkulaci\n- zplnomocnění majitele vozidla k zastupování ve vyřízení opravy\n\nNamátková kontrola 5 událostí (v případě více značek 3 události za každou značku)\n\n\"Nesplněno\", není-li k dispozici požadovaná dokumentace."},{"n":"3.4","q":"Byla veškerá poškození (i předchozí poškození, která s nehodou nesouvisí) vyfotografována a zdokumentována a byl na tato poškození zákazník upozorněn?","ref":"Požadavky:\n- nutná fotodokumentace vozidla ze všech stran\n\n\nNamátková kontrola 5 událostí (v případě více značek 3 události za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"3.5","q":"Jsou v případě rozšíření zakázky dodrženy/realizovány všechny nutné postupy?","ref":"Požadavky:\n- kdy, kdo, s kým a co\n- podpis zákazníka/souhlas pojišťovny\n- je možné odsouhlasení rozšíření zakázky prostřednictvím emailu od zákazníka\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"3.6","q":"Je zákazníkovi servisním partnerem zaručena 24 hodinová odtahová služba?","ref":"Požadavek: \n- vlastní odtahová služba nebo smlouva se společností zajišťující odtahové služby\n\n\"Nesplněno\", pokud servisní partner nedisponuje vlastní odtahovou službou nebo pokud není k dispozici smlouva o spolupráci se společností zajišťující odtahové služby."}]},{"title":"4. Kvalita oprav","items":[{"n":"4.1","q":"Používá se při procesu opravy formulář \"Kontrola kvality provedené práce\"?","ref":"Požadavek:\n- formulář \"Kontrola kvality provedené práce\" musí být vždy přiložen ke každé zakázce (slouží pro interní potřeby) a musí v něm být zaznamenány všechny provedené klempířské a lakýrnické práce, provedené smluvními subdodavateli\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", chybí-li u více než 1 zakázky požadovaný formulář."},{"n":"4.2","q":"Je po opravě vozu před předáním zákazníkovi provedena a na zakázkovém listě zdokumentována kontrola kvality a výstupní kontrola a v případě relevantních zakázek zkušební jízda?","ref":"Požadavky:\n- \"Kontrola kvality\" - provádí např. mistr dílny, vedoucí servisu či jiná pověřená osoba\n- \"Výstupní kontrola\" - provádí Servisní poradce pro příjem vozů po nehodách\n- musí být zřejmá kompetentní osoba\n- pracovník provádějící výstupní kontrolu nesmí být ten, který provádí opravu nebo kontrolu kvality \n- v případě zkušební jízdy: podpis provádějící osoby, zaznamenat datum, čas, km\n\nNamátková kontrola 5 zakázkových listů (v případě více značek 3 zakázky za každou značku)\n\n\"Nesplněno\", chybí-li u více než 1 zakázky \"Kontrola kvality\" a nebo \"Výstupní kontrola\" nebo záznam o zkušební jízdě."},{"n":"4.3","q":"Provádí Servisní poradce pro příjem vozů po nehodách kontrolu konečné faktury?","ref":"Požadavky:\n- konečná faktura odpovídá zakázce a je jasně rozdělena na práci a materiál\n(souhlasí cena s rozsahem objednané práce)\n- eliminace duplicit\n- znalost rozsahu provedených prací\n\nNamátková kontrola 5 faktur (v případě více značek 3 faktury za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"4.4","q":"Provádí servisní partner - Specialista oprav po nehodách klempířské a lakýrnické práce subdodavatelsky u autorizovaného servisního partnera s platným certifikátem pro Specialistu oprav po nehodách?","ref":"Požadavky:\n- konečná faktura odpovídá zakázce a je jasně rozdělena na práci a materiál\n(souhlasí cena s rozsahem objednané práce)\n- povinnost uvádět výrobcem normované pracovní pozice (pozice / časy)\n- eliminace duplicit\n- znalost rozsahu provedených prací\n\nNamátková kontrola 5 faktur (v případě více značek 3 faktury za každou značku)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."}]},{"title":"5. Předání vozidla / následné zpracování","items":[{"n":"5.1","q":"Je veškerá dokumentace archivována společně s podepsaným formulářem \"Kontrola kvality provedené práce\", včetně fotodokumentace?","ref":"Požadavek:\n- řádná archivace (možná i elektronická), dostupnost dokumentů (např. zakázkový list, faktura, kalkulace škody...) ze strany servisního partnera za poslední rok\n\n\"Nesplněno\", není-li splněn požadavek dodavatele."},{"n":"5.2","q":"Je zakázka při převzetí vozu zákazníkem podepsána?","ref":"Požadavky: \n- zákazník svým podpisem potvrdí převzetí vozu po opravě\n- požaduje se zaznamenat kromě podpisu i datum a čas, popřípadě doložit převzetí vozu přes Škodabox/Key Box"}]},{"title":"6. Pořádek a čistota","items":[{"n":"6.1","q":"Je majetek zákazníka vhodnými opatřeními chráněn proti znečištění a poškození?","ref":"Požadavky:\n- prostory pro uskladnění dílů přizpůsobit počtu průchodů zakázek dílnou \n- v případě otevřeného vozu, je nutné chránit interiér vozu odpovídajícím způsobem (např. krycí folie)\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."},{"n":"6.2","q":"Proběhlo čištění vozidla před opravou a po opravě?","ref":"Požadavek:\n- čištění vozidla před opravou - v případě možnosti mokré čištění exteriéru\n- čištění vozidla po opravě - suché (mokré v případě potřeby) čištění interiéru, mokré čištění exteriéru\n\n\"Nesplněno\", nejsou-li splněny požadavky dodavatele."}]}]}},"equipment":{"klempirna":{"title":"Podmínky dílenského vybavení KLEMPÍRNY - Specialista oprav po nehodách","sections":[{"title":"Příjem vozu na klempírnu","items":[{"a":"1","b":"1","name":"Ochranný potah sedadel","vas":[],"sk":{"st":"P","orig":false},"po":{"st":"P","orig":false},"spec":[]},{"a":"2","b":"2","name":"Ochranný potah volantu","vas":[],"sk":{"st":"P","orig":false},"po":{"st":"P","orig":false},"spec":[]},{"a":"3","b":"3","name":"Ochranný potah voliče rychlostí/řadící páky","vas":[],"sk":{"st":"P","orig":false},"po":{"st":"P","orig":false},"spec":[]},{"a":"4","b":"4","name":"Potah prostoru pro nohy","vas":[],"sk":{"st":"P","orig":false},"po":{"st":"P","orig":false},"spec":[]},{"a":"5","b":"5","name":"Měřidlo síly lakové vrstvy","vas":[],"sk":{"st":"P","orig":false},"po":{"st":"P","orig":false},"spec":[]}],"spec":[]},{"title":"Pracovní místo (přípravné a dokončovací práce)","items":[{"a":"6","b":"6","name":"Minimální nutné osvětlení 750 LUX","vas":[],"sk":{"st":"KO","orig":false},"po":{"st":"KO","orig":false},"spec":[]},{"a":"7","b":"7","name":"Pomocný přípravek pro montáž dveří","vas":["VAS 5238A"],"sk":{"st":"P","orig":false},"po":{"st":"P","orig":false},"spec":[]},{"a":"8","b":"8","name":"Uskladňování / ukládání demontovaných dílů","vas":[],"sk":{"st":"P","orig":false},"po":{"st":"P","orig":false},"spec":[{"title":"Uskladňování / ukládání demontovaných dílů","lines":["Demontované díly každého vozu uskladněné v samostatném regálovém systému, v boxu, na podstavcích apod. (nutná identifikace podle zakázky), v krytém odděleném prostoru mimo prostory dílny."],"norm":[]},{"title":"Ukládání dílů do zavazadlového prostoru","lines":["Majetek zákazníka musí být 100% chráněn proti ušpinění a poškození, bez ohledu na to, zda se jedná o vozidlo jako celek nebo díly demontované v rámci opravy vozi   document.querySelectorAll('.search-block').forEach(function(b){ b.classList.remove('hidden'); });
  document.getElementById('noHits').style.display = 'none';
  if (nq.length < 2) return;
  document.querySelectorAll('details.chap').forEach(function(d){
    var rows = d.querySelectorAll('.search-row'), vis = 0;
    rows.forEach(function(r){ var hit = norm(r.textContent).indexOf(nq) >= 0; r.classList.toggle('hidden', !hit); if (hit) { vis++; highlight(r, nq); } });
    // nadpis skupiny zůstane vidět, pokud je vidět některá její položka
    d.querySelectorAll('.grp').forEach(function(g){ var n = g.nextElementSibling; while (n && n.classList.contains('eq')) { if (!n.classList.contains('hidden')) { g.classList.remove('hidden'); break; } n = n.nextElementSibling; } });
    var headHit = norm(d.querySelector('summary').textContent).indexOf(nq) >= 0;
    if (headHit) { rows.forEach(function(r){ r.classList.remove('hidden'); }); vis = rows.length || 1; }
    d.classList.toggle('hidden', !vis);
    if (vis) { d.open = true; if (!d.closest('.varoff')) any = true; }
  });
  var u = document.getElementById('uvod'), uh = norm(u.textContent).indexOf(nq) >= 0; u.classList.toggle('hidden', !uh); if (uh) any = true;
  document.getElementById('noHits').style.display = any ? 'none' : 'block';
}
function highlight(el, nq){
  var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [], n;
  while ((n = w.nextNode())) nodes.push(n);
  nodes.forEach(function(t){
    var s = t.nodeValue, ns = norm(s), i = ns.indexOf(nq);
    if (i < 0 || ns.length !== s.length) return;
    var span = document.createElement('span');
    span.innerHTML = esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i, i+nq.length)) + '</mark>' + esc(s.slice(i+nq.length));
    t.parentNode.replaceChild(span, t);
  });
}
var links = Array.prototype.slice.call(document.querySelectorAll('nav.toc a'));
var obs = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { links.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href')==='#'+e.target.id); }); } }); }, {rootMargin:'-90px 0px -70% 0px'});
document.querySelectorAll('#main section[id], #main details[id]').forEach(function(s){ obs.observe(s); });
})();
</script>
